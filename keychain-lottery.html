<!doctype html>
<html lang="ja" data-theme="budo">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>アクキーくじ</title>
<link rel="icon" type="image/png" href="Icon.png">
<link rel="stylesheet" href="ui/scrollbar.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;700&display=swap">
<link rel="stylesheet" href="ui/kit.css">
<style>
/* このページだけの並べ方。部品の見た目は ui/kit.css */
.page { max-width: 640px; }
.step { display: flex; flex-direction: column; gap: 12px; }
.step[hidden] { display: none; }
.step > h2 { margin: 0; }
.prizes { grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); }
/* 景品 1つ = 四角い下地の中に、上は画像、下は名前のボタン */
.prize { position: relative; display: flex; flex-direction: column; justify-content: flex-end; gap: 6px; min-width: 0; padding: 6px; background: var(--tint); }
/* レアの札:画像の右上に、少しななめに。金ぴかの字(キットに金色が無いので、このページで色を決める) */
.rare-badge {
  --gold-hi: #fff6c2;
  --gold: #f2c230;
  --gold-lo: #b07a10;
  position: absolute;
  top: -8px;
  right: -8px;
  z-index: 1;
  transform: rotate(14deg);
  transform-origin: 30% 100%;
  animation: rareSpring 2.4s ease-out infinite;
  font-size: 16px;
  font-weight: 700;
  letter-spacing: .04em;
  background: linear-gradient(160deg, var(--gold-hi) 0%, var(--gold) 35%, var(--gold-lo) 55%, var(--gold) 70%, var(--gold-hi) 100%);
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
  filter: drop-shadow(0 1px 0 var(--gold-lo)) drop-shadow(0 0 2px var(--box));
  pointer-events: none;
}
.prize .prize-img { background: none; }
/* 景品のボタン(パーツメーカーで作った形。枠線なし・ぷっくり影・浮く・沈む) */
.ub-prize {
  --ub-bw: 0px;
  --ub-bs: solid;
  --ub-r: 14px;
  --ub-px: 6px;
  --ub-py: 6px;
  --ub-fs: 12px;
  white-space: normal;
}
.prize-img { display: block; width: 100%; aspect-ratio: 1; object-fit: contain; background: var(--tint); }
.code-list { display: flex; flex-direction: column; gap: 6px; }
.code-list input { text-transform: uppercase; }
.add-code { align-self: stretch; }
.sub { margin: 0; font-size: 13px; font-weight: 700; color: var(--muted); text-align: center; }
.hits { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 160px)); justify-content: center; gap: 10px; }
/* ばねをはじいたように:大きく揺れて、だんだん小さくなって止まる → 少し休んで、くり返す */
@keyframes rareSpring {
  0% { transform: rotate(14deg); }
  6% { transform: rotate(34deg); }
  13% { transform: rotate(-2deg); }
  20% { transform: rotate(26deg); }
  27% { transform: rotate(5deg); }
  34% { transform: rotate(20deg); }
  41% { transform: rotate(10deg); }
  48% { transform: rotate(16deg); }
  55%, 100% { transform: rotate(14deg); }
}
/* 画像と、その右上の角に乗るレアの札 */
.pic { position: relative; display: block; width: 100%; }
.hits li { position: relative; display: flex; flex-direction: column; align-items: center; gap: 2px; animation: popIn .6s cubic-bezier(.3, 1.6, .5, 1) both; }
.hits .code { font-size: 12px; font-weight: 700; color: var(--muted); }
.hits .name { font-size: 20px; font-weight: 700; color: var(--accent); text-align: center; }
.hits.small { grid-template-columns: repeat(auto-fit, minmax(90px, 110px)); }
.hits.small .name { font-size: 15px; }
@keyframes popIn {
  0% { transform: scale(.2) rotate(-12deg); opacity: 0; }
  100% { transform: none; opacity: 1; }
}
.drawing { display: flex; justify-content: center; padding: 18px 0; }
.drawing[hidden] { display: none; }
.ball { width: 64px; height: 64px; border-radius: 50%; border: var(--border) solid var(--ink); background: linear-gradient(var(--accent) 50%, var(--box) 50%); animation: shake .5s ease-in-out infinite; }
@keyframes shake {
  0%, 100% { transform: rotate(0); }
  25% { transform: rotate(-18deg); }
  75% { transform: rotate(18deg); }
}
.reuse { align-self: flex-start; }
textarea { resize: vertical; }
@media (max-width: 999.98px) {
  input, textarea { font-size: 16px; }
}
</style>
</head>
<body class="bg-dots">
<main class="page">
  <div class="title-wrap">
    <h1 class="title">アクキーくじ</h1>
  </div>

  <!-- 1. コードを入れて引く -->
  <section class="box step" id="stepDraw">
    <h2>景品</h2>
    <div class="tiles prizes" id="items"></div>
    <div class="code-list" id="codeList"></div>
    <button type="button" class="btn add-code" id="addCodeBtn" title="コードの欄を足す" aria-label="コードの欄を足す">+</button>
    <button type="button" class="btn btn--primary btn--block" id="drawBtn">引く</button>
    <p class="status status--error" id="drawErr" hidden></p>
  </section>

  <!-- 2. 結果と送り先 -->
  <section class="box step" id="stepSend" hidden>
    <p class="sub" id="hitLabel" hidden>当たり</p>
    <div class="drawing" id="drawing"><div class="ball"></div></div>
    <ul class="hits" id="hits"></ul>
    <div class="step" id="sendForm" hidden>
      <button type="button" class="btn btn--small reuse" id="reuseBtn" hidden>前回使用した住所を使用</button>
      <div class="fields">
        <label class="field field--wide">氏名<input type="text" id="name" autocomplete="name"></label>
        <div class="field">郵便番号
          <div class="row">
            <input type="text" id="zip" inputmode="numeric" autocomplete="postal-code" placeholder="123-4567" maxlength="8" aria-label="郵便番号">
            <button type="button" class="btn btn--small" id="zipBtn">住所検索</button>
          </div>
        </div>
        <label class="field field--wide">都道府県<input type="text" id="pref" autocomplete="address-level1"></label>
        <label class="field field--wide">市区町村・町名<input type="text" id="city" autocomplete="address-level2"></label>
        <label class="field field--wide">番地<input type="text" id="street" autocomplete="address-line1"></label>
        <label class="field field--wide">建物名・部屋番号<input type="text" id="building" autocomplete="address-line2"></label>
      </div>
      <p class="hint" id="zipMsg" hidden></p>
      <button type="button" class="btn btn--primary btn--block" id="sendBtn">送る</button>
    </div>
    <p class="status status--error" id="sendErr" hidden></p>
  </section>

  <!-- 3. 終わり -->
  <section class="box step" id="stepDone" hidden>
    <p class="sub">受け付けました</p>
    <ul class="hits small" id="doneHits"></ul>
    <button type="button" class="btn btn--primary btn--block" id="againBtn">続けて引く</button>
  </section>
</main>
<script src="ui/util.js"></script>
<script src="ui/site-header.js" defer></script>
<script>
// keychain-lottery_api.gs をデプロイしたウェブアプリの URL
const API_URL = "https://script.google.com/macros/s/AKfycbxiVurAFqdKairO4Jq-9mNzDSDA-R760mkYF0WaQMWFRqYU1QZle0rOWtrFn8qNPVrY_w/exec";
// 前に送った氏名・住所(このブラウザの中だけ)
const SAVE_KEY = "keychain-lottery:address";
// これまでに送った当たり(このブラウザの中だけ)
const HISTORY_KEY = "keychain-lottery:history";
const SHAKE_MS = 1400;
// 郵便番号 → 住所(zipcloud。送るのは郵便番号だけ)
const ZIP_API = "https://zipcloud.ibsnet.co.jp/api/search?zipcode=";
// 送り先の欄(建物名・部屋番号だけ空でもよい)
const FORM_IDS = ["name", "zip", "pref", "city", "street", "building"];
const OPTIONAL_IDS = ["building"];

const ERRORS = {
  code: "コードが見つかりません",
  used: "このコードはもう使われています",
  gone: "なくなった種類がありました。もう一度引いてください",
  nodraw: "もう一度引いてください",
  empty: "景品がなくなりました",
  input: "氏名と住所を入れてください(建物名・部屋番号は空でも大丈夫です)",
  busy: "混み合っています。もう一度押してください",
  bad: "うまく送れませんでした",
  net: "つながりませんでした。もう一度押してください",
  setup: "準備中です"
};

// codes = 入れたコード、hits = 引いた結果 [{ code, result }]、images = 種類の名前 → 画像の URL
let codes = [];
let hits = [];
const images = {};
// 種類の名前 → レアか
const rares = {};
const RARE_HTML = `<span class="rare-badge">レア！</span>`;

async function api(body) {
  if (!API_URL) return { error: "setup" };
  try {
    const res = body
      ? await fetch(API_URL, { method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" }, body: JSON.stringify(body) })
      : await fetch(API_URL);
    return await res.json();
  } catch (err) {
    return { error: "net" };
  }
}

function showErr(el, data) {
  const key = data && data.error;
  let msg = key ? (ERRORS[key] || ERRORS.bad) : "";
  if (key && data.codes && data.codes.length) msg += `(${data.codes.join("、")})`;
  el.textContent = msg;
  el.hidden = !key;
}

function busy(btn, on) {
  btn.disabled = on;
  btn.classList.toggle("is-disabled", on);
}

function show(id) {
  ["stepDraw", "stepSend", "stepDone"].forEach((s) => { $(s).hidden = s !== id; });
}

function loadSaved() {
  try {
    const s = JSON.parse(localStorage.getItem(SAVE_KEY) || "null");
    return s && s.name && s.pref ? s : null;
  } catch (err) {
    return null;
  }
}

// ドライブのサムネイルは透けた部分が黒くなるので、元の画像の URL にする(gs は変えない)。ほかの URL はそのまま
function fullImage(url) {
  const m = String(url || "").match(/^https:\/\/drive\.google\.com\/thumbnail\?id=([\w-]+)/);
  return m ? `https://lh3.googleusercontent.com/d/${m[1]}=s0` : url;
}

// 画像(レアなら画像の右上の角に札)。画像が無いレアは、札だけ返す(入れ物の右上に出る)
function imgHtml(name, src, rare) {
  const url = fullImage(src || images[name]);
  const badge = rare ? RARE_HTML : "";
  return url ? `<span class="pic"><img class="prize-img" src="${esc(url)}" alt="" loading="lazy">${badge}</span>` : badge;
}

// h.img があればそれを使う(前に送った分。今は在庫が無くて images に無いこともある)
function hitHtml(h) {
  const rare = h.rare !== undefined ? h.rare : rares[h.result];
  return `<li>${imgHtml(h.result, h.img, rare)}<span class="name">${esc(h.result)}</span><span class="code">${esc(h.code)}</span></li>`;
}

// このブラウザで送った当たり [{ code, result, img }]
function loadHistory() {
  try {
    const list = JSON.parse(localStorage.getItem(HISTORY_KEY) || "[]");
    return Array.isArray(list) ? list : [];
  } catch (err) {
    return [];
  }
}

function addHistory(results) {
  const list = loadHistory().concat(results.map((r) => ({ code: r.code, result: r.result, img: images[r.result] || "", rare: !!rares[r.result] })));
  try { localStorage.setItem(HISTORY_KEY, JSON.stringify(list)); } catch (err) { /* 覚えられなくても送れている */ }
  return list;
}

async function loadItems() {
  $("items").innerHTML = SPINNER;
  const data = await api();
  if (data.error) {
    $("items").innerHTML = "";
    showErr($("drawErr"), data);
    return;
  }
  data.items.forEach((it) => {
    images[it.name] = it.img;
    rares[it.name] = !!it.rare;
  });
  $("items").innerHTML = data.items.length
    ? data.items.map((it) => `<div class="prize">${imgHtml(it.name, "", it.rare)}<button type="button" class="ub ub--sh-puffy ub--hover-lift ub--press-sink ub-prize">${esc(it.name)}</button></div>`).join("")
    : `<span class="hint">${esc(ERRORS.empty)}</span>`;
}

// コードの欄:1つなら「引く」、2つ以上なら「まとめて引く」。✕ は2つ以上のときだけ
function renderCodeRows() {
  const rows = [...$("codeList").children];
  rows.forEach((row) => { row.querySelector(".del-code").hidden = rows.length < 2; });
  $("drawBtn").textContent = rows.length > 1 ? "まとめて引く" : "引く";
}

function addCodeRow(focus) {
  $("codeList").insertAdjacentHTML("beforeend",
    `<div class="row"><input type="text" placeholder="引換コード" autocomplete="off" aria-label="引換コード">` +
    `<button type="button" class="btn btn--small del-code" title="この欄を消す" aria-label="この欄を消す">✕</button></div>`);
  renderCodeRows();
  if (focus) $("codeList").lastElementChild.querySelector("input").focus();
}

function readCodes() {
  const list = [...$("codeList").querySelectorAll("input")].map((i) => i.value.trim().toUpperCase()).filter(Boolean);
  return [...new Set(list)];
}

async function draw() {
  const list = readCodes();
  if (list.length === 0) return showErr($("drawErr"), { error: "code" });
  showErr($("drawErr"), null);
  codes = list;
  hits = [];
  busy($("drawBtn"), true);
  $("hits").innerHTML = "";
  $("sendForm").hidden = true;
  $("drawing").hidden = false;
  $("hitLabel").hidden = true; // 揺れている間は出さない
  showErr($("sendErr"), null);
  show("stepSend");
  const started = Date.now();
  const data = await api({ action: "draw", codes, draw: codes });
  // 少しだけ揺らしてから出す
  await new Promise((r) => setTimeout(r, Math.max(0, SHAKE_MS - (Date.now() - started))));
  busy($("drawBtn"), false);
  $("drawing").hidden = true;
  if (data.error) {
    show("stepDraw");
    showErr($("drawErr"), data);
    return;
  }
  hits = data.results;
  $("hits").innerHTML = hits.map(hitHtml).join("");
  $("hitLabel").hidden = false;
  $("sendForm").hidden = false;
  $("reuseBtn").hidden = !loadSaved();
}

// 全角の数字・ハイフンを半角にして、数字だけにする
function zipDigits(v) {
  return v.replace(/[０-９]/g, (c) => String.fromCharCode(c.charCodeAt(0) - 0xFEE0)).replace(/[^0-9]/g, "");
}

function zipText(d) {
  return d.length === 7 ? `${d.slice(0, 3)}-${d.slice(3)}` : d;
}

function zipMsg(text) {
  $("zipMsg").textContent = text;
  $("zipMsg").hidden = !text;
}

// 「住所検索」を押したら住所を調べて、都道府県・市区町村・町名を入れる
async function lookupZip() {
  const d = zipDigits($("zip").value);
  if (d.length !== 7) return zipMsg("郵便番号を7けたで入れてください");
  zipMsg("");
  busy($("zipBtn"), true);
  let r = null;
  try {
    const res = await fetch(ZIP_API + d);
    const data = await res.json();
    r = data.results && data.results[0];
  } catch (err) {
    r = null;
  }
  busy($("zipBtn"), false);
  if (!r) {
    zipMsg("住所が見つかりませんでした。手で入れてください");
    return;
  }
  $("zip").value = zipText(d);
  $("pref").value = r.address1;
  $("city").value = r.address2 + r.address3;
  $("street").focus();
}

function readForm() {
  const f = {};
  FORM_IDS.forEach((id) => { f[id] = $(id).value.trim(); });
  f.zip = zipText(zipDigits(f.zip));
  return f;
}

async function send() {
  const f = readForm();
  if (FORM_IDS.some((id) => !OPTIONAL_IDS.includes(id) && !f[id])) return showErr($("sendErr"), { error: "input" });
  // シートの住所の列には、1つにまとめて書く
  const address = `〒${f.zip} ${f.pref}${f.city}${f.street}${f.building ? " " + f.building : ""}`;
  const name = f.name;
  showErr($("sendErr"), null);
  busy($("sendBtn"), true);
  const data = await api({ action: "send", codes, name, address });
  busy($("sendBtn"), false);
  if (data.error === "gone" || data.error === "nodraw") {
    // 引いてから送るまでに、なくなった種類があった → 引く画面に戻す
    show("stepDraw");
    showErr($("drawErr"), data);
    loadItems();
    return;
  }
  if (data.error) return showErr($("sendErr"), data);
  try { localStorage.setItem(SAVE_KEY, JSON.stringify(f)); } catch (err) { /* 覚えられなくても送れている */ }
  // 今回の分だけでなく、このブラウザで送った当たりを全部ならべる
  $("doneHits").innerHTML = addHistory(data.results).map(hitHtml).join("");
  $("codeList").innerHTML = "";
  addCodeRow(false);
  show("stepDone");
}

$("codeList").addEventListener("click", (e) => {
  const del = e.target.closest(".del-code");
  if (!del) return;
  del.parentElement.remove();
  renderCodeRows();
});
$("addCodeBtn").addEventListener("click", () => addCodeRow(true));
$("drawBtn").addEventListener("click", draw);
$("sendBtn").addEventListener("click", send);
$("reuseBtn").addEventListener("click", () => {
  const s = loadSaved();
  if (!s) return;
  FORM_IDS.forEach((id) => { $(id).value = s[id] || ""; });
});
$("zipBtn").addEventListener("click", lookupZip);
// 受け付けたあと、引く画面に戻る(コードの欄は send で1つに戻してある。景品は在庫が変わったので読み直す)
$("againBtn").addEventListener("click", () => {
  showErr($("drawErr"), null);
  show("stepDraw");
  loadItems();
});
addCodeRow(false);
loadItems();
</script>
</body>
</html>
