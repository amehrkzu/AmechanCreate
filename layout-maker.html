<!doctype html>
<html lang="ja" data-theme="mikan">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>レイアウトメーカー</title>
<link rel="icon" type="image/png" href="Icon.png">
<link rel="stylesheet" href="ui/scrollbar.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;700&display=swap">
<link rel="stylesheet" href="ui/kit.css">
<link rel="stylesheet" href="ui/layer-drawer.css">
<style>
/* このページだけの並べ方。部品の見た目は ui/kit.css */
body { font-size: 14px; }
.btn:disabled { cursor: default; }
.app {
  display: grid;
  grid-template-columns: minmax(0, 1fr);
  gap: 14px;
  padding: 14px;
  max-width: 2000px;
  margin: 0 auto;
}
@media (min-width: 1000px) { .app { grid-template-columns: 280px minmax(0, 1fr) 320px; } }

/* 左:追加(部品の一覧)と階層 */
.part-group { margin: 12px 0 6px; font-size: 12px; font-weight: 700; color: var(--muted); }
.part-group:first-of-type { margin-top: 0; }
.part-list { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.part-list .btn { justify-content: flex-start; padding: 3px 10px; font-size: 12px; cursor: grab; overflow: hidden; text-overflow: ellipsis; }
.layer-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 3px; }
.layer-list li { display: flex; align-items: center; gap: 6px; padding: 2px 6px 2px calc(6px + var(--depth, 0) * 14px); border: 2px solid var(--line); border-radius: 10px; cursor: pointer; font-size: 13px; user-select: none; -webkit-user-select: none; }
.layer-list .name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.layer-list .name-input { flex: 1; min-width: 0; padding: 1px 6px; font-size: 13px; border-radius: 6px; }
.layer-list .tag { flex-shrink: 0; font-size: 10px; color: #fff; background: var(--ink); border-radius: 6px; padding: 0 5px; }
.layer-list .no { flex-shrink: 0; font-size: 11px; font-weight: 700; color: var(--muted); }

/* 真ん中:画面 */
.stage { display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.toolbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.toolbar .grow { flex: 1; }
.toolbar .chip[aria-pressed="true"] { background: var(--orange); }
.wrap {
  position: relative;
  height: calc(100dvh - 130px);
  min-height: 360px;
  overflow: auto;
  background: repeating-conic-gradient(#f6ece2 0 25%, #fbf5ef 0 50%) 0 0 / 20px 20px;
  border: var(--border) solid var(--ink);
  border-radius: 12px;
  box-shadow: 0 4px 0 var(--ink-soft);
}
.sizer { position: relative; margin: 16px; }
.screen {
  --z: 1;
  --snap: 8;
  --wf-line: #b3a69b;
  --wf-fill: #f3efeb;
  --wf-btn: #e4ddd6;
  --wf-text: #6a5e55;
  position: absolute;
  left: 0;
  top: 0;
  transform-origin: 0 0;
  transform: scale(var(--z));
  background: #fff;
  color: var(--wf-text);
  font: 14px/1.4 var(--font);
  box-shadow: 0 0 0 1px var(--ink), 0 6px 18px rgba(90, 63, 44, .15);
  touch-action: none;
  user-select: none;
  -webkit-user-select: none;
}
.screen.grid::before {
  content: "";
  position: absolute;
  inset: 0;
  pointer-events: none;
  background-image: linear-gradient(to right, rgba(168, 113, 74, .1) 1px, transparent 1px), linear-gradient(to bottom, rgba(168, 113, 74, .1) 1px, transparent 1px);
  background-size: calc(var(--snap) * 2px) calc(var(--snap) * 2px);
}
/* 1画面の下のはし(これより下はスクロールして見る所) */
.fold { position: absolute; left: 0; right: 0; border-top: calc(2px / var(--z)) dashed rgba(224, 86, 122, .55); pointer-events: none; }

/* 部品(ワイヤーフレーム) */
.lm-item { position: absolute; cursor: move; }
.lm-in { position: absolute; inset: 0; overflow: hidden; display: flex; flex-direction: column; pointer-events: none; }
.lm-item.on { outline: calc(2px / var(--z)) solid var(--accent); outline-offset: calc(2px / var(--z)); }
.wf-label { font-size: 11px; font-weight: 700; color: #a0948a; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.wf-t { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.wf-center { flex: 1; display: grid; place-items: center; text-align: center; padding: 0 6px; }
.wf--box > .lm-in, .wf--drawer > .lm-in, .wf--frame > .lm-in, .wf--card > .lm-in { border: 2px solid var(--wf-line); border-radius: 12px; padding: 6px 10px; background: #fff; }
.wf--box > .lm-in > .wf-t, .wf--drawer > .lm-in > .wf-t { font-weight: 700; }
.wf--frame > .lm-in { border-style: dashed; background: transparent; }
.wf--drawer > .lm-in { border-radius: 0; background: #f7fafd; }
.wf--bar > .lm-in { flex-direction: row; align-items: center; gap: 8px; padding: 0 12px; border-bottom: 2px solid var(--wf-line); background: var(--wf-fill); font-weight: 700; }
.wf--title > .lm-in { justify-content: center; align-items: center; font-size: 22px; font-weight: 700; }
.wf--heading > .lm-in { justify-content: center; font-size: 16px; font-weight: 700; }
.wf--subhead > .lm-in { justify-content: center; font-size: 13px; font-weight: 700; border-top: 2px dashed var(--wf-line); }
.wf--text > .lm-in { font-size: 13px; }
.wf--text .wf-t { white-space: normal; }
.wf--hint > .lm-in { justify-content: center; font-size: 12px; color: #a0948a; }
.wf--btn > .lm-in { border: 2px solid var(--wf-line); border-radius: 999px; background: var(--wf-btn); font-weight: 700; }
.wf--btn.wf--strong > .lm-in { border-width: 3px; border-color: var(--wf-text); }
.wf--btn.wf--danger > .lm-in { color: #c0566f; }
.wf--card > .lm-in { flex-direction: row; align-items: center; gap: 10px; }
.wf-dot { flex-shrink: 0; width: 40px; height: 40px; border: 2px solid var(--wf-line); border-radius: 50%; background: var(--wf-fill); }
.wf--image > .lm-in { border: 2px solid var(--wf-line); background: linear-gradient(to top right, transparent calc(50% - 1px), var(--wf-line) 50%, transparent calc(50% + 1px)), linear-gradient(to bottom right, transparent calc(50% - 1px), var(--wf-line) 50%, transparent calc(50% + 1px)), var(--wf-fill); }
.wf--image .wf-center span { background: #fff; padding: 0 6px; border-radius: 6px; }
.wf-row { flex: 1; display: flex; gap: 4px; align-items: stretch; min-height: 0; }
.wf-seg { flex: 1 1 0; min-width: 0; display: grid; place-items: center; border: 2px solid var(--wf-line); border-radius: 999px; background: #fff; font-size: 12px; font-weight: 700; padding: 0 4px; overflow: hidden; white-space: nowrap; }
.wf-seg:first-child { background: var(--wf-btn); }
.wf--chips .wf-seg { flex: 0 1 auto; padding: 0 10px; }
.wf--seg .wf-row { gap: 0; border: 2px solid var(--wf-line); border-radius: 999px; overflow: hidden; }
.wf--seg .wf-seg { border: 0; border-radius: 0; }
.wf--seg .wf-seg + .wf-seg { border-left: 2px solid var(--wf-line); }
.wf--seg .wf-seg:first-child { background: #fff; }
.wf--avatars .wf-row { gap: 8px; justify-content: center; }
.wf-ava { flex: 0 1 72px; min-width: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font-size: 11px; font-weight: 700; overflow: hidden; }
.wf-ava::before { content: ""; width: 44px; height: 44px; border: 2px solid var(--wf-line); border-radius: 50%; background: var(--wf-fill); }
.wf-input { flex: 1; min-height: 0; border: 2px solid var(--wf-line); border-radius: 8px; background: #fff; display: flex; align-items: center; padding: 0 8px; font-size: 12px; color: #a0948a; }
.wf--field > .lm-in, .wf--area > .lm-in, .wf--range > .lm-in { gap: 3px; }
.wf--select .wf-input::after { content: "▾"; margin-left: auto; }
.wf--row .wf-row { gap: 6px; }
.wf--row .wf-seg { flex: 0 0 auto; padding: 0 12px; background: var(--wf-btn); }
.wf--check > .lm-in { flex-direction: row; align-items: center; gap: 6px; font-size: 13px; }
.wf--check > .lm-in::before { content: ""; flex-shrink: 0; width: 14px; height: 14px; border: 2px solid var(--wf-line); border-radius: 4px; }
.wf-range { flex: 1; display: flex; align-items: center; }
.wf-range::before { content: ""; flex: 1; height: 4px; border-radius: 2px; background: var(--wf-line); }
.wf-range::after { content: ""; width: 14px; height: 14px; margin-left: -60%; border: 2px solid var(--wf-line); border-radius: 50%; background: #fff; }
.wf--list > .lm-in { gap: 3px; }
.wf-li { flex: 1 1 0; min-height: 0; max-height: 34px; display: flex; align-items: center; padding: 0 8px; border: 2px solid var(--wf-line); border-radius: 10px; font-size: 12px; overflow: hidden; white-space: nowrap; }
.wf--status > .lm-in { justify-content: center; font-size: 13px; font-weight: 700; color: #5f9a7c; }
.wf--empty > .lm-in, .wf--foot > .lm-in { border: 2px dashed var(--wf-line); border-radius: 12px; font-size: 12px; }
.wf--foot > .lm-in { border-width: 2px 0 0; border-radius: 0; justify-content: center; padding: 0 2px; }
.wf--spinner > .lm-in { display: grid; place-items: center; }
.wf--spinner > .lm-in::before { content: ""; width: 60%; height: 60%; border: 4px dotted var(--wf-line); border-radius: 50%; }
.wf--sheet .wf-row { flex: 0 0 26px; padding: 0 8px; gap: 3px; }
.wf--sheet .wf-seg { border-radius: 10px 10px 0 0; border-bottom: 0; }
.wf-body { flex: 1; border: 2px solid var(--wf-line); border-radius: 12px; background: var(--wf-fill); }

/* つまみ(大きさを変える) */
.lm-h {
  position: absolute;
  z-index: 5;
  width: calc(12px / var(--z));
  height: calc(12px / var(--z));
  margin: calc(-6px / var(--z)) 0 0 calc(-6px / var(--z));
  background: #fff;
  border: calc(2px / var(--z)) solid var(--accent);
  border-radius: calc(3px / var(--z));
}
/* 吸い付くガイド線(吸い付いている間だけ) */
.guide { position: absolute; z-index: 7; background: #ff4f9a; pointer-events: none; }
.guide--x { top: 0; bottom: 0; width: calc(1px / var(--z)); }
.guide--y { left: 0; right: 0; height: calc(1px / var(--z)); }
/* そろったすき間の印(線と数字) */
.gapm { position: absolute; z-index: 7; background: #ff4f9a; pointer-events: none; }
.gapm--x { height: calc(1px / var(--z)); }
.gapm--y { width: calc(1px / var(--z)); }
.gapm span { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%) scale(calc(1 / var(--z))); background: #ff4f9a; color: #fff; font-size: 11px; font-weight: 700; line-height: 1.4; border-radius: 6px; padding: 0 4px; white-space: nowrap; }
.marquee { position: absolute; z-index: 6; border: calc(1.5px / var(--z)) dashed var(--accent); background: rgba(255, 138, 61, .08); pointer-events: none; }
.ghost { position: fixed; z-index: 100; pointer-events: none; transform: translate(-50%, -50%); background: var(--lemon); border: 2px solid var(--ink); border-radius: 999px; padding: 2px 10px; font-size: 12px; font-weight: 700; }

/* 右:詳細 */
.panel { display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.panel .field + .field, .panel .fields + .field, .panel .field + .fields, .panel .fields + .sub, .panel .field + .sub { margin-top: 10px; }
.panel .actions { margin-top: 12px; }
.sub { margin: 12px 0 6px; font-size: 12px; font-weight: 700; color: var(--muted); }
.kind-name { font-size: 13px; font-weight: 700; color: var(--text); }
.kind-name code { font-size: 12px; color: var(--muted); }
.size-row { display: flex; align-items: center; gap: 6px; margin-top: 8px; }
.size-row input { width: 84px; }
.align-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
.prompt-view { margin-top: 10px; }
.prompt-view textarea { height: 220px; font-family: ui-monospace, monospace; font-size: 12px; }
@media (max-width: 999.98px) {
  .wrap { height: calc(100dvh - 120px); }
  .layer-list .name-input { font-size: 16px; }
}
</style>
<script src="ui/site-header.js" defer></script>
</head>
<body class="bg-dots">
<header class="topbar top" data-site-bar>
  <h1>レイアウトメーカー</h1>
</header>

<main class="app">
  <!-- 左の列:上に「追加」(部品)、下に「階層」。広い画面ではいつも出ていて、狭い画面では前面に出る引き出し -->
  <aside class="layer-drawer" id="layerDrawer" aria-label="レイヤー">
    <section class="box">
      <h2>追加</h2>
      <div id="parts"></div>
      <h2 class="next">階層</h2>
      <ul class="layer-list" id="layers"></ul>
    </section>
    <button type="button" class="layer-handle" id="layerHandle" aria-controls="layerDrawer" aria-expanded="false">☂ レイヤー</button>
  </aside>

  <section class="stage">
    <div class="toolbar">
      <div class="chips" id="screenChips"></div>
      <button type="button" class="switch" id="gridToggle" aria-pressed="true">マス目</button>
      <span class="grow"></span>
      <button type="button" class="btn btn--small" id="undo" title="元に戻す(Ctrl+Z)">↶ 戻す</button>
      <button type="button" class="btn btn--small" id="redo" title="やり直す(Ctrl+Y)">↷ やり直す</button>
      <div class="btn-group">
        <button type="button" id="zoomOut" title="小さく">－</button>
        <button type="button" id="zoomFit" title="幅に合わせる">100%</button>
        <button type="button" id="zoomIn" title="大きく">＋</button>
      </div>
    </div>
    <div class="wrap" id="wrap">
      <div class="sizer" id="sizer">
        <div class="screen" id="screen"></div>
      </div>
    </div>
  </section>

  <aside class="right-drawer" id="rightDrawer" aria-label="詳細">
  <div class="right-tabs" role="tablist" aria-label="詳細の切り替え"><button type="button" role="tab" data-tab="sel" style="--c:#ffcf9f">詳細</button><button type="button" role="tab" data-tab="screen" style="--c:#ffe7a3">画面</button><button type="button" role="tab" data-tab="out" style="--c:#bdeccd">AIに渡す</button></div>
  <div class="panel">
    <section class="box" data-panel="sel">
      <h2>詳細</h2>
      <p class="hint" id="selNone">えらんでいません</p>
      <div id="selOne" hidden>
        <p class="kind-name" id="fKind"></p>
        <label class="field"><span>名前</span><input id="fName" type="text"></label>
        <label class="field"><span>文字</span><input id="fText" type="text"></label>
        <label class="field"><span>メモ(何をする部品か)</span><textarea id="fMemo" rows="2"></textarea></label>
        <div class="fields" style="margin-top:10px">
          <label class="field"><span>横(x)</span><input id="fX" type="number" step="1"></label>
          <label class="field"><span>縦(y)</span><input id="fY" type="number" step="1"></label>
          <label class="field"><span>幅</span><input id="fW" type="number" min="4" step="1"></label>
          <label class="field"><span>高さ</span><input id="fH" type="number" min="4" step="1"></label>
        </div>
        <p class="sub">幅が変わったとき</p>
        <div class="tabs" id="anchorTabs"></div>
        <div class="actions">
          <button type="button" class="btn btn--small" id="fBack" title="ひとつ奥へ">▲ 奥へ</button>
          <button type="button" class="btn btn--small" id="fFront" title="ひとつ手前へ">▼ 手前へ</button>
          <button type="button" class="btn btn--small" id="fDup" title="複製(Ctrl+D)">複製</button>
          <button type="button" class="btn btn--small btn--danger" id="fDel" title="消す(Delete)">消す</button>
        </div>
      </div>
      <div id="selMany" hidden>
        <p class="kind-name" id="manyCount"></p>
        <p class="sub">そろえる</p>
        <div class="align-grid" id="alignBtns">
          <button type="button" class="btn btn--small" data-align="left">左</button>
          <button type="button" class="btn btn--small" data-align="center">真ん中</button>
          <button type="button" class="btn btn--small" data-align="right">右</button>
          <button type="button" class="btn btn--small" data-align="top">上</button>
          <button type="button" class="btn btn--small" data-align="middle">真ん中</button>
          <button type="button" class="btn btn--small" data-align="bottom">下</button>
          <button type="button" class="btn btn--small" data-align="spreadX">横に等間隔</button>
          <button type="button" class="btn btn--small" data-align="spreadY">縦に等間隔</button>
          <button type="button" class="btn btn--small" data-align="sameW">幅をそろえる</button>
        </div>
        <div class="actions">
          <button type="button" class="btn btn--small" id="mDup">複製</button>
          <button type="button" class="btn btn--small btn--danger" id="mDel">消す</button>
        </div>
      </div>
    </section>

    <section class="box" data-panel="screen">
      <h2>画面</h2>
      <label class="field"><span>画面の名前</span><input id="sTitle" type="text" placeholder="例:設定の画面"></label>
      <p class="sub">大きさ</p>
      <div class="size-row">
        <input id="sW" type="number" min="200" max="4000" aria-label="幅">
        <span>×</span>
        <input id="sH" type="number" min="200" max="8000" aria-label="高さ">
        <button type="button" class="btn btn--small" id="sApply">変える</button>
      </div>
      <p class="sub">マス目の大きさ</p>
      <div class="chips" id="snapChips"></div>
      <div class="actions">
        <button type="button" class="btn btn--small btn--danger" id="clearAll">ぜんぶ消す</button>
      </div>
    </section>

    <section class="box" data-panel="out">
      <h2>AIに渡す</h2>
      <div class="actions" style="margin-top:0">
        <button type="button" class="btn btn--primary btn--block" id="copyPrompt">AIプロンプトコピー</button>
        <button type="button" class="btn btn--block" id="copyImage">配置図をコピー</button>
        <button type="button" class="btn btn--small" id="savePng">配置図を PNG で保存</button>
      </div>
      <details class="prompt-view" id="promptView">
        <summary class="hint">中身を見る</summary>
        <textarea id="promptText" readonly></textarea>
      </details>
    </section>
  </div>
  <button type="button" class="right-handle" id="rightHandle" aria-controls="rightDrawer" aria-expanded="false">✿ 詳細</button>
  </aside>
</main>

<script src="ui/layer-drawer.js"></script>
<script src="ui/util.js"></script>
<script>
"use strict";
// ---------- 部品の種類 ----------
// パーツ台帳(ui-kit.html)の部品。画面ではワイヤーフレーム(wf の形)で描く
//   w・h:置いたときの大きさ(w "full" は画面の幅いっぱい、h "rest" は上の帯の下から画面の下まで)。at:押して足したときの位置
//   box:中に部品を入れられる。list:文字を「、」で区切って並べる。anchor:幅が変わったときの最初の動き
const GROUPS = [
  { name: "骨組み", color: "#dccbff" },
  { name: "入れ物", color: "#bfdcff" },
  { name: "ボタン", color: "#ffcf9f" },
  { name: "選ぶ", color: "#ffe7a3" },
  { name: "入力", color: "#bdeccd" },
  { name: "一覧・お知らせ", color: "#ffc6dc" },
];
const KIND_LIST = [
  { key: "topbar", g: 0, name: "上の帯", cls: ".topbar", wf: "bar", w: "full", h: 48, text: "タイトル", box: true, anchor: "stretch", at: [0, 0] },
  { key: "title", g: 0, name: "大見出し", cls: ".title-wrap > .title", wf: "title", w: 320, h: 56, text: "ページの名前", anchor: "center" },
  { key: "heading", g: 0, name: "中見出し", cls: ".heading", wf: "heading", w: 240, h: 30, text: "見出し" },
  { key: "subhead", g: 0, name: "小見出し", cls: ".subhead", wf: "subhead", w: 240, h: 32, text: "小見出し" },
  { key: "text", g: 0, name: "文章", cls: "p", wf: "text", w: 320, h: 48, text: "ここに文章" },
  { key: "hint", g: 0, name: "ひとこと説明", cls: ".hint", wf: "hint", w: 240, h: 22, text: "ひとこと" },
  { key: "drawer", g: 0, name: "レイヤーのサイドバー", cls: ".layer-drawer", wf: "drawer", w: 280, h: "rest", text: "追加・階層", box: true, at: [0, 48] },
  { key: "box", g: 1, name: "箱", cls: ".box", wf: "box", w: 320, h: 200, text: "箱の見出し", box: true },
  { key: "details", g: 1, name: "たためる箱", cls: "details.box", wf: "box", w: 320, h: 160, text: "たためる箱 ▾", box: true },
  { key: "sheet", g: 1, name: "付箋シート", cls: ".sheet-tabs + .sheet-body", wf: "sheet", w: 360, h: 220, text: "タブ1、タブ2、タブ3", list: true, box: true },
  { key: "card", g: 1, name: "リンクカード", cls: ".cards > a.card", wf: "card", w: 280, h: 80, text: "名前" },
  { key: "frame", g: 1, name: "なんでも枠", cls: "(自由)", wf: "frame", w: 240, h: 160, text: "なにか", box: true },

const area = (r) => r.w * r.h;

// ---------- 吸い付くガイド線 ----------
// 吸い付く先:画面の左・真ん中・右/上・真ん中、ほかの部品の左・真ん中・右/上・真ん中・下。見た目で GUIDE_PX 以内なら合わせる(マス目より先)

// すき間をそろえる:同じ行(axis "x")・同じ列(axis "y")の部品とのすき間が

function gapSnap(box, dx, dy, others, axis) {

    if (g > 0 && at >= Math.max(a[q], b[q])) gaps.push({ g, from: a[p] + a[s], at });

    if (prev && Math.abs(lo + d - (prev[p] + prev[s]) - best.g) < 1) mark(prev[p] + prev[s], lo + d, cmid);

    if (sy && (!gy || Math.abs(sy.d) < Math.abs(gy.d))) gy = null;
    const useSx = sx && !gx, useSy = sy && !gy;
    const mx = gx ? Math.round(dx + gx.d) : useSx ? Math.round(dx + sx.d) : snapV(lo.x + dx, e.altKey) - lo.x;
    const my = gy ? Math.round(dy + gy.d) : useSy ? Math.round(dy + sy.d) : snapV(lo.y + dy, e.altKey) - lo.y;
    showGuides(
      [...(gx ? [{ axis: "x", at: gx.at }] : []), ...(gy ? [{ axis: "y", at: gy.at }] : [])],
      [...(useSx ? sx.marks : []), ...(useSy ? sy.marks : [])],
    );
    for (const it of drag.moving) {
      const o = drag.o.get(it.id);
      it.x = o.x + mx;
      it.y = o.y + my;
      const el = itemEl(it.id);
      if (el) placeEl(el, it);
    }
    renderPanel();

    const { o, it, dir, targets } = drag;
    const guides = [];
    let l = o.x, t = o.y, r = o.x + o.w, b = o.y + o.h;
    if (dir.includes("w")) l = Math.min(r - MIN_SIZE, snapEdge(o.x + dx, targets.xs, "x", guides, e.altKey));
    if (dir.includes("e")) r = Math.max(l + MIN_SIZE, snapEdge(o.x + o.w + dx, targets.xs, "x", guides, e.altKey));
    if (dir.includes("n")) t = Math.min(b - MIN_SIZE, snapEdge(o.y + dy, targets.ys, "y", guides, e.altKey));
    if (dir.includes("s")) b = Math.max(t + MIN_SIZE, snapEdge(o.y + o.h + dy, targets.ys, "y", guides, e.altKey));
    showGuides(guides);
    Object.assign(it, { x: l, y: t, w: r - l, h: b - t });
    placeEl(itemEl(it.id), it);
    renderPanel();
  } else {
    const r = { x: Math.min(p.x, drag.start.x), y: Math.min(p.y, drag.start.y), w: Math.abs(dx), h: Math.abs(dy) };
    placeEl(drag.m, r);
    const hit = doc.items.filter((it) => it.x < r.x + r.w && it.x + it.w > r.x && it.y < r.y + r.h && it.y + it.h > r.y).map((it) => it.id);

function endDrag() {

  // 何枚か選んでいるときに、動かさずに押しただけなら、その1つだけを選ぶ
  if (d.mode === "move" && !d.moved) {

// ---------- 部品を足す ----------
// 押すと、見えている所の真ん中に置く。ドラッグして画面の上で離すと、そこに置く(指のときは押すだけ)
function addItem(key, cx, cy) {

  const w = k.w === "full" ? doc.w : k.w;
  const h = k.h === "rest" ? Math.max(40, doc.h - 48) : k.h;
  let x, y;
  if (cx === undefined && k.at) [x, y] = k.at;
  else {

      cy = Math.min(doc.h / 2, (wrap.scrollTop + wrap.clientHeight / 2 - 16) / z);
    }
    x = k.w === "full" ? 0 : Math.max(0, snapV(cx - w / 2));
    y = Math.max(0, snapV(cy - h / 2));
  }
  const n = doc.items.filter((it) => it.kind === key).length + 1;
  const it = { id: ++doc.seq, kind: key, name: `${k.name}${n}`, named: false, x, y, w, h, text: k.text, memo: "", anchor: k.anchor ?? "left" };

}

// ---------- 階層 ----------
function renderLayers() {
  const { kids, roots } = tree();
  const nums = numbering();
  const lis = [];
  const walk = (it, depth) => {
    const li = document.createElement("li");
    li.dataset.id = it.id;
    li.style.setProperty("--depth", depth);
    li.classList.toggle("on", sel.includes(it.id));
    li.innerHTML = `<span class="no">${nums.get(it.id)}</span><span class="name">${esc(it.name)}</span><span class="tag">${esc(GROUPS[KIND[it.kind].g].name)}</span>`;
    lis.push(li);
    (kids.get(it.id) ?? []).forEach((c) => walk(c, depth + 1));
  };
  roots.forEach((it) => walk(it, 0));
  $("layers").replaceChildren(...lis);
}
$("layers").addEventListener("click", (e) => {

// 同じ親の中で、ひとつ奥へ(-1)・手前へ(+1)
function moveSibling(it, dir) {
  const before = snapshot();

  const p = t.par.get(it.id);
  const list = p ? t.kids.get(p.id) : t.roots;
  const i = list.indexOf(it), j = i + dir;
  if (j < 0 || j >= list.length) return;
  [list[i], list[j]] = [list[j], list[i]];
  doc.items = flatten(t);
  commit(before);
}

// 複製・写す・貼る(入れ物は中身ごと)
function cloneItems(list, off) {

}
function pasteItems(list, off) {
  const before = snapshot();
  const { par } = (() => { const items = doc.items; doc.items = list; const t = tree(); doc.items = items; return t; })();
  const clones = cloneItems(list, off);
  doc.items.push(...clones);
  sel = clones.filter((c, i) => !list.includes(par.get(list[i].id))).map((c) => c.id);
  commit(before);
}
function selWithKids() {

}

// そろえる(選んでいるものの外側の四角に合わせる)
function align(how) {
  const t = tree();
  const list = topSelected(t.par);
  if (list.length < 2) return;
  const before = snapshot();
  const L = Math.min(...list.map((it) => it.x)), R = Math.max(...list.map((it) => it.x + it.w));
  const T = Math.min(...list.map((it) => it.y)), B = Math.max(...list.map((it) => it.y + it.h));
  const shift = (it, dx, dy) => {
    for (const c of [it, ...descendants(it, t.kids)]) { c.x += dx; c.y += dy; }
  };
  const spread = (pos, size) => {
    const s = [...list].sort((a, b) => a[pos] - b[pos]);
    const total = s.reduce((n, it) => n + it[size], 0);
    const start = s[0][pos], end = s[s.length - 1][pos] + s[s.length - 1][size];
    const gap = (end - start - total) / (s.length - 1);
    let at = start;
    for (const it of s) {
      const d = Math.round(at) - it[pos];
      shift(it, pos === "x" ? d : 0, pos === "y" ? d : 0);
      at += it[size] + gap;
    }
  };
  for (const it of list) {
    if (how === "left") shift(it, L - it.x, 0);
    if (how === "right") shift(it, R - it.w - it.x, 0);
    if (how === "center") shift(it, Math.round((L + R - it.w) / 2) - it.x, 0);
    if (how === "top") shift(it, 0, T - it.y);
    if (how === "bottom") shift(it, 0, B - it.h - it.y);
    if (how === "middle") shift(it, 0, Math.round((T + B - it.h) / 2) - it.y);
    if (how === "sameW") it.w = Math.max(...list.map((i) => i.w));
  }
  if (how === "spreadX") spread("x", "w");
  if (how === "spreadY") spread("y", "h");
  commit(before);
}
$("alignBtns").addEventListener("click", (e) => {

// ---------- 画面の大きさ ----------
// 幅を変えるとき、部品は「幅が変わったとき」の決まりで、親(無ければ画面)の中で動く。縦の位置はそのまま
function setScreen(w, h) {
  w = Math.min(4000, Math.max(200, Math.round(w) || doc.w));
  h = Math.min(8000, Math.max(200, Math.round(h) || doc.h));
  if (w === doc.w && h === doc.h) { renderScreenPanel(); return; }
  const before = snapshot();
  const { par } = tree();
  const old = new Map(doc.items.map((it) => [it.id, { x: it.x, w: it.w }]));
  const oldScreen = { x: 0, w: doc.w }, newScreen = { x: 0, w };
  for (const it of doc.items) { // 親は子より前に並んでいるので、親から先に決まる
    const p = par.get(it.id);
    const po = p ? old.get(p.id) : oldScreen;
    const pn = p ? { x: p.x, w: p.w } : newScreen;
    const l = it.x - po.x, r = po.x + po.w - (it.x + it.w);
    if (it.anchor === "right") it.x = pn.x + pn.w - r - it.w;
    else if (it.anchor === "center") it.x = Math.round(pn.x + pn.w / 2 + (l - r) / 2 - it.w / 2);
    else if (it.anchor === "stretch") { it.x = pn.x + l; it.w = Math.max(MIN_SIZE, pn.w - l - r); }
    else it.x = pn.x + l;
    // 親からはみ出すときは、親の中に収める(狭くしたとき、画面の外へ消えないように)
    it.w = Math.min(it.w, pn.w);
    it.x = Math.max(pn.x, Math.min(it.x, pn.x + pn.w - it.w));
  }
  doc.w = w;
  doc.h = h;
  if (!zoom) wrap.scrollLeft = 0;
  commit(before);
}

// ---------- AI に渡す文章 ----------
// 上から順に並べる。縦の範囲が重なる兄弟は「横に並ぶ」1行にまとめ、左から並べる
function rowsOf(list) {
  const rows = [];
  for (const it of [...list].sort((a, b) => a.y - b.y || a.x - b.x)) {
    const last = rows[rows.length - 1];
    if (last && it.y < last.bottom - Math.min(it.h, last.minH) / 2) {
      last.items.push(it);
      last.bottom = Math.max(last.bottom, it.y + it.h);
      last.minH = Math.min(last.minH, it.h);
    } else rows.push({ items: [it], bottom: it.y + it.h, minH: it.h });
  }
  return rows.map((r) => r.items.sort((a, b) => a.x - b.x));
}
// 文章と配置図で同じ番号:{ it, level, row(横並びの先頭のときだけ) } を順に返す
function layoutOrder() {
  const t = tree();
  const out = [];
  const walk = (list, level) => {
    for (const row of rowsOf(list)) {
      const lv = row.length > 1 ? level + 1 : level;
      row.forEach((it, i) => {
        out.push({ it, level: lv, row: row.length > 1 && i === 0 ? row : null, rowLevel: level });
        walk(t.kids.get(it.id) ?? [], lv + 1);
      });
    }
  };
  walk(t.roots, 0);
  return { out, par: t.par };
}
function numbering() {
  return new Map(layoutOrder().out.map((e, i) => [e.it.id, i + 1]));
}
function buildPrompt() {
  const { out, par } = layoutOrder();
  const screenName = SCREENS.find((s) => s.w === doc.w && s.h === doc.h)?.name ?? "自由な大きさ";
  const lines = [
    "このレイアウトで画面を作ってください(レイアウトメーカーで配置しました)",
    `- 画面${doc.title.trim() ? `「${doc.title.trim()}」` : ""}:幅 ${doc.w} × 高さ ${doc.h} px(${screenName})`,
    "- 部品は、あめちゃんもの置きのパーツ台帳(ui/kit.css)の名前とクラス。[番号] は配置図の番号と同じ",
    "- 位置・大きさは px。x・y は画面の左上から。字下げは「上の部品の中に入っている」",
    "- position: absolute で固定せず、flex / grid で同じ並びに組む。「横いっぱい」は幅に合わせて伸ばす、「右寄せ」は右にくっつける、「真ん中」は真ん中にそろえる",
  ];
  if (doc.items.some((it) => it.y + it.h > doc.h)) lines.push(`- 高さ ${doc.h}px より下の部品は、スクロールして見る所`);
  lines.push("", "## 配置");
  if (!out.length) lines.push("(まだ何も置いていません)");
  const ind = (n) => "  ".repeat(n);
  out.forEach(({ it, level, row, rowLevel }, i) => {
    if (row) {
      const gaps = row.slice(1).map((b, j) => b.x - (row[j].x + row[j].w));
      lines.push(`${ind(rowLevel)}- 横に並ぶ(左から。すき間 ${gaps.map((g) => (g < 0 ? `${-g}px 重なる` : `${g}px`)).join("・")})`);
    }
    const k = KIND[it.kind];
    const label = it.named ? `${it.name}(${k.name} \`${k.cls}\`)` : `${k.name} \`${k.cls}\``;
    const text = k.key === "spinner" || !it.text.trim() ? "" : k.list ? `「${split(it.text).join("・")}」` : `「${it.text.trim()}」`;
    const p = par.get(it.id);
    const pw = p ? p.w : doc.w, px = p ? p.x : 0;
    let pos = `x ${it.x}, y ${it.y}`;
    if (p) pos += `(親の中で x ${it.x - p.x}, y ${it.y - p.y})`;
    const anchor = ANCHORS.find(([a]) => a === it.anchor)[1];
    const right = it.anchor === "right" ? `(右から ${px + pw - (it.x + it.w)}px)` : "";
    lines.push(`${ind(level)}- [${i + 1}] ${label}${text}:${pos}、幅 ${it.w} × 高さ ${it.h}、${anchor}${right}`);
    if (it.memo.trim()) lines.push(`${ind(level + 1)}メモ:${it.memo.trim().replace(/\s*\n\s*/g, " / ")}`);
  });
  return lines.join("\n");
}
async function copyText(text) {
  try {
    await navigator.clipboard.writeText(text);
    return true;
  } catch {
    const ta = document.createElement("textarea");
    ta.value = text;
    document.body.append(ta);
    ta.select();
    const ok = document.execCommand("copy");
    ta.remove();
    return ok;
  }
}
$("copyPrompt").addEventListener("click", async () => {
  const text = buildPrompt();
  $("promptText").value = text;
  toast(await copyText(text) ? "コピーしました" : "コピーできませんでした");
});
$("promptView").addEventListener("toggle", () => { if ($("promptView").open) $("promptText").value = buildPrompt(); });

// ---------- 配置図(PNG) ----------
// 部品を四角で描いて、文章と同じ番号と名前を書く
function renderImage() {
  const W = doc.w, H = shownH();
  const scale = W < 800 ? 2 : 1;
  const c = document.createElement("canvas");
  c.width = W * scale;
  c.height = H * scale;
  const g = c.getContext("2d");
  g.scale(scale, scale);
  g.fillStyle = "#fff";
  g.fillRect(0, 0, W, H);
  const nums = numbering();
  const font = "\"M PLUS Rounded 1c\", sans-serif";
  for (const it of doc.items) {
    const k = KIND[it.kind];
    g.save();
    g.beginPath();
    g.roundRect(it.x + 1, it.y + 1, Math.max(1, it.w - 2), Math.max(1, it.h - 2), k.box ? 10 : Math.min(8, it.h / 2));
    g.fillStyle = k.box ? "#ffffff" : GROUPS[k.g].color;
    g.fill();
    g.lineWidth = 2;
    g.strokeStyle = "#a8714a";
    if (k.wf === "frame") g.setLineDash([6, 4]);
    g.stroke();
    g.clip();
    const title = `[${nums.get(it.id)}] ${it.named ? it.name : k.name}`;
    const text = k.key === "spinner" ? "" : k.list ? split(it.text).join("・") : it.text.trim();
    g.fillStyle = "#5a3f2c";
    g.textBaseline = "top";
    g.font = `bold 12px ${font}`;
    g.fillText(title, it.x + 6, it.y + 4);
    if (text && it.h >= 34) {
      g.font = `12px ${font}`;
      g.fillText(`「${text}」`, it.x + 6, it.y + 19);
    } else if (text) {
      g.font = `12px ${font}`;
      g.fillText(`「${text}」`, it.x + 12 + g.measureText(title).width + 30, it.y + 4);
    }
    g.restore();
  }
  // 1画面の下のはし
  if (H > doc.h) {
    g.setLineDash([8, 6]);
    g.strokeStyle = "rgba(224, 86, 122, .7)";
    g.lineWidth = 2;
    g.beginPath();
    g.moveTo(0, doc.h);
    g.lineTo(W, doc.h);
    g.stroke();
  }
  return c;
}
const toBlob = (c) => new Promise((ok) => c.toBlob(ok, "image/png"));
$("copyImage").addEventListener("click", async () => {
  try {
    await navigator.clipboard.write([new ClipboardItem({ "image/png": toBlob(renderImage()) })]);
    toast("配置図をコピーしました");
  } catch {
    toast("コピーできませんでした。PNG で保存してください");
  }
});
$("savePng").addEventListener("click", async () => {
  const blob = await toBlob(renderImage());
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = `${(doc.title.trim() || "layout").replace(/[\\/:*?"<>|]/g, "_")}.png`;
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 5000);
});

// ---------- キー ----------
document.addEventListener("keydown", (e) => {
  if (e.target.closest?.("input, select, textarea")) return;
  const k = e.key.toLowerCase();
  const ctrl = e.ctrlKey || e.metaKey;
  if (ctrl && k === "z") { e.preventDefault(); e.shiftKey ? redo() : undo(); return; }
  if (ctrl && k === "y") { e.preventDefault(); redo(); return; }
  if (ctrl && k === "d") { e.preventDefault(); duplicate(); return; }
  if (ctrl && k === "a") { e.preventDefault(); sel = doc.items.map((it) => it.id); renderSelection(); return; }
  if (ctrl && k === "c" && sel.length) { clip = JSON.parse(JSON.stringify(selWithKids())); clip.off = 0; return; }
  if (ctrl && k === "v" && clip) { clip.off += Math.max(8, doc.snap * 2); pasteItems(clip, clip.off); return; }
  if (e.key === "Escape") { sel = []; renderSelection(); return; }
  if ((e.key === "Delete" || e.key === "Backspace") && sel.length) { e.preventDefault(); removeSel(); return; }
  const d = { ArrowLeft: [-1, 0], ArrowRight: [1, 0], ArrowUp: [0, -1], ArrowDown: [0, 1] }[e.key];
  if (d && sel.length) {
    e.preventDefault();
    const step = e.shiftKey ? Math.max(8, doc.snap) : 1;
    const before = snapshot();
    const { par, kids } = tree();
    for (const it of withKids(topSelected(par), kids)) { it.x += d[0] * step; it.y += d[1] * step; }
    commit(before);
  }
});
$("undo").addEventListener("click", undo);
$("redo").addEventListener("click", redo);

// ---------- はじめ ----------
renderParts();
normalize();
render();
</script>
