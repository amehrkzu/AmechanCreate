<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>シンボルエディタ - FF14 キャラカメーカー</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;700&display=swap">
<style>
/* キャラカメーカーと同じパステル・太めの枠線 */
:root {
  --bg: #fff6ee;
  --dot: #ffe6cf;
  --panel: #fffdfc;
  --ink: #a8714a;
  --ink-soft: #ecd0b8;
  --line: #f3e1d0;
  --text: #5a3f2c;
  --muted: #b0907a;
  --accent: #ff8a3d;
  --primary: #ffbf8a;
  --sky: #bfdcff;
  --lemon: #ffe7a3;
  --lilac: #dccbff;
  --danger: #e0567a;
  --danger-bg: #ffe3ea;
  --border: 2.5px;
  color-scheme: light;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  color: var(--text);
  font: 14px/1.55 "M PLUS Rounded 1c", system-ui, sans-serif;
  background-color: var(--bg);
  background-image: radial-gradient(var(--dot) 18%, transparent 19%), radial-gradient(var(--dot) 18%, transparent 19%);
  background-size: 28px 28px;
  background-position: 0 0, 14px 14px;
}
button, label.btn { touch-action: manipulation; }
.top {
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: 10px;
  padding: max(8px, env(safe-area-inset-top)) 14px 8px;
  background: var(--panel);
  border-bottom: var(--border) solid var(--ink);
}
.top h1 { margin: 0; font-size: 16px; white-space: nowrap; background: linear-gradient(transparent 62%, #ffd9b5 62%); padding: 0 2px; }
.top .grow { flex: 1; }
.top input { max-width: 220px; }

.app { display: grid; grid-template-columns: minmax(0, 1fr); gap: 14px; padding: 14px; max-width: 1700px; margin: 0 auto; }
/* 右の列:上に「詳細」、下にプレビュー */
.right { display: flex; flex-direction: column; gap: 14px; min-width: 0; position: sticky; top: 14px; align-self: start; max-height: calc(100vh - 28px); overflow-y: auto; }
@media (min-width: 1000px) { .app { grid-template-columns: 300px minmax(0, 1fr) 340px; } }
/* 「詳細」はサイドバー:ページを下に送っても、いつも見える位置に止まる */
.side { min-width: 0; display: flex; flex-direction: column; }
/* キャラカと同じ、付箋みたいなタブ。選んでいるタブだけ色が濃く、少し上に飛び出して、下のシートとつながる */
.sheet-tabs { display: flex; gap: 4px; padding: 0 10px; position: relative; z-index: 1; margin-bottom: calc(var(--border) * -1); }
.sheet-tab {
  flex: 1 1 auto;
  min-width: 0;
  border: var(--border) solid var(--ink);
  border-bottom: none;
  border-radius: 12px 12px 0 0;
  background: linear-gradient(rgba(255, 255, 255, .5), rgba(255, 255, 255, .5)), var(--c);
  color: var(--muted);
  font: inherit;
  font-size: 13px;
  font-weight: 700;
  padding: 6px 6px 5px;
  margin-top: 6px;
  cursor: pointer;
  white-space: nowrap;
  touch-action: manipulation;
  transition: margin .15s, padding .15s;
}
.sheet-tab[aria-selected="true"] { background: var(--c); color: var(--text); margin-top: 0; padding-bottom: calc(8px + var(--border)); }
.sheet-body {
  min-height: 0;
  overflow-y: auto;
  overscroll-behavior: contain;
  /* 選んでいるタブの色を薄くしいた付箋の紙 */
  background: linear-gradient(rgba(255, 255, 255, .62), rgba(255, 255, 255, .62)), var(--tab-c, var(--lilac));
  border: var(--border) solid var(--ink);
  border-radius: 16px;
  padding: 12px;
  display: flex;
  flex-direction: column;
  gap: 12px;
}
.sheet-body [hidden] { display: none; }
/* 詳細の下の、枠全体の設定(辺の模様の大きさ・すき間) */
.frame-fields { margin-top: 12px; padding-top: 10px; border-top: 2px dashed var(--line); }
.stage { display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.board {
  width: 100%;
  max-height: calc(100vh - 210px);
  margin: 0 auto;
  background: #fff;
  border: var(--border) solid var(--ink);
  border-radius: 20px;
  box-shadow: 0 4px 0 var(--ink-soft);
  overflow: hidden;
}
#editor { display: block; width: 100%; height: 100%; touch-action: none; user-select: none; -webkit-user-select: none; }
#editor.mode-draw { cursor: crosshair; }
.hint { margin: 0; color: var(--muted); font-size: 12px; text-align: center; }

.panel { display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.layer-drawer #addPanel select { width: 100%; }
.box { background: #fff; border: var(--border) solid var(--ink); border-radius: 16px; box-shadow: 0 3px 0 var(--ink-soft); padding: 12px 14px; }
.box h2 { margin: 0 0 10px; font-size: 14px; color: var(--accent); }
.box h2::before { content: "✿ "; }
.field { display: flex; flex-direction: column; gap: 3px; font-size: 12px; font-weight: 700; color: var(--muted); }
.field + .field { margin-top: 8px; }
.field--inline { flex-direction: row; align-items: center; gap: 8px; color: var(--text); }
.field output { color: var(--text); font-weight: 400; }
input, select {
  background: #fff;
  color: var(--text);
  border: 2px solid var(--line);
  border-radius: 10px;
  padding: 6px 9px;
  font: inherit;
  width: 100%;
  accent-color: var(--accent);
}
input:focus, select:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px #ffe6cf; }
input[type="range"] { padding: 0; border: none; box-shadow: none; }
input[type="checkbox"] { width: auto; }
input[type="color"] { width: 44px; height: 34px; padding: 2px; cursor: pointer; flex-shrink: 0; }
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 4px;
  background: #fff;
  color: var(--text);
  border: 2px solid var(--ink);
  border-radius: 999px;
  box-shadow: 0 3px 0 var(--ink-soft);
  padding: 5px 14px;
  font: inherit;
  font-weight: 700;
  cursor: pointer;
  white-space: nowrap;
  transition: transform .08s, box-shadow .08s, background .15s;
}
.btn:hover { background: #fff9f3; }
.btn:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--ink-soft); }
.btn:disabled { opacity: .45; cursor: default; transform: none; }
.btn--primary { background: var(--primary); }
.btn--danger { color: var(--danger); background: var(--danger-bg); }
.btn--small { padding: 2px 10px; font-size: 12px; box-shadow: 0 2px 0 var(--ink-soft); }
.btn[aria-pressed="true"] { background: var(--lemon); }
.toolbar select { width: auto; padding: 3px 8px; font-size: 13px; }
/* 表示の拡大縮小ボタン(キャラカと同じ) */
.zoom-ctl { display: flex; background: #fff; border: 2px solid var(--ink); border-radius: 999px; overflow: hidden; }
.zoom-ctl button { background: none; border: none; color: var(--text); font: inherit; font-size: 13px; font-weight: 700; padding: 1px 9px; cursor: pointer; touch-action: manipulation; }
.zoom-ctl button:hover { background: #fff4ea; }
#zoomFit { min-width: 4.2em; font-size: 11px; border-left: 2px solid var(--line); border-right: 2px solid var(--line); }
.note { margin: 6px 0 0; color: var(--muted); font-size: 12px; }
.color-row { display: flex; gap: 6px; }
#preview { display: block; width: 100%; border-radius: 12px; }
/* サイドバーのレイヤー一覧 */
.layer-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 4px; }
.layer-list li { display: flex; align-items: center; gap: 6px; padding: 3px 6px; border: 2px solid var(--line); border-radius: 10px; cursor: pointer; font-size: 13px; }
.layer-list li.on { border-color: var(--accent); background: #fff4ea; }
/* ドラッグで並べ替え:動かしている行はうすく、差し込む位置にオレンジの線 */
/*   指でなぞるとスクロール、長押しで並べ替えモード(.lifted)になる */
.layer-list li { touch-action: pan-y; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
.layer-list li.lifted { transform: scale(1.03); box-shadow: 0 4px 10px rgba(168, 113, 74, .35); background: #fff; }
.layer-list li.dragging { opacity: .45; }
.layer-list li.drop-below { box-shadow: 0 4px 0 -1px var(--accent); }
.layer-list li.drop-above { box-shadow: 0 -4px 0 -1px var(--accent); }
.layer-list .dot { width: 12px; height: 12px; border-radius: 50%; border: 1px solid var(--ink-soft); flex-shrink: 0; }
.layer-list .dot--cut { background: repeating-linear-gradient(45deg, #fff 0 2px, var(--ink-soft) 2px 4px); border-style: dashed; }
.layer-list .name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.layer-list .name-input { flex: 1; min-width: 0; padding: 1px 6px; font-size: 13px; border-radius: 6px; user-select: text; -webkit-user-select: text; }
.layer-list .tag { font-size: 11px; color: #fff; background: var(--ink); border-radius: 6px; padding: 0 5px; }
.layer-list .btn { padding: 0 6px; font-size: 10px; box-shadow: none; }

@media (max-width: 900px) {
  .app { grid-template-columns: minmax(0, 1fr); }
  .right { position: static; max-height: none; overflow: visible; }
  .sheet-body { overflow: visible; }
  .board { max-height: none; }
  input, select { font-size: 16px; } /* iPhone でタップしたときに拡大されないように */
}
</style>
<link rel="stylesheet" href="scrollbar.css">
<link rel="stylesheet" href="../ui/layer-drawer.css">
<script src="../ui/site-header.js" defer></script>
</head>
<body data-editor="symbol">
<header class="top" data-site-bar>
  <button type="button" class="btn btn--small" id="back">← キャラカに戻る</button>
  <h1>シンボルエディタ</h1>
  <span class="grow"></span>
  <input id="frameName" type="text" placeholder="シンボルの名前" aria-label="シンボルの名前">
  <button type="button" class="btn btn--primary" id="save">保存してキャラカに戻る</button>
</header>

<main class="app">
  <!-- 左の列:上に「追加」、下に「階層(レイヤー)」。広い画面ではいつも出ていて、狭い画面では前面に出る引き出し(ui/layer-drawer.css・.js) -->
  <aside class="layer-drawer" id="layerDrawer" aria-label="追加と階層">
    <section class="box box--fit">
      <h2>追加</h2>
      <div id="addPanel">
        <select id="shapeSelect" aria-label="図形を追加">
          <option value="">図形を追加…</option>
          <option value="circle">● 丸</option>
          <option value="rect">■ 四角</option>
          <option value="diamond">◆ ひし形</option>
          <option value="heart">♥ ハート</option>
          <option value="star">★ 星</option>
        </select>
      </div>
    </section>
    <section class="box">
      <h2>階層</h2>
      <div id="layerPanel"></div>
    </section>
    <button type="button" class="layer-handle" id="layerHandle" aria-controls="layerDrawer" aria-expanded="false">☂ レイヤー</button>
  </aside>
  <section class="stage">
    <div class="row toolbar">
      <button type="button" class="btn btn--small" id="modeToggle" title="描く ⇔ 動かす(Tab)"></button>
      <span style="flex:1"></span>
      <button type="button" class="btn btn--small" id="undo" title="元に戻す(Ctrl+Z)" aria-label="元に戻す">↶</button>
      <button type="button" class="btn btn--small" id="redo" title="やり直す(Ctrl+Y)" aria-label="やり直す">↷</button>
    </div>
    <div class="board" id="board">
      <svg id="editor" xmlns="http://www.w3.org/2000/svg">
        <g id="guideLayer"></g>
        <g id="shapeLayer"></g>
        <g id="overlayLayer"></g>
      </svg>
    </div>
    <div class="row zoom-row">
      <div class="zoom-ctl" role="group" aria-label="表示の拡大縮小">
        <button type="button" id="zoomOut" title="縮小" aria-label="縮小">－</button>
        <button type="button" id="zoomFit" title="元の表示に戻す">100%</button>
        <button type="button" id="zoomIn" title="拡大" aria-label="拡大">＋</button>
      </div>
      <span class="note" style="margin:0">ホイールで拡大縮小 / 右ドラッグ・スペース+ドラッグで表示を動かす</span>
    </div>
    <p class="hint" id="hint"></p>
  </section>

  <aside class="right-drawer" id="rightDrawer" aria-label="詳細">
  <div class="right">
  <aside class="side">
    <nav class="sheet-tabs" role="tablist" aria-label="線と図形">
      <button type="button" class="sheet-tab" role="tab" data-tab="detail" style="--c:#ffcf9f" aria-selected="true">詳細</button>
    </nav>
    <div class="sheet-body" id="sideBody" style="--tab-c:#ffcf9f">
      <section class="box" role="tabpanel" data-panel="detail">
        <h2>詳細</h2>
        <div id="pathPanel"></div>
        <div class="frame-fields">
          <label class="field">
            <span>マスの形</span>
            <select id="symbolRatio"></select>
          </label>
        </div>
      </section>
    </div>
  </aside>

  <aside class="panel">
    <section class="box">
      <h2>プレビュー</h2>
      <canvas id="preview" width="720" height="330"></canvas>
      <p class="note">キャラカで選んでいる配色のアクセント色で表示しています。キャラカでは、置いたシンボルごとに色を選べます。</p>
    </section>
  </aside>
  </div>
  <button type="button" class="right-handle" id="rightHandle" aria-controls="rightDrawer" aria-expanded="false">✿ 詳細</button>
  </aside>
</main>

<script src="templates/index.js"></script>
<script src="../ui/layer-drawer.js"></script>
<script src="frames.js"></script>
<script src="frame-editor.js"></script>
</body>
</html>
