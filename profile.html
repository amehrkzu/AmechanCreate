<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>キャラクター紹介</title>
<link rel="icon" type="image/png" href="Icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;700;800&display=swap" rel="stylesheet">
<style>
  /* キャラごとの色に、ふわっと切り替わるように(色の変数を「色」として登録すると、変化をアニメーションできる) */
  @property --accent { syntax: "<color>"; inherits: true; initial-value: #ff6f9c; }
  @property --accent2 { syntax: "<color>"; inherits: true; initial-value: #b58cff; }
  @property --border { syntax: "<color>"; inherits: true; initial-value: #f5c6d6; }
  @property --bg { syntax: "<color>"; inherits: true; initial-value: #fff5f8; }
  @property --bg2 { syntax: "<color>"; inherits: true; initial-value: #ffe4ee; }
  @property --bg3 { syntax: "<color>"; inherits: true; initial-value: #efe3ff; }
  @property --btn-bg { syntax: "<color>"; inherits: true; initial-value: #fff; }
  @property --btn-fg { syntax: "<color>"; inherits: true; initial-value: #4a3340; }
  :root { transition: --accent .6s, --accent2 .6s, --border .6s, --bg .6s, --bg2 .6s, --bg3 .6s, --btn-bg .6s, --btn-fg .6s; }
  /* ===== 色の調整(キャラ選びの部分)=====
     ここを変えると、まとめて変わる。キャラの色(var(--accent) など)を使って書いてもよい。
     例:選んでいないボタンをキャラの色のうすい色に → --btn-bg: oklch(from var(--accent) .94 calc(c * .4) h);
     キャラごとに変えたいときは、applyCharaColor() で document.documentElement.style.setProperty("--btn-bg", …) のように入れる */
  :root {
    --btn-bg: #fff;                   /* 選んでいないキャラのボタンの色 */
    --btn-fg: var(--text);            /* 選んでいないキャラの名前の色 */
    --btn-on-bg: var(--accent);       /* 選んでいるキャラのボタンの色 */
    --btn-on-fg: #fff;                /* 選んでいるキャラの名前の色(明るいキャラ色のときは、下の .light-color で濃いキャラ色) */
    --face-bg: linear-gradient(135deg, var(--bg2), var(--bg3)); /* 画像がないキャラの顔アイコンの中の色 */
  }
  @media (prefers-reduced-motion: reduce) { :root { transition: none; } }
  :root {
    --bg: #fff5f8;
    --bg2: #ffe4ee;
    --bg3: #efe3ff; /* 右下のぼかし・アバターのグラデーションの相手 */
    --card: #ffffff;
    --text: #4a3340;
    --muted: #9a7a8a;
    --accent: #ff6f9c;
    --accent2: #b58cff;
    --border: #f5c6d6;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    font-family: "M PLUS Rounded 1c", sans-serif;
    color: var(--text);
    background: var(--bg);
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 48px 16px;
  }
  /* 背景のもわもわ:色の雲(.mofu > i)が、画面のうしろでゆっくり漂う。
     動かすのは transform(位置・大きさ)だけなので、画面の描き直しがほとんど起きず軽い。雲の色はキャラの色に合わせて変わる */
  .mofu { position: fixed; inset: 0; z-index: -1; overflow: hidden; pointer-events: none; }
  .mofu i {
    position: absolute;
    width: 75vmax;
    height: 75vmax;
    border-radius: 50%;
    background: radial-gradient(circle, var(--c) 0%, transparent 65%);
    will-change: transform;
    animation: mofu 10s ease-in-out infinite alternate;
  }
  .mofu i:nth-child(1) { --c: var(--bg2); left: -30vmax; top: -35vmax; }
  .mofu i:nth-child(2) { --c: var(--bg3); right: -30vmax; bottom: -35vmax; animation-duration: 13s; animation-delay: -5s; }
  .mofu i:nth-child(3) { --c: var(--border); left: 20vw; top: 30vh; width: 55vmax; height: 55vmax; opacity: .7; animation-duration: 16s; animation-delay: -9s; }
  @keyframes mofu {
    0% { transform: translate(0, 0) scale(1); }
    33% { transform: translate(30vw, 20vh) scale(1.25); }
    66% { transform: translate(-15vw, 35vh) scale(.85); }
    100% { transform: translate(20vw, -15vh) scale(1.15); }
  }
  @media (prefers-reduced-motion: reduce) { .mofu i { animation: none; } }
  h1 {
    margin: 0 0 32px;
    font-size: clamp(1.6rem, 5vw, 2.4rem);
    font-weight: 800;
    background: linear-gradient(90deg, var(--accent), var(--accent2));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    letter-spacing: 0.05em;
  }

  /* キャラクターボタン */
  .char-list {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 12px;
    width: min(880px, 100%);
  }
  /* ためし:スマブラのキャラ選択みたいに、ボタンをすき間なくくっつけて並べる(.char-list--packed。HTML から外せば元に戻る)
     ボタンの幅をそろえて(--pw)、となりのボタンの斜めの辺どうしが重なるように左へずらす(形の上の辺は幅の 5%〜80%、下の辺は 20%〜95%
     → 幅の 25% ぶん重ねる)。上下は、形の上下の余白(高さの 10% ずつ = 5px)ぶん重ねる */
  .char-list--packed { --pw: 270px; /* 名前が、となりのボタンに重なる所まで届かない幅 */ gap: 0; flex-direction: column; align-items: center; }
  /* 段(layoutRows() が作る)。段の人数は「多い・少ない」の交互なので、真ん中にそろえると半分ずつずれた段々になる */
  .char-row { display: flex; justify-content: center; padding-left: calc(var(--pw) * .25); margin-bottom: -10px; }
  .char-list--packed .char-btn { width: var(--pw); margin-left: calc(var(--pw) * -.25); }
  /* UIパーツメーカーで作った「ひし形」のボタン(右に傾いた平行四辺形。ui/kit.css の自由ボタン .ub の、自分で描いた形・影なし・押すと沈む を、
     このページ用にまとめたもの)。形はボタンそのものを clip-path で切り抜く。枠線なし。顔アイコンも同じ傾き */
  .ub-chara-slant {
    --ub-bg: var(--btn-bg);
    --ub-fg: var(--btn-fg);
    --ub-bd: color-mix(in oklab, var(--accent) 45%, #6b4a5c); /* キャラごとの色に合わせる */
    --ub-sh: var(--border);
    --ub-bw: 0px;
    position: relative;
    isolation: isolate;
    display: inline-flex;
    align-items: center;
    gap: 10px;
    /* 上下:ボタンの形はマスの上下 10% ずつ内側に描いてあるので、顔アイコン(高さ 40px)がちょうど形の上下にくっつく余白(40 ÷ 8 = 5px)。
       右は傾いた分だけ広め。左は、顔アイコンを斜めの辺にくっつける(--edge-x) */
    padding: 5px 30px 5px 0;
    /* 高さは 50px に固定(文字の大きさやフォントで高さが変わると、顔アイコンが形の上下からずれるため)。顔アイコン 40px が真ん中 = 上下 5px */
    box-sizing: border-box;
    height: 50px;
    /* 形:ボタンそのものを平行四辺形に切り抜く。中の顔アイコンのはみ出しも、ここで切れる */
    background: var(--ub-bg);
    clip-path: polygon(5% 10%, 80% 10%, 95% 90%, 20% 90%);
    color: var(--ub-fg);
    border: 0;
    font: inherit;
    font-weight: 700;
    font-size: 1rem;
    line-height: 1.4;
    white-space: nowrap;
    cursor: pointer;
    transition: transform .12s;
  }
  .ub-chara-slant:focus-visible { filter: brightness(.9); } /* 切り抜くと枠が見えないので、キーボードで選んだときは少し暗く */
  .ub-chara-slant:hover { transform: translateY(-3px); z-index: 1; } /* のせると浮く(となりと重なっているので、前に出す) */
  .ub-chara-slant:active { transform: translateY(2px); }
  /* 選んでいるキャラ */
  .ub-chara-slant[aria-pressed="true"] { --ub-bg: var(--btn-on-bg); --ub-fg: var(--btn-on-fg); }
  /* キャラの色が明るい(白っぽい)とき(<html class="light-color">):アクセント色の文字と、選んでいるボタンの文字を、
     キャラの色を濃く・鮮やかにした色(--accent-deep。色味はそのまま、明るさを 1/4 だけ下げる)にして読みやすくする */
  :root {
    --accent-deep: color-mix(in oklab, var(--accent) 75%, #3d2b36); /* 古いブラウザ向け */
    --accent-deep: oklch(from var(--accent) calc(l * .75) calc(c * 1.8) h);
  }
  .light-color .avatar,
  .light-color .profile-name,
  .light-color .extra-title,
  .light-color .extra.full .extra-caption,
  .light-color .secret.found { color: var(--accent-deep); }
  .light-color { --btn-on-fg: var(--accent-deep); }
  .light-color h1 { background-image: linear-gradient(90deg, var(--accent-deep), color-mix(in oklab, var(--accent-deep) 70%, var(--accent2))); }
  @media (prefers-reduced-motion: reduce) { .ub-chara-slant { transition: none; } }
  /* 隠しキャラ:ふだんは文字が透明。ドラッグで選ぶと色が付いて見え、そのあとは押せる */
  .secret-line {
    width: min(880px, 100%);
    min-height: 1.8em;
    margin: 12px 0 0;
    text-align: center;
    -webkit-user-select: text;
    user-select: text;
  }
  .secret-line:empty { display: none; } /* 隠しキャラがいないときは、すき間を作らない */
  .secret {
    font-weight: 700;
    color: transparent;
    padding: 0 .4em;
    cursor: text;
  }
  .secret::selection { color: var(--accent); background: #ffe1ec; }
  .secret.found {
    color: var(--accent);
    cursor: pointer;
    text-decoration: underline dotted;
    text-underline-offset: 4px;
  }
  .secret.found:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
  .char-btn .avatar {
    width: 60px;
    height: 40px;
    font-size: 1rem;
  }
  /* 顔アイコン:UIパーツメーカーで作った「ひし形」(右に傾いた平行四辺形。枠線なし・影なし)。
     形は clip-path で切り抜く */
  .avatar-wrap { display: inline-flex; flex-shrink: 0; }
  /* ボタンの中の顔アイコン:ボタンの左の斜めの辺にくっつけて、同じ傾きの平行四辺形にする(--edge-x・--slant は fitSlant() が測って入れる) */
  /* 顔アイコンは、形の上下より2px・左の辺より4px 大きく置いて、はみ出た分はボタンの切り抜き(clip-path)で消す。
     こうすると、拡大率や小数点の丸めで、顔と形のあいだに すき間 ができない。右の斜めの辺だけ、顔アイコン自身で切る */
  .ub-chara-slant .avatar-wrap { margin: -2px 0 -2px calc(var(--edge-x, 12px) - 4px); }
  .ub-chara-slant .avatar { clip-path: polygon(0 0, calc(100% - var(--slant, 10px)) 0, 100% 100%, 0 100%); }
  /* 傾きが大きいほど見える幅がせまくなるので、傾いた分だけ幅を足す(見える幅は、いつも 50px くらい) */
  .char-btn.ub-chara-slant .avatar { width: calc(54px + var(--slant, 10px)); height: 44px; }
  .avatar {
    clip-path: polygon(0 0, 83.3% 0, 100% 100%, 16.7% 100%);
    background: var(--face-bg); /* 白いボタンの上でも形が見えるように、うすいキャラ色(「色の調整」の --face-bg) */
    object-fit: cover;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 800;
    color: var(--accent);
    flex-shrink: 0;
  }

  /* プロフィールカード */
  .profile {
    scroll-margin-top: 24px; /* キャラを押してここまでスクロールしたとき、上に少し余白 */
    margin-top: 40px;
    width: min(720px, 100%);
    background: var(--card);
    border: 2px solid var(--border);
    border-radius: 24px;
    padding: 32px;
    box-shadow: 0 8px 24px rgba(181, 140, 255, 0.12);
  }
  .profile.pop { animation: pop .45s ease; }
  @keyframes pop {
    0% { transform: scale(.96); opacity: 0; }
    60% { transform: scale(1.01); opacity: 1; }
    100% { transform: scale(1); }
  }
  .profile-head {
    display: flex;
    align-items: center;
    gap: 24px;
    margin-bottom: 24px;
  }
  .profile-head .avatar {
    width: 220px;
    height: 150px;
    font-size: 3.5rem;
  }
  .profile-name {
    margin: 0;
    font-size: clamp(1.6rem, 6vw, 2.2rem);
    font-weight: 800;
    color: var(--accent);
    word-break: break-word;
  }
  .fields {
    margin: 0;
    display: grid;
    grid-template-columns: max-content 1fr;
    border-top: 2px dashed var(--border);
  }
  .fields dt, .fields dd {
    margin: 0;
    padding: 12px 8px;
    border-bottom: 2px dashed var(--border);
    line-height: 1.8;
  }
  .fields dt {
    font-weight: 700;
    color: var(--accent2);
    padding-right: 24px;
    white-space: nowrap;
  }
  .fields dd {
    white-space: pre-wrap;
    word-break: break-word;
  }
  .placeholder, .loading {
    color: var(--muted);
    text-align: center;
    line-height: 1.8;
    margin: 40px 0;
  }
  /* ぐるぐる(読み込み中)。パーツ台帳の「ぐるぐる」(ui/kit.css の .spinner)と同じ */
  .spinner { position: relative; display: block; width: 36px; height: 36px; margin: 0 auto 10px; animation: spinner 1s steps(8) infinite; }
  .spinner i { position: absolute; left: 50%; top: 0; width: 7px; height: 7px; margin-left: -3.5px; border-radius: 50%; background: var(--accent); transform-origin: 3.5px 18px; }
  .spinner i:nth-child(1) { transform: rotate(0deg); }
  .spinner i:nth-child(2) { transform: rotate(45deg); opacity: .88; }
  .spinner i:nth-child(3) { transform: rotate(90deg); opacity: .76; }
  .spinner i:nth-child(4) { transform: rotate(135deg); opacity: .64; }
  .spinner i:nth-child(5) { transform: rotate(180deg); opacity: .52; }
  .spinner i:nth-child(6) { transform: rotate(225deg); opacity: .4; }
  .spinner i:nth-child(7) { transform: rotate(270deg); opacity: .28; }
  .spinner i:nth-child(8) { transform: rotate(315deg); opacity: .16; }
  @keyframes spinner { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { .spinner { animation-duration: 3s; } }
  .error {
    color: #d0507a;
    text-align: center;
    line-height: 1.8;
    margin: 40px 0;
  }

  /* 補足ブロック（スクロールで表示） */
  .extras {
    width: min(720px, 100%);
    display: flex;
    flex-direction: column;
    gap: 32px;
    margin-top: 32px;
  }
  .extras:empty { display: none; }
  .extra {
    background: var(--card);
    border: 2px solid var(--border);
    border-radius: 24px;
    overflow: hidden;
    box-shadow: 0 8px 24px rgba(181, 140, 255, 0.12);
    opacity: 0;
    transform: translateY(32px);
    transition: opacity .7s ease, transform .7s ease;
  }
  .extra.shown { opacity: 1; transform: none; }
  .extra img {
    display: block;
    width: 100%;
    cursor: zoom-in;
    background: linear-gradient(135deg, var(--bg2), var(--bg3));
  }
  .extra-title {
    margin: 0 0 8px;
    font-size: 1.25rem;
    font-weight: 800;
    color: var(--accent);
  }
  .extra-body {
    margin: 0;
    line-height: 1.9;
    white-space: pre-wrap;
    word-break: break-word;
  }

  /* 画像だけ／画像＋見出し：大きく表示 */
  .extra.full img {
    max-height: 85vh;
    object-fit: contain;
  }
  .extra.full .extra-caption {
    padding: 12px 20px;
    text-align: center;
    font-weight: 700;
    color: var(--accent);
  }

  /* 画像＋本文：左右に並べる */
  .extra.split {
    display: grid;
    grid-template-columns: 2fr 3fr;
  }
  .extra.split.reverse { grid-template-columns: 3fr 2fr; }
  .extra.split.reverse .extra-media { order: 2; }
  .extra.split img {
    height: 100%;
    min-height: 240px;
    object-fit: cover;
  }
  .extra.split .extra-text { padding: 28px; align-self: center; }

  /* 文章だけ */
  .extra.text { padding: 28px 32px; }

  /* 拡大表示 */
  .lightbox {
    position: fixed;
    inset: 0;
    background: rgba(40, 20, 35, 0.85);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 16px;
    z-index: 100;
    cursor: zoom-out;
  }
  .lightbox[hidden] { display: none; }
  .lightbox img {
    max-width: 100%;
    max-height: 100%;
    object-fit: contain;
    border-radius: 12px;
  }

  @media (max-width: 560px) {
    .extra.split, .extra.split.reverse { grid-template-columns: 1fr; }
    .extra.split.reverse .extra-media { order: 0; }
    .extra.split img { height: auto; min-height: 0; max-height: 60vh; }
    .extra.split .extra-text, .extra.text { padding: 20px; }
  }

  @media (prefers-reduced-motion: reduce) {
    .extra { opacity: 1; transform: none; transition: none; }
  }

  @media (max-width: 560px) {
    .profile { padding: 24px 20px; }
    .profile-head { flex-direction: column; text-align: center; gap: 16px; }
    .profile-head .avatar { width: 190px; height: 130px; }
    .fields { grid-template-columns: 1fr; }
    .fields dt { padding-bottom: 0; border-bottom: none; }
    .fields dd { padding-top: 4px; }
  }
  /* 著作権の表記(FF14 の素材を使っているため) */
  .site-foot { margin: 48px auto 20px; padding: 0 16px; max-width: 720px; text-align: center; color: var(--muted); font-size: 11px; line-height: 1.6; }
  .site-foot p { margin: 2px 0; }
  .site-foot a { color: var(--muted); }
</style>
<script src="ui/site-header.js" defer></script>

<body>
<div class="mofu" aria-hidden="true"><i></i><i></i><i></i></div>

<h1>キャラクター紹介</h1>

<div class="char-list char-list--packed" id="charList"></div>

<!-- 隠しキャラ:見えない文字で名前が書いてある。ドラッグで文字を選ぶ(反転させる)と見つかる -->
<p class="secret-line" id="secretLine"></p>

<div class="profile" id="profile"></div>

<div class="extras" id="extras"></div>

<div class="lightbox" id="lightbox" hidden><img alt=""></div>

<footer class="site-foot">
  <p>記載されている会社名・製品名・システム名などは、各社の商標、または登録商標です。</p>
  <p>(C) SQUARE ENIX / <a href="https://support.jp.square-enix.com/rule.php?id=5382&tag=authc" target="_blank" rel="noopener">FINAL FANTASY XIV 著作物利用条件</a></p>
</footer>

<script>
// ============================================================
// 設定
// ============================================================
// プロフィール用 Apps Script をデプロイしたときの「ウェブアプリのURL」（…/exec）を貼る。
// 空のままだと下のサンプルデータで表示する。
const API_URL = "https://script.google.com/macros/s/AKfycbzEx5Zlj5aTzs9NCNnG8uQKBttbc6Jljo-sVfrgnnxJQGLKHtHGkbypVk3eHbfy5Kvt9g/exec";

const SAMPLE_DATA = {
  characters: [
    { name: "キャラA", image: "", fields: [
      { label: "誕生日", value: "4月1日" },
      { label: "身長", value: "165cm" },
      { label: "好きなもの", value: "甘いもの、昼寝" },
      { label: "紹介文", value: "ここに紹介文が入ります。\n改行もできます。" },
    ], extras: [
      { title: "画像＋本文", body: "画像と文章があるブロックは左右に並びます。\nスマホでは縦並びになります。", image: "https://picsum.photos/id/1011/800/800" },
      { title: "", body: "", image: "https://picsum.photos/id/1015/1600/900" },
      { title: "左右は交互", body: "2つ目の左右並びブロックは、画像が右側に来ます。", image: "https://picsum.photos/id/1025/800/800" },
      { title: "画像＋見出しだけ", body: "", image: "https://picsum.photos/id/1035/900/1400" },
      { title: "文章だけ", body: "画像のないブロックは文章だけのカードになります。", image: "" },
    ]},
    { name: "キャラB", image: "", fields: [
      { label: "誕生日", value: "12月24日" },
      { label: "身長", value: "178cm" },
      { label: "好きなもの", value: "" },
      { label: "紹介文", value: "空欄の項目は表示されません。" },
    ]},
    { name: "キャラC", image: "", fields: [] },
  ],
};

// ============================================================
// 表示
// ============================================================
const charList = document.getElementById("charList");
const profile = document.getElementById("profile");

let characters = [];

async function loadData() {
  if (!API_URL) return SAMPLE_DATA;
  const res = await fetch(API_URL);
  if (!res.ok) throw new Error(res.status);
  return res.json();
}

function initial(name) {
  return escapeHtml([...name][0] || "?");
}

// 顔アイコン。外側の .avatar-wrap は、ボタンの斜めの辺に合わせて位置を決めるための入れ物
function avatarHtml(ch) {
  if (ch.image) {
    return `<span class="avatar-wrap"><img class="avatar" src="${escapeHtml(ch.image)}" alt=""
      data-initial="${initial(ch.name)}" referrerpolicy="no-referrer"></span>`;
  }
  return `<span class="avatar-wrap"><div class="avatar">${initial(ch.name)}</div></span>`;
}

// 画像の読み込みに失敗したらイニシャル表示に差し替える
function attachAvatarFallback(root) {
  root.querySelectorAll("img.avatar").forEach(img => {
    img.addEventListener("error", () => {
      const div = document.createElement("div");
      div.className = "avatar";
      div.textContent = img.dataset.initial;
      img.replaceWith(div);
    }, { once: true });
  });
}

// 「プロフィール」シートに「隠し」という見出しの列を作り、何か書いたキャラは隠しキャラにする
//   (「隠し」の列はプロフィールの項目としては表示しない)
const SECRET_LABEL = "隠し";
// 「カラー」という見出しの列に色を書いたキャラは、選んだときにページの色がその色になる(プロフィールの項目としては表示しない)
const COLOR_LABEL = "カラー";
const HIDDEN_LABELS = [SECRET_LABEL, COLOR_LABEL];
// 色の明るさ(0 = 黒 〜 1 = 白。WCAG の相対輝度)。色の名前(skyblue など)も、canvas に通して #rrggbb にしてから計る
function luminance(color) {
  const g = document.createElement("canvas").getContext("2d");
  g.fillStyle = "#000";
  g.fillStyle = color;
  const m = /^#([0-9a-f]{2})([0-9a-f]{2})([0-9a-f]{2})/i.exec(g.fillStyle);
  if (!m) return 0;
  const lin = (h) => { const c = parseInt(h, 16) / 255; return c <= 0.03928 ? c / 12.92 : ((c + 0.055) / 1.055) ** 2.4; };
  return 0.2126 * lin(m[1]) + 0.7152 * lin(m[2]) + 0.0722 * lin(m[3]);
}
function applyCharaColor(ch) {
  const v = String((ch.fields || []).find(f => f.label === COLOR_LABEL)?.value ?? "").trim();
  const root = document.documentElement.style;
  const keys = ["--accent", "--accent2", "--border", "--bg", "--bg2", "--bg3"];
  if (!v || !CSS.supports("color", v)) {
    keys.forEach(k => root.removeProperty(k)); // 決めていない・読めない色のときは、いつものピンク
    document.documentElement.classList.remove("light-color");
    return;
  }
  // 明るい色(白い文字が読みにくい色)なら、文字をキャラの色を濃くした色にする
  document.documentElement.classList.toggle("light-color", luminance(v) > 0.45);
  // 1つの色から、アクセント・見出しのグラデーションの相手・枠・背景のうすい色を作る
  root.setProperty("--accent", v);
  root.setProperty("--accent2", `color-mix(in oklab, ${v} 55%, #b58cff)`);
  root.setProperty("--border", `color-mix(in oklab, ${v} 35%, #fff)`);
  root.setProperty("--bg", `color-mix(in oklab, ${v} 16%, #fff)`);
  root.setProperty("--bg2", `color-mix(in oklab, ${v} 42%, #fff)`);
  root.setProperty("--bg3", `color-mix(in oklab, ${v} 30%, #fff)`);
}
const isSecret = ch => (ch.fields || []).some(f => f.label === SECRET_LABEL && String(f.value).trim());
const secretLine = document.getElementById("secretLine");

// ボタンの形(パーツメーカーで描いた平行四辺形)の左の辺:上の点 (10,10) → 下の点 (40,90)。マスは 200×100
const SLANT_EDGE = { x0: 10 / 200, y0: 10 / 100, x1: 40 / 200, y1: 90 / 100 };
// 顔アイコンの左の辺が、ボタンの左の辺にぴったり重なるように、位置(--edge-x)と傾き(--slant)を決める
function fitSlant(btn) {
  const wrap = btn.querySelector(".avatar-wrap");
  if (!wrap) return;
  for (let i = 0; i < 3; i++) { // 位置を変えるとボタンの幅も変わるので、何度か測り直す
    const W = btn.offsetWidth, H = btn.offsetHeight, t = wrap.offsetTop, h = wrap.offsetHeight;
    if (!W || !H) return;
    const e = SLANT_EDGE;
    const edge = (y) => W * (e.x0 + (e.x1 - e.x0) * (y / H - e.y0) / (e.y1 - e.y0)); // 高さ y でのボタンの左の辺の x
    const x = edge(t), slant = edge(t + h) - x;
    const old = parseFloat(btn.style.getPropertyValue("--edge-x")) || 0;
    btn.style.setProperty("--edge-x", x.toFixed(1) + "px");
    btn.style.setProperty("--slant", slant.toFixed(1) + "px");
    if (Math.abs(old - x) < 0.5) return;
  }
}
// 名前の文字(フォント)が読み込まれたり、画面の幅が変わったりしたら、測り直す
const slantObserver = window.ResizeObserver ? new ResizeObserver((items) => items.forEach((it) => fitSlant(it.target))) : null;

// 段の人数を決める:1段に入る最大人数 m から、「a 人・a-1 人」の交互(a-1 人から始めることもある)にする。
//   いちばん下の段は3人以上。人数が多い段(a が大きい)ほど、また、いちばん下の段まで決まった人数ぴったりになるほど優先。
//   どの並べ方でも下の段が2人以下になるときは、下の段の人を、上の少ない段に1人ずつ移す(そこだけ交互がくずれる)
function rowSizes(n, m) {
  if (n <= m) return [n];
  if (m === 1) return Array(n).fill(1);
  if (m === 2) {
    // スマホなど、1段に2人しか入らないとき:2人・1人の交互。3人以上の段は作れないので、いちばん下の段を2人にする
    const sizes = [];
    for (let left = n, want = 2; left > 0; want = 3 - want) {
      sizes.push(Math.min(want, left));
      left -= want;
    }
    if (sizes.at(-1) < 2) {
      sizes.pop();
      const i = sizes.lastIndexOf(1);
      if (i >= 0) sizes[i] = 2;
      else sizes.push(1);
    }
    return sizes;
  }
  let best = null;
  for (let a = m; a >= 3; a--) {
    for (const first of [a, a - 1]) {
      const other = first === a ? a - 1 : a;
      const sizes = [];
      let left = n, want = first;
      while (left > 0) {
        sizes.push(Math.min(want, left));
        left -= want;
        want = want === first ? other : first;
      }
      const last = sizes.at(-1);
      if (last < 3) continue;
      const full = left === 0 ? 0 : 1; // ぴったり(最後の段も決まった人数)なら 0
      const score = full * 15 + (m - a) * 10 + (first === a ? 0 : 1);
      if (!best || score < best.score) best = { score, sizes };
    }
  }
  if (best) return best.sizes;
  // 下の段が2人以下になってしまうとき:a = m の交互で並べてから、下の段の人を、下から順に少ない段へ1人ずつ移す
  const sizes = [];
  for (let left = n, want = m; left > 0; want = want === m ? m - 1 : m) {
    sizes.push(Math.min(want, left));
    left -= want;
  }
  let extra = sizes.pop();
  for (let i = sizes.length - 1; i >= 0 && extra > 0; i--) {
    if (sizes[i] < m) {
      sizes[i]++;
      extra--;
    }
  }
  return extra > 0 ? [...sizes, extra] : sizes;
}
// ボタンを段(.char-row)に分けて並べる。画面の幅が変わって、1段に入る人数が変わったときも並べ直す
let rowsFor = 0;
function layoutRows() {
  if (!charList.classList.contains("char-list--packed")) return;
  const btns = [...charList.querySelectorAll(".char-btn")];
  if (!btns.length) return;
  const pw = btns[0].offsetWidth || 240;
  const m = Math.max(1, Math.floor((charList.clientWidth - pw * 0.25) / (pw * 0.75))); // 1人ぶんは幅の 75%(25% はとなりと重なる)
  if (m === rowsFor && charList.querySelector(".char-row")) return;
  rowsFor = m;
  const rows = rowSizes(btns.length, m).map((k) => {
    const row = document.createElement("div");
    row.className = "char-row";
    row.append(...btns.splice(0, k));
    return row;
  });
  charList.replaceChildren(...rows);
}
if (window.ResizeObserver) new ResizeObserver(() => layoutRows()).observe(charList);

function renderButtons() {
  charList.innerHTML = characters.map((ch, i) => isSecret(ch) ? "" :
    `<button class="char-btn ub-chara-slant" type="button" data-index="${i}" aria-pressed="false">
      ${avatarHtml(ch)}<span>${escapeHtml(ch.name)}</span>
    </button>`).join("");
  renderSecrets();
  attachAvatarFallback(charList);
  charList.querySelectorAll(".char-btn").forEach(btn => {
    btn.addEventListener("click", () => select(Number(btn.dataset.index), true));
    fitSlant(btn);
    slantObserver?.observe(btn);
  });
  rowsFor = 0;
  layoutRows();
}

// 隠しキャラの名前を、見えない文字で並べる
function renderSecrets() {
  secretLine.innerHTML = characters.map((ch, i) => isSecret(ch)
    ? `<span class="secret" data-index="${i}">${escapeHtml(ch.name)}</span>` : "").join("");
  secretLine.querySelectorAll(".secret").forEach(el => {
    // 見つかったあとだけ押せる(見つける前に、たまたま押して開かないように)
    el.addEventListener("click", () => {
      if (el.classList.contains("found")) select(Number(el.dataset.index), true);
    });
    el.addEventListener("keydown", e => {
      if ((e.key === "Enter" || e.key === " ") && el.classList.contains("found")) {
        e.preventDefault();
        select(Number(el.dataset.index), true);
      }
    });
  });
}
// 文字を選んで(反転させて)隠しキャラの名前にかかったら、見つけたことにする
function markFound(el) {
  if (el.classList.contains("found")) return;
  el.classList.add("found");
  el.setAttribute("role", "button");
  el.tabIndex = 0;
}
document.addEventListener("selectionchange", () => {
  const sel = document.getSelection();
  if (!sel || sel.isCollapsed || !sel.toString().trim()) return;
  secretLine.querySelectorAll(".secret").forEach(el => {
    if (sel.containsNode(el, true)) markFound(el);
  });
});

// scroll:押して選んだとき true。プロフィールのところまでスクロールする
function select(index, scroll = false) {
  const ch = characters[index];
  if (!ch) return;

  charList.querySelectorAll(".char-btn").forEach(btn => {
    btn.setAttribute("aria-pressed", String(Number(btn.dataset.index) === index));
  });
  // URL で直接開いたときも、隠しキャラは見つけたことにする
  const secretEl = secretLine.querySelector(`.secret[data-index="${index}"]`);
  if (secretEl) markFound(secretEl);

  applyCharaColor(ch);
  const fields = (ch.fields || []).filter(f => !HIDDEN_LABELS.includes(f.label) && String(f.value).trim());
  const fieldsHtml = fields.length
    ? `<dl class="fields">${fields.map(f =>
        `<dt>${escapeHtml(f.label)}</dt><dd>${escapeHtml(f.value)}</dd>`).join("")}</dl>`
    : `<p class="placeholder">プロフィールはまだ準備中です</p>`;

  profile.innerHTML = `
    <div class="profile-head">
      ${avatarHtml(ch)}
      <h2 class="profile-name">${escapeHtml(ch.name)}</h2>
    </div>
    ${fieldsHtml}`;
  attachAvatarFallback(profile);
  renderExtras(ch.extras || []);

  profile.classList.remove("pop");
  void profile.offsetWidth; // アニメーション再生用
  profile.classList.add("pop");

  // URLの末尾に #キャラ名 を付けて、そのキャラのページを直接開けるようにする
  history.replaceState(null, "", "#" + encodeURIComponent(ch.name));

  // プロフィール欄が画面に見えている(上のはしが画面の下 15% より上にあり、下のはしが画面の上より下にある)ときは、動かさない
  const r = profile.getBoundingClientRect();
  const seen = r.top < innerHeight * 0.85 && r.bottom > 0;
  if (scroll && !seen) {
    const calm = matchMedia("(prefers-reduced-motion: reduce)").matches;
    profile.scrollIntoView({ behavior: calm ? "auto" : "smooth", block: "start" });
  }
}

// ============================================================
// 補足ブロック
// ============================================================
const extrasEl = document.getElementById("extras");
const lightbox = document.getElementById("lightbox");

// 画面に入ったブロックから順にふわっと表示する
const revealObserver = new IntersectionObserver(entries => {
  entries.forEach(e => {
    if (e.isIntersecting) {
      e.target.classList.add("shown");
      revealObserver.unobserve(e.target);
    }
  });
}, { threshold: 0.15 });

function extraHtml(ex, splitCount) {
  const hasTitle = ex.title.trim() !== "";
  const hasBody = String(ex.body).trim() !== "";
  const img = ex.image
    ? `<img src="${escapeHtml(ex.image)}" alt="${escapeHtml(ex.title)}" loading="lazy" referrerpolicy="no-referrer">`
    : "";
  const title = hasTitle ? `<h3 class="extra-title">${escapeHtml(ex.title)}</h3>` : "";
  const body = hasBody ? `<p class="extra-body">${escapeHtml(ex.body)}</p>` : "";

  // 画像だけ／画像＋見出しだけ → 大きく表示
  if (img && !hasBody) {
    const caption = hasTitle ? `<div class="extra-caption">${escapeHtml(ex.title)}</div>` : "";
    return `<section class="extra full"><div class="extra-media">${img}</div>${caption}</section>`;
  }
  // 画像＋本文 → 左右に並べる（左右は交互）
  if (img) {
    const reverse = splitCount % 2 === 1 ? " reverse" : "";
    return `<section class="extra split${reverse}">
      <div class="extra-media">${img}</div>
      <div class="extra-text">${title}${body}</div>
    </section>`;
  }
  // 文章だけ
  return `<section class="extra text">${title}${body}</section>`;
}

function renderExtras(extras) {
  let splitCount = 0;
  extrasEl.innerHTML = extras.map(ex => {
    const html = extraHtml(ex, splitCount);
    if (html.includes("extra split")) splitCount++;
    return html;
  }).join("");

  extrasEl.querySelectorAll(".extra").forEach(el => revealObserver.observe(el));
  extrasEl.querySelectorAll("img").forEach(img => {
    img.addEventListener("click", () => openLightbox(img.src));
    // 読み込めなかった画像は消す（画像しかないブロックはブロックごと消す）
    img.addEventListener("error", () => {
      const block = img.closest(".extra");
      img.closest(".extra-media").remove();
      if (!block.querySelector(".extra-title, .extra-body, .extra-caption")) block.remove();
      else block.className = "extra text shown";
    }, { once: true });
  });
}

function openLightbox(src) {
  lightbox.querySelector("img").src = src;
  lightbox.hidden = false;
}

lightbox.addEventListener("click", () => { lightbox.hidden = true; });
document.addEventListener("keydown", e => {
  if (e.key === "Escape") lightbox.hidden = true;
});

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, ch =>
    ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[ch]));
}

async function init() {
  profile.innerHTML = `<p class="loading" role="status"><span class="spinner" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></span>読み込み中…</p>`;
  try {
    const data = await loadData();
    characters = data.characters || [];
  } catch (e) {
    profile.innerHTML = `<p class="error">データの読み込みに失敗しました<br>時間をおいて再読み込みしてね</p>`;
    return;
  }
  if (characters.length === 0) {
    profile.innerHTML = `<p class="placeholder">キャラクターがまだ登録されていません</p>`;
    return;
  }
  renderButtons();

  const hashName = decodeURIComponent(location.hash.slice(1));
  const hashIndex = characters.findIndex(c => c.name === hashName);
  if (hashIndex >= 0) {
    select(hashIndex);
  } else {
    profile.innerHTML = `<p class="placeholder">キャラクターをえらんでね</p>`;
  }
}

init();
</script>

</html>
