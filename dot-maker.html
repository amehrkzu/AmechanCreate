<style>
/* このページだけの並べ方。部品の見た目は ui/kit.css */
body { font-size: 14px; }
.btn:disabled { cursor: default; }
.app {
  display: grid;
  grid-template-columns: minmax(0, 1fr);
  gap: 14px;
  padding: 14px;
  max-width: 1700px;
  margin: 0 auto;
}
@media (min-width: 1000px) { .app { grid-template-columns: 280px minmax(0, 1fr) 340px; } }
.tool-list { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.tool-list .btn { justify-content: flex-start; }
.tool-list .btn[aria-pressed="true"] { background: var(--lemon); }

/* 透明がすけて見える市松模様(色見本・透明度の帯の後ろ) */
.sw, .alpha, .now-sw {
  --checker: repeating-conic-gradient(#e8ddd3 0 25%, #fff 0 50%) 0 0 / 10px 10px;
}
/* 色見本 */
.swatches { display: grid; grid-template-columns: repeat(auto-fill, 28px); gap: 6px; }
.sw {
  width: 28px; height: 28px; padding: 0;
  border: 2px solid var(--ink); border-radius: 8px;
  background: linear-gradient(var(--c), var(--c)), var(--checker); cursor: pointer; touch-action: manipulation;
}
.sw[aria-pressed="true"] { box-shadow: 0 0 0 2px #fff, 0 0 0 4px var(--accent); }
.sub { margin: 12px 0 6px; font-size: 12px; font-weight: 700; color: var(--muted); }

/* 色選び(四角=あざやかさ・明るさ、帯=色合い・透明度) */
.picker { display: flex; flex-direction: column; gap: 10px; }
.sv, .bar { position: relative; border: 2px solid var(--ink); touch-action: none; cursor: pointer; }
.sv {
  aspect-ratio: 1.4; border-radius: 10px;
  background: linear-gradient(to top, #000, transparent), linear-gradient(to right, #fff, hsl(var(--h) 100% 50%));
}
.bar { height: 18px; border-radius: 9px; }
.hue { background: linear-gradient(to right, #f00, #ff0, #0f0, #0ff, #00f, #f0f, #f00); }
.alpha { background: linear-gradient(to right, transparent, var(--opaque)), var(--checker); }
.knob {
  position: absolute; width: 16px; height: 16px; margin: -8px 0 0 -8px;
  border: 3px solid #fff; border-radius: 50%; box-shadow: 0 0 0 1.5px var(--ink); pointer-events: none;
}
.bar .knob { top: 50%; }
.sv:focus-visible, .bar:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.now { display: flex; align-items: center; gap: 8px; }
.now-sw {
  width: 36px; height: 36px; flex-shrink: 0; border: 2px solid var(--ink); border-radius: 8px;
  background: linear-gradient(var(--c), var(--c)), var(--checker);
}
.now input { flex: 1; min-width: 0; font-family: ui-monospace, monospace; }
.now output { font-size: 13px; font-weight: 700; color: var(--muted); min-width: 3.2em; text-align: right; }

/* 真ん中:描くマス */
.stage { display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.toolbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.toolbar .grow { flex: 1; }
.board {
  --ar: 1;
  position: relative;
  aspect-ratio: var(--ar);
  width: min(100%, calc((100vh - 140px) * var(--ar)));
  width: min(100%, calc((100dvh - 140px) * var(--ar)));
  margin: 0 auto;
  background: #fff;
  border: var(--border) solid var(--ink);
  border-radius: 12px;
  box-shadow: 0 4px 0 var(--ink-soft);
  overflow: hidden;
}
#canvas { display: block; width: 100%; height: 100%; touch-action: none; user-select: none; -webkit-user-select: none; cursor: crosshair; }

/* 右:詳細 */
.panel { display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.panel .chips { margin-bottom: 10px; }
.size-row { display: flex; align-items: center; gap: 6px; }
.size-row input { width: 76px; }
.out-info { margin: 6px 0 0; font-size: 13px; font-weight: 700; }
.panel .field + .field, .panel .field + .actions, .panel .actions + .field { margin-top: 10px; }
.bg-row { display: flex; align-items: center; gap: 8px; margin-top: 10px; }
.bg-row input[type="color"] { width: 56px; }

@media (max-width: 999.98px) {
  .board { width: min(100%, calc((100dvh - 120px) * var(--ar))); }
}
</style>

<body class="bg-dots">

<main class="app">
  <!-- 左の列:上に「ツール」(道具)、下に「色」。広い画面ではいつも出ていて、狭い画面では前面に出る引き出し -->

        <button type="button" class="btn" data-tool="pick" title="スポイト(I)">💧 スポイト</button>
      </div>

        <div class="sv" id="sv" tabindex="0" role="slider" aria-label="あざやかさと明るさ"><span class="knob" id="svKnob"></span></div>

  <section class="stage">
    <div class="toolbar">
      <button type="button" class="switch" id="gridToggle" aria-pressed="true">マス目</button>
      <span class="grow"></span>
      <button type="button" class="btn btn--small" id="undo" title="元に戻す(Ctrl+Z)">↶ 戻す</button>

    </div>

    <section class="box" data-panel="draft">

      <label class="btn btn--small btn--primary">下書きを読み込む<input id="draftFile" type="file" accept="image/*" hidden></label>
      <div id="draftPanel" hidden>
        <label class="field field--check" style="margin-top:10px"><input id="draftShow" type="checkbox"> 下書きを表示</label>
        <label class="field">
          <span>うすさ <output id="draftOpacityOut"></output></span>

      <div class="actions" style="margin-top:12px">

    </section>
  </div>
  <button type="button" class="right-handle" id="rightHandle" aria-controls="rightDrawer" aria-expanded="false">✿ 詳細</button>
  </aside>

<script src="ui/layer-drawer.js"></script>
<script>
"use strict";
// ---------- 状態 ----------
// 絵は「横 w × 縦 h のマス」に色("#rrggbb"、すけている色は "#rrggbbaa"。空 "" は透明)を入れたもの。書き出すときだけ大きくする
const KEY = "dotmaker:v1";
const MAX_GRID = 128;
const GRID_PRESETS = [8, 16, 24, 32, 48, 64];
const OUT_PRESETS = [256, 512, 1000, 1024, 2048];
const $ = (id) => document.getElementById(id);
const canvas = $("canvas");
const ctx = canvas.getContext("2d");

const blank = () => ({
  w: 16, h: 16, px: Array(16 * 16).fill(""),
  color: "#ff8a3d", grid: true,
  out: 1024, bgOn: false, bg: "#ffffff", name: "",
  draft: { src: "", show: true, opacity: 0.5 },
});
let doc = load() ?? blank();
let tool = "pen";
let hover = null; // マウスがのっているマス [x, y]
let stroke = null; // 描いている途中 { last: [x, y], color, before }
const undoStack = [], redoStack = [];

function load() {
  try {
    const d = JSON.parse(sessionStorage.getItem(KEY));
    if (!d || !Array.isArray(d.px) || d.px.length !== d.w * d.h) return null;
    return { ...blank(), ...d };
  } catch {
    return null;
  }
}
let saveTimer;
function save() {
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => {
    try {
      sessionStorage.setItem(KEY, JSON.stringify(doc));
    } catch {
      // 下書きの画像が大きすぎると入らないので、画像なしで保存する
      try { sessionStorage.setItem(KEY, JSON.stringify({ ...doc, draft: { ...doc.draft, src: "" } })); } catch {}
    }
  }, 300);
}

// ---------- 元に戻す ----------
const picture = () => JSON.stringify({ w: doc.w, h: doc.h, px: doc.px });
function pushUndo(before) {
  undoStack.push(before);
  if (undoStack.length > 200) undoStack.shift();
  redoStack.length = 0;
  updateHistoryButtons();
}
function restore(json) {
  const p = JSON.parse(json);
  doc.w = p.w; doc.h = p.h; doc.px = p.px;
  afterPictureChange();
}
function undo() {
  if (!undoStack.length) return;
  redoStack.push(picture());
  restore(undoStack.pop());
}
function redo() {
  if (!redoStack.length) return;
  undoStack.push(picture());
  restore(redoStack.pop());
}
function updateHistoryButtons() {
  $("undo").disabled = !undoStack.length;
  $("redo").disabled = !redoStack.length;
}
function afterPictureChange() {
  updateHistoryButtons();
  renderGridUi();
  renderUsed();
  renderOutInfo();
  resizeCanvas();
  save();
}

// ---------- マスの線の位置 ----------
// n マスを total px に分けるときの、それぞれの境目(整数)。62.5px のような半端でも、にじまずにくっきり塗れる
function edges(n, total) {
  const e = [];
  for (let i = 0; i <= n; i++) e.push(Math.round((i * total) / n));
  return e;
}

// ---------- 画面に描く ----------
function resizeCanvas() {
  $("board").style.setProperty("--ar", doc.w / doc.h);
  const dpr = window.devicePixelRatio || 1;
  const r = canvas.getBoundingClientRect();
  const W = Math.max(1, Math.round(r.width * dpr));
  const H = Math.max(1, Math.round(r.height * dpr));
  if (canvas.width !== W || canvas.height !== H) { canvas.width = W; canvas.height = H; }
  draw();
}
function draw() {
  const W = canvas.width, H = canvas.height;
  const xs = edges(doc.w, W), ys = edges(doc.h, H);
  ctx.clearRect(0, 0, W, H);
  for (let y = 0; y < doc.h; y++) {
    for (let x = 0; x < doc.w; x++) {
      const x0 = xs[x], y0 = ys[y], cw = xs[x + 1] - x0, ch = ys[y + 1] - y0;
      const c = doc.px[y * doc.w + x];
      if (!c || c.length === 9) {
        // 透明・すけている色のマスは、下に小さな市松模様
        const hw = Math.round(cw / 2), hh = Math.round(ch / 2);
        ctx.fillStyle = "#ffffff";
        ctx.fillRect(x0, y0, cw, ch);
        ctx.fillStyle = "#f4ebe3";
        ctx.fillRect(x0 + hw, y0, cw - hw, hh);
        ctx.fillRect(x0, y0 + hh, hw, ch - hh);
      }
      if (c) {
        ctx.fillStyle = c;
        ctx.fillRect(x0, y0, cw, ch);
      }
    }
  }
  // 下書き:マスの上にうすく重ねる(縦横の比はそのまま、真ん中に収める)
  if (doc.draft.src && doc.draft.show && draftImg.complete && draftImg.naturalWidth) {
    const s = Math.min(W / draftImg.naturalWidth, H / draftImg.naturalHeight);
    const dw = draftImg.naturalWidth * s, dh = draftImg.naturalHeight * s;
    ctx.globalAlpha = doc.draft.opacity;
    ctx.drawImage(draftImg, (W - dw) / 2, (H - dh) / 2, dw, dh);
    ctx.globalAlpha = 1;
  }
  if (doc.grid) {
    const line = Math.max(1, Math.round((window.devicePixelRatio || 1) * 0.75));
    for (let i = 1; i < doc.w; i++) {
      ctx.fillStyle = i % 8 === 0 ? "rgba(168,113,74,.45)" : "rgba(168,113,74,.18)";
      ctx.fillRect(xs[i], 0, line, H);
    }
    for (let i = 1; i < doc.h; i++) {
      ctx.fillStyle = i % 8 === 0 ? "rgba(168,113,74,.45)" : "rgba(168,113,74,.18)";
      ctx.fillRect(0, ys[i], W, line);
    }
  }
  if (hover) {
    const [x, y] = hover;
    const lw = Math.max(2, Math.round((window.devicePixelRatio || 1) * 2));
    ctx.strokeStyle = "#ff8a3d";
    ctx.lineWidth = lw;
    ctx.strokeRect(xs[x] + lw / 2, ys[y] + lw / 2, xs[x + 1] - xs[x] - lw, ys[y + 1] - ys[y] - lw);
  }
}

// ---------- 描く ----------
function cellAt(e) {
  const r = canvas.getBoundingClientRect();
  const x = Math.floor(((e.clientX - r.left) / r.width) * doc.w);
  const y = Math.floor(((e.clientY - r.top) / r.height) * doc.h);
  if (x < 0 || y < 0 || x >= doc.w || y >= doc.h) return null;
  return [x, y];
}
function cellAtClamped(e) {
  const r = canvas.getBoundingClientRect();
  const x = Math.floor(((e.clientX - r.left) / r.width) * doc.w);
  const y = Math.floor(((e.clientY - r.top) / r.height) * doc.h);
  return [Math.min(doc.w - 1, Math.max(0, x)), Math.min(doc.h - 1, Math.max(0, y))];
}
function setPx(x, y, c) {
  if (x < 0 || y < 0 || x >= doc.w || y >= doc.h) return;
  doc.px[y * doc.w + x] = c;
}
// 前の点から今の点まで、すき間なくマスを塗る(ブレゼンハム)
function lineTo(x0, y0, x1, y1, c) {
  const dx = Math.abs(x1 - x0), dy = -Math.abs(y1 - y0);
  const sx = x0 < x1 ? 1 : -1, sy = y0 < y1 ? 1 : -1;
  let err = dx + dy;
  for (;;) {
    setPx(x0, y0, c);
    if (x0 === x1 && y0 === y1) break;
    const e2 = 2 * err;
    if (e2 >= dy) { err += dy; x0 += sx; }
    if (e2 <= dx) { err += dx; y0 += sy; }
  }
}
// 同じ色でつながっているマスを塗る(上下左右)
function floodFill(x, y, c) {
  const from = doc.px[y * doc.w + x];
  if (from === c) return;
  const stack = [[x, y]];
  while (stack.length) {
    const [cx, cy] = stack.pop();
    if (cx < 0 || cy < 0 || cx >= doc.w || cy >= doc.h) continue;
    const i = cy * doc.w + cx;
    if (doc.px[i] !== from) continue;
    doc.px[i] = c;
    stack.push([cx + 1, cy], [cx - 1, cy], [cx, cy + 1], [cx, cy - 1]);
  }
}

canvas.addEventListener("contextmenu", (e) => e.preventDefault());
canvas.addEventListener("pointerdown", (e) => {
  if (e.button !== 0 && e.button !== 2) return;
  const cell = cellAt(e);
  if (!cell) return;
  e.preventDefault();
  const [x, y] = cell;
  const erase = tool === "eraser" || e.button === 2;
  const color = erase || doc.color.endsWith("00") && doc.color.length === 9 ? "" : doc.color; // 透明度 0% は消しゴムと同じ
  if (tool === "pick" && !erase) {
    const c = doc.px[y * doc.w + x];
    if (c) { setColor(c); setTool("pen"); }
    return;
  }
  const before = picture();
  if (tool === "fill") {
    floodFill(x, y, color);
    if (picture() !== before) { pushUndo(before); afterPictureChange(); }
    return;
  }
  canvas.setPointerCapture(e.pointerId);
  stroke = { last: cell, color, before };
  setPx(x, y, color);
  draw();
});
canvas.addEventListener("pointermove", (e) => {
  if (stroke) {
    const cell = cellAtClamped(e);
    lineTo(stroke.last[0], stroke.last[1], cell[0], cell[1], stroke.color);
    stroke.last = cell;
  }
  const h = e.pointerType === "mouse" ? cellAt(e) : null;
  if (String(h) !== String(hover) || stroke) { hover = h; draw(); }
});
function endStroke() {
  if (!stroke) return;
  const { before } = stroke;
  stroke = null;
  if (picture() !== before) { pushUndo(before); afterPictureChange(); }
}
canvas.addEventListener("pointerup", endStroke);
canvas.addEventListener("pointercancel", endStroke);
canvas.addEventListener("pointerleave", () => { if (hover && !stroke) { hover = null; draw(); } });

// ---------- 道具・色 ----------
function setTool(t) {
  tool = t;
  for (const b of document.querySelectorAll("[data-tool]")) b.setAttribute("aria-pressed", String(b.dataset.tool === t));
}
for (const b of document.querySelectorAll("[data-tool]")) b.addEventListener("click", () => setTool(b.dataset.tool));

// 色の変換。a は 0〜255
function parseColor(t) {
  const m = /^#?([0-9a-f]{3,4}|[0-9a-f]{6}|[0-9a-f]{8})$/i.exec(String(t).trim());
  if (!m) return null;
  let h = m[1];
  if (h.length <= 4) h = [...h].map((d) => d + d).join("");
  const n = (i) => parseInt(h.slice(i, i + 2), 16);
  return { r: n(0), g: n(2), b: n(4), a: h.length === 8 ? n(6) : 255 };
}
// 透明度 100% は "#rrggbb"、すけている色は "#rrggbbaa"
function toHex({ r, g, b, a }) {
  const x = (n) => Math.round(n).toString(16).padStart(2, "0");
  return "#" + x(r) + x(g) + x(b) + (a < 255 ? x(a) : "");
}
function hsvToRgb(h, s, v) {
  const f = (n) => { const k = (n + h / 60) % 6; return 255 * (v - v * s * Math.max(0, Math.min(k, 4 - k, 1))); };
  return { r: f(5), g: f(3), b: f(1) };
}
function rgbToHsv({ r, g, b }) {
  r /= 255; g /= 255; b /= 255;
  const max = Math.max(r, g, b), d = max - Math.min(r, g, b);
  let h = 0;
  if (d) h = max === r ? ((g - b) / d) % 6 : max === g ? (b - r) / d + 2 : (r - g) / d + 4;
  return { h: (h * 60 + 360) % 360, s: max ? d / max : 0, v: max };
}

// 色選びの状態(色合い h 0〜360、あざやかさ s・明るさ v・透明度 a は 0〜1)。灰色でも色合いを覚えておくため、色とは別に持つ
let hsv = { h: 0, s: 0, v: 0, a: 1 };
function setColor(c, fromPicker = false) {
  const p = parseColor(c);
  if (!p) return;
  doc.color = toHex(p);
  if (!fromPicker) {
    const n = rgbToHsv(p);
    hsv = { h: n.s && n.v ? n.h : hsv.h, s: n.v ? n.s : hsv.s, v: n.v, a: p.a / 255 };
  }
  renderPicker();
  for (const b of document.querySelectorAll(".sw")) b.setAttribute("aria-pressed", String(b.dataset.c === doc.color));
  if (tool === "eraser" || tool === "pick") setTool("pen");
  save();
}
function setHsv(patch) {
  Object.assign(hsv, patch);
  setColor(toHex({ ...hsvToRgb(hsv.h, hsv.s, hsv.v), a: Math.round(hsv.a * 255) }), true);
}
function renderPicker() {
  const opaque = doc.color.slice(0, 7);
  $("sv").style.setProperty("--h", hsv.h);
  $("svKnob").style.left = `${hsv.s * 100}%`;
  $("svKnob").style.top = `${(1 - hsv.v) * 100}%`;
  $("svKnob").style.background = opaque;
  $("hueKnob").style.left = `${(hsv.h / 360) * 100}%`;
  $("hueKnob").style.background = `hsl(${hsv.h} 100% 50%)`;
  $("alpha").style.setProperty("--opaque", opaque);
  $("alphaKnob").style.left = `${hsv.a * 100}%`;
  $("alphaKnob").style.background = opaque;
  $("hue").setAttribute("aria-valuenow", Math.round(hsv.h));
  $("alpha").setAttribute("aria-valuenow", Math.round(hsv.a * 100));
  $("nowSw").style.setProperty("--c", doc.color);
  if (document.activeElement !== $("colorCode")) $("colorCode").value = doc.color;
  $("alphaOut").textContent = `${Math.round(hsv.a * 100)}%`;
}
// 四角と帯:押したまま動かして選ぶ。矢印キーでも動く(Shift で大きく)
function dragArea(el, onPos, onKey) {
  const move = (e) => {
    const r = el.getBoundingClientRect();
    const fx = Math.min(1, Math.max(0, (e.clientX - r.left) / r.width));
    const fy = Math.min(1, Math.max(0, (e.clientY - r.top) / r.height));
    onPos(fx, fy);
  };
  el.addEventListener("pointerdown", (e) => {
    if (e.button !== 0) return;
    e.preventDefault();
    el.focus();
    el.setPointerCapture(e.pointerId);
    move(e);
  });
  el.addEventListener("pointermove", (e) => { if (el.hasPointerCapture(e.pointerId)) move(e); });
  el.addEventListener("keydown", (e) => {
    const d = { ArrowLeft: [-1, 0], ArrowRight: [1, 0], ArrowUp: [0, 1], ArrowDown: [0, -1] }[e.key];
    if (!d) return;
    e.preventDefault();
    onKey(d[0] * (e.shiftKey ? 10 : 1), d[1] * (e.shiftKey ? 10 : 1));
  });
}
const clamp01 = (n) => Math.min(1, Math.max(0, n));
dragArea($("sv"), (fx, fy) => setHsv({ s: fx, v: 1 - fy }), (dx, dy) => setHsv({ s: clamp01(hsv.s + dx / 100), v: clamp01(hsv.v + dy / 100) }));
dragArea($("hue"), (fx) => setHsv({ h: Math.min(359.9, fx * 360) }), (dx, dy) => setHsv({ h: (hsv.h + (dx || dy) + 360) % 360 }));
dragArea($("alpha"), (fx) => setHsv({ a: fx }), (dx, dy) => setHsv({ a: clamp01(Math.round(hsv.a * 100 + (dx || dy)) / 100) }));
// カラーコードの欄:打って Enter か、欄を離れたら反映。読めないときは元に戻す
function applyCode() {
  if (parseColor($("colorCode").value)) setColor($("colorCode").value);
  else $("colorCode").value = doc.color;
}
$("colorCode").addEventListener("change", applyCode);
$("colorCode").addEventListener("keydown", (e) => { if (e.key === "Enter") { applyCode(); $("colorCode").select(); } });

function swatch(c) {
  const b = document.createElement("button");
  b.type = "button";
  b.className = "sw";
  b.dataset.c = c;
  b.style.setProperty("--c", c);
  b.title = c;
  b.setAttribute("aria-label", c);
  b.setAttribute("aria-pressed", String(c === doc.color));
  b.addEventListener("click", () => setColor(c));
  return b;
}
function renderUsed() {
  const used = [...new Set(doc.px.filter(Boolean))];
  $("used").replaceChildren(...used.map(swatch));
  $("usedTitle").hidden = !used.length;
}

// ---------- マス数 ----------
// 大きさを変えるときは、絵を真ん中に置いたまま、まわりを足す・けずる
function resizeGrid(w, h) {
  w = Math.min(MAX_GRID, Math.max(1, Math.round(w) || 1));
  h = Math.min(MAX_GRID, Math.max(1, Math.round(h) || 1));
  if (w === doc.w && h === doc.h) { renderGridUi(); return; }
  const before = picture();
  const ox = Math.floor((w - doc.w) / 2), oy = Math.floor((h - doc.h) / 2);
  const px = Array(w * h).fill("");
  for (let y = 0; y < doc.h; y++) {
    for (let x = 0; x < doc.w; x++) {
      const nx = x + ox, ny = y + oy;
      if (nx >= 0 && ny >= 0 && nx < w && ny < h) px[ny * w + nx] = doc.px[y * doc.w + x];
    }
  }
  doc.w = w; doc.h = h; doc.px = px;
  hover = null;
  pushUndo(before);
  afterPictureChange();
}
function renderGridUi() {
  $("gridW").value = doc.w;
  $("gridH").value = doc.h;
  for (const b of $("gridChips").children) b.setAttribute("aria-pressed", String(+b.dataset.n === doc.w && +b.dataset.n === doc.h));
}
$("gridChips").replaceChildren(...GRID_PRESETS.map((n) => {
  const b = document.createElement("button");
  b.type = "button";
  b.className = "chip";
  b.dataset.n = n;
  b.textContent = `${n}×${n}`;
  b.addEventListener("click", () => resizeGrid(n, n));
  return b;
}));
$("gridApply").addEventListener("click", () => resizeGrid(+$("gridW").value, +$("gridH").value));
for (const id of ["gridW", "gridH"]) $(id).addEventListener("keydown", (e) => { if (e.key === "Enter") resizeGrid(+$("gridW").value, +$("gridH").value); });
$("clearAll").addEventListener("click", () => {
  if (!doc.px.some(Boolean)) return;
  const before = picture();
  doc.px = Array(doc.w * doc.h).fill("");
  pushUndo(before);
  afterPictureChange();
});

$("gridToggle").addEventListener("click", () => {
  doc.grid = !doc.grid;
  $("gridToggle").setAttribute("aria-pressed", String(doc.grid));
  draw();
  save();
});

// ---------- 下書き ----------
// 画像をマスの上にうすく表示するだけ。絵(px)にも書き出しにも入らない
const draftImg = new Image();
draftImg.addEventListener("load", draw);
function renderDraftPanel() {
  const d = doc.draft;
  $("draftPanel").hidden = !d.src;
  $("draftShow").checked = d.show;
  $("draftOpacity").value = d.opacity;
  $("draftOpacityOut").textContent = `${Math.round(d.opacity * 100)}%`;
}
function setDraft(src) {
  doc.draft = { ...doc.draft, src, show: true };
  draftImg.src = src;
  renderDraftPanel();
  draw();
  save();
}
function loadDraftFile(file) {
  if (!file) return;
  if (!file.type.startsWith("image/")) { $("status").textContent = "画像のファイルを選んでください"; return; }
  const r = new FileReader();
  r.onload = () => { setDraft(r.result); $("status").textContent = "下書きを読み込みました"; };
  r.readAsDataURL(file);
}
$("draftFile").addEventListener("change", (e) => { loadDraftFile(e.target.files[0]); e.target.value = ""; });
$("draftShow").addEventListener("change", (e) => { doc.draft.show = e.target.checked; draw(); save(); });
$("draftOpacity").addEventListener("input", (e) => { doc.draft.opacity = +e.target.value; renderDraftPanel(); draw(); save(); });
$("draftRemove").addEventListener("click", () => {
  doc.draft = { ...blank().draft };
  draftImg.removeAttribute("src");
  renderDraftPanel();
  draw();
  save();
});
document.addEventListener("dragover", (e) => e.preventDefault());
document.addEventListener("drop", (e) => { e.preventDefault(); loadDraftFile(e.dataTransfer.files[0]); });
document.addEventListener("paste", (e) => {
  if (e.target.closest?.("input, textarea")) return;
  const item = [...(e.clipboardData?.items ?? [])].find((i) => i.type.startsWith("image/"));
  if (item) loadDraftFile(item.getAsFile());
});

// ---------- 書き出し ----------
function outDims() {
  const L = Math.max(doc.w, doc.h);
  return [Math.max(1, Math.round((doc.out * doc.w) / L)), Math.max(1, Math.round((doc.out * doc.h) / L))];
}
function renderOutInfo() {
  const [W, H] = outDims();
  const cell = W / doc.w;
  const cellText = Number.isInteger(cell) ? `${cell}` : `約${Math.round(cell * 10) / 10}`;
  $("outInfo").textContent = `${W} × ${H} px(1マス ${cellText}px)`;
  $("outSize").value = doc.out;
  for (const b of $("outChips").children) b.setAttribute("aria-pressed", String(+b.dataset.n === doc.out));
}
function setOut(n) {
  doc.out = Math.min(4096, Math.max(16, Math.round(n) || 1024));
  renderOutInfo();
  save();
}
$("outChips").replaceChildren(...OUT_PRESETS.map((n) => {
  const b = document.createElement("button");
  b.type = "button";
  b.className = "chip";
  b.dataset.n = n;
  b.textContent = n;
  b.addEventListener("click", () => setOut(n));
  return b;
}));
$("outSize").addEventListener("change", (e) => setOut(+e.target.value));
$("bgOn").addEventListener("change", (e) => { doc.bgOn = e.target.checked; save(); });
$("bgColor").addEventListener("input", (e) => { doc.bg = e.target.value; doc.bgOn = true; $("bgOn").checked = true; save(); });
$("fileName").addEventListener("input", (e) => { doc.name = e.target.value; save(); });

// 書き出し用の絵:マスを整数の境目で塗るだけ(拡大しないので、ぼやけない)
function renderPng() {
  const [W, H] = outDims();
  const c = document.createElement("canvas");
  c.width = W;
  c.height = H;
  const g = c.getContext("2d");
  if (doc.bgOn) { g.fillStyle = doc.bg; g.fillRect(0, 0, W, H); }
  const xs = edges(doc.w, W), ys = edges(doc.h, H);
  for (let y = 0; y < doc.h; y++) {
    for (let x = 0; x < doc.w; x++) {
      const col = doc.px[y * doc.w + x];
      if (!col) continue;
      g.fillStyle = col;
      g.fillRect(xs[x], ys[y], xs[x + 1] - xs[x], ys[y + 1] - ys[y]);
    }
  }
  return c;
}
$("savePng").addEventListener("click", () => {
  const c = renderPng();
  const name = (doc.name.trim() || "dot").replace(/[\\/:*?"<>|]/g, "_");
  c.toBlob((blob) => {
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = `${name}.png`;
    a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 5000);
    $("status").textContent = `保存しました(${c.width}×${c.height} px)`;
  }, "image/png");
});

// ---------- キー ----------
document.addEventListener("keydown", (e) => {
  if (e.target.closest("input, select, textarea")) return;
  const k = e.key.toLowerCase();
  if ((e.ctrlKey || e.metaKey) && k === "z") { e.preventDefault(); e.shiftKey ? redo() : undo(); return; }
  if ((e.ctrlKey || e.metaKey) && k === "y") { e.preventDefault(); redo(); return; }
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  const map = { b: "pen", p: "pen", e: "eraser", g: "fill", i: "pick" };
  if (map[k]) setTool(map[k]);
});
$("undo").addEventListener("click", undo);
$("redo").addEventListener("click", redo);

// ---------- はじめ ----------
setColor(doc.color);
setTool("pen");
$("gridToggle").setAttribute("aria-pressed", String(doc.grid));
$("bgOn").checked = doc.bgOn;
$("bgColor").value = doc.bg;
$("fileName").value = doc.name;
if (doc.draft.src) draftImg.src = doc.draft.src;
renderDraftPanel();
afterPictureChange();
new ResizeObserver(resizeCanvas).observe(canvas);
window.addEventListener("resize", resizeCanvas);
</script>
</body>
</html>
