<!doctype html>
<html lang="ja" data-theme="budo">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>なんちゃってレイドシュミレーター</title>
<link rel="icon" type="image/png" href="Icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;700&display=swap">
<link rel="stylesheet" href="ui/kit.css">
<link rel="stylesheet" href="ui/layer-drawer.css">
<link rel="stylesheet" href="ui/scrollbar.css">
<style>
/* このページだけの並べ方。部品の見た目は ui/kit.css */
body { font-size: 14px; }
.app {
  display: grid;
  grid-template-columns: minmax(0, 1fr);
  gap: 14px;
  padding: 14px;
  max-width: 1800px;
  margin: 0 auto;
}
@media (min-width: 1000px) { .app { grid-template-columns: 260px minmax(0, 1fr) 320px; } }
.grow { flex: 1; }
.sub { margin: 10px 0 6px; font-size: 12px; font-weight: 700; color: var(--muted); }
.btn[aria-pressed="true"] { background: var(--lilac); }

/* 左:追加 */
.add-list { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.add-list .btn { justify-content: flex-start; }
.role {
  display: inline-grid; place-items: center; min-width: 30px; height: 20px; padding: 0 4px;
  border-radius: 6px; background: var(--c); color: #fff; font-size: 11px; font-weight: 700;
}

/* 真ん中:フィールドとタイムライン */
.stage { display: flex; flex-direction: column; gap: 10px; min-width: 0; }
/* 元に戻す・やり直す:フィールドの枠の外の右上(枠と同じ幅の行に、右寄せ) */
.board, .undo-bar {
  width: min(100%, max(260px, calc(100vh - 370px)));
  width: min(100%, max(260px, calc(100dvh - 370px)));
  margin: 0 auto;
}
.undo-bar { display: flex; justify-content: flex-end; gap: 4px; margin-bottom: -4px; }
.undo-bar .btn { min-width: 32px; justify-content: center; font-size: 16px; }
.undo-bar .btn:disabled { opacity: .45; cursor: default; }
.board {
  position: relative;
  aspect-ratio: 1;
  background: #fff;
  border: var(--border) solid var(--ink);
  border-radius: 12px;
  box-shadow: 0 4px 0 var(--ink-soft);
  overflow: hidden;
}
#canvas { display: block; width: 100%; height: 100%; touch-action: none; user-select: none; -webkit-user-select: none; }
.castbar {
  position: absolute; top: 8px; left: 50%; transform: translateX(-50%);
  width: min(70%, 260px); padding: 3px 8px 5px; border-radius: 10px;
  background: rgba(255, 255, 255, .88); border: 2px solid var(--ink); pointer-events: none; text-align: center;
}
.castbar span { display: block; font-size: 12px; font-weight: 700; }
.castbar i { display: block; height: 6px; border-radius: 3px; background: var(--line); overflow: hidden; }
.castbar b { display: block; height: 100%; background: var(--accent); }
/* セリフ:フィールドの下の帯(名前 + セリフ) */
.talk {
  position: absolute; left: 50%; bottom: 10px; transform: translateX(-50%);
  width: min(calc(100% - 20px), 520px); padding: 6px 12px 8px; border-radius: 12px;
  background: rgba(255, 255, 255, .93); border: 2px solid var(--ink); box-shadow: 0 3px 0 var(--ink-soft); pointer-events: none;
}
.talk b { display: block; font-size: 12px; color: var(--accent); }
.talk span { display: block; font-size: 14px; font-weight: 700; white-space: pre-wrap; overflow-wrap: anywhere; }

.tl-box { padding: 10px; }
.tl-bar { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin-bottom: 8px; }
.player { display: flex; gap: 4px; }
.player .btn { min-width: 34px; justify-content: center; font-family: "Segoe UI Symbol", ui-sans-serif, sans-serif; }
.enemy-img { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
.enemy-img img { width: 40px; height: 40px; border-radius: 50%; object-fit: cover; border: 2px solid var(--line); }
/* 配置プリセットの引き出し:右から出る(ui/layer-drawer.css の右の引き出しと同じ動き)。つまみは「✿ 詳細」の下 */
.preset-drawer {
  position: fixed; z-index: 21; right: 0; top: var(--top-h, 49px); bottom: 0;
  width: min(340px, 88vw); display: flex; flex-direction: column;
  padding: 10px max(10px, env(safe-area-inset-right)) max(10px, env(safe-area-inset-bottom)) 10px;
  background: var(--bg); box-shadow: -4px 0 0 var(--ink-soft);
  transform: translateX(100%); transition: transform .25s cubic-bezier(.3, 1.2, .5, 1);
  pointer-events: none; /* 閉じているときは、つまみ以外は下の操作をじゃましない */
}
.preset-drawer.open { transform: none; pointer-events: auto; }
.preset-drawer > .box { flex: 1; min-height: 0; overflow-y: auto; overscroll-behavior: contain; }
.preset-handle {
  position: absolute; top: calc(18% + 96px); right: 100%; pointer-events: auto;
  writing-mode: vertical-rl; letter-spacing: .15em; padding: 12px 5px;
  background: #ffd9b8; color: var(--text); border: 0; border-radius: 12px 0 0 12px;
  font: inherit; font-size: 13px; font-weight: 700; cursor: pointer; touch-action: manipulation;
}
@media (prefers-reduced-motion: reduce) { .preset-drawer { transition: none; } }
.preset-add { display: flex; gap: 6px; }
.preset-add input { flex: 1; min-width: 0; }
#presetList .btn:first-child { flex: 1; min-width: 0; justify-content: flex-start; }
/* 名前が1行に収まらないときは「…」(全部は title で見える) */
#presetList .btn span { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tl-clock { font-family: ui-monospace, monospace; font-weight: 700; min-width: 11em; }
.tl-clock output { display: inline-block; min-width: 3.2em; text-align: right; }
.dur-btn { font: inherit; color: inherit; background: none; border: 0; border-bottom: 1px dashed var(--muted); padding: 0 1px; cursor: pointer; }
.dur-btn:hover { color: var(--accent); border-bottom-color: var(--accent); }
.tl-clock input { width: 5em; font: inherit; padding: 0 4px; }
.tl { display: flex; border: 2px solid var(--line); border-radius: 10px; overflow: hidden; background: #fff; }
.tl-labels { flex-shrink: 0; width: 52px; border-right: 2px solid var(--line); background: var(--tint); }
.tl-labels div { display: flex; align-items: center; padding: 0 4px; font-size: 11px; font-weight: 700; color: var(--muted); overflow: hidden; white-space: nowrap; }
.tl-labels div.on { color: var(--accent); }
.tl-scroll { flex: 1; min-width: 0; overflow-x: auto; }
.tl-part { position: relative; }
.tl-part + .tl-part { margin-top: 8px; }
/* 最小化ボタン:タイムラインの右上(秒の目もりの行の右はし)に重ねる */
.tl-fold { position: absolute; top: 3px; right: 4px; z-index: 1; min-width: 22px; height: 18px; padding: 0; justify-content: center; font-size: 12px; line-height: 1; }
.tl-inner { position: relative; touch-action: none; user-select: none; -webkit-user-select: none; cursor: pointer; }
.tl-row { position: absolute; left: 0; right: 0; border-bottom: 1px solid var(--line); }
.tl-row.on { background: var(--tint); }
.tl-tick { position: absolute; top: 0; height: 100%; border-left: 1px solid var(--line); font-size: 10px; color: var(--muted); padding-left: 2px; }
.tl-mech {
  position: absolute; height: 18px; border: 2px solid #e08a4a; border-radius: 6px; background: #ffe2c9;
  font-size: 11px; font-weight: 700; line-height: 14px; padding: 0 4px; white-space: nowrap; overflow: hidden; color: var(--text);
}
.tl-mech::after { content: ""; position: absolute; right: -1px; top: -1px; bottom: -1px; width: 3px; background: #e08a4a; }
.tl-mech.on { box-shadow: 0 0 0 2px var(--accent); }
.tl-edge { position: absolute; top: -2px; bottom: -2px; width: 7px; z-index: 1; cursor: ew-resize; }
.tl-edge[data-edge="l"] { left: -2px; }
.tl-edge[data-edge="r"] { right: -2px; }
.tl-line { border-color: #7a9ad8; background: #e3ecff; }
.tl-line::after { display: none; }
.tl-key { position: absolute; width: 10px; height: 10px; margin: 3px 0 0 -5px; border-radius: 50%; background: var(--c); border: 2px solid #fff; box-shadow: 0 0 0 1px var(--c); }
.tl-span { position: absolute; height: 14px; }
.tl-span::before { content: ""; position: absolute; left: 0; right: 0; top: 5px; height: 4px; border-radius: 2px; background: var(--c); opacity: .35; }
.tl-span.on::before { opacity: .7; }
.tl-aggro { position: absolute; width: 10px; height: 10px; margin: 3px 0 0 -5px; background: var(--c); border: 2px solid #fff; box-shadow: 0 0 0 1px var(--c); transform: rotate(45deg) scale(.85); }
.tl-head { position: absolute; top: 0; bottom: 0; width: 2px; margin-left: -1px; background: var(--accent); pointer-events: none; }

/* 右:詳細・フィールド */
.panel { display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.panel .field + .field, .panel .field + .actions, .panel .row2 + .field, .panel .field + .row2 { margin-top: 10px; }
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.row3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
.key-list .key-angle { width: 4.8em; flex-shrink: 0; padding: 3px 6px; }
.seg { display: flex; flex-wrap: wrap; gap: 6px; }
.role-pick { display: flex; flex-wrap: wrap; gap: 5px; }
.role-pick button { border: 2px solid var(--c); background: #fff; color: var(--c); border-radius: 8px; padding: 1px 6px; font: inherit; font-size: 12px; font-weight: 700; cursor: pointer; }
.role-pick button[aria-pressed="true"] { background: var(--c); color: #fff; }
.key-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 4px; }
.key-list li { display: flex; align-items: center; gap: 6px; }
.key-list .btn { flex: 1; justify-content: flex-start; font-family: ui-monospace, monospace; }
.key-list .btn:last-child { flex: none; }
.key-list li.on .btn { background: var(--lilac); }
.panel .actions { margin-top: 12px; }
/* フィールドのマーカー:小さいプレビュー(ドラッグで動かす)と数字の欄 */
.mark-map { margin-top: 8px; aspect-ratio: 1; border: 2px solid var(--line); border-radius: 10px; overflow: hidden; }
#markCanvas { display: block; width: 100%; height: 100%; touch-action: none; user-select: none; -webkit-user-select: none; }
.mark-grid { display: grid; grid-template-columns: auto 1fr 1fr; gap: 4px 6px; align-items: center; margin-top: 8px; }
.mark-grid > span:not(.role) { font-size: 12px; font-weight: 700; color: var(--muted); }
.mark-grid input { padding: 3px 6px; font-size: 13px; }
.mark-grid .role { min-width: 22px; }

@media (max-width: 999.98px) {
  .board, .undo-bar { width: min(100%, max(260px, calc(100dvh - 340px))); }
  .panel input, .panel select, .mark-grid input { font-size: 16px; }
}
</style>
<script src="ui/site-header.js" defer></script>
</head>
<body class="bg-dots">
<header class="topbar top" data-site-bar>
  <h1>なんちゃってレイドシュミレーター</h1>
  <button type="button" class="btn btn--small" id="videoBtn" title="0 秒から最後までを ×1 で録って保存する">🎬 動画で保存</button>
</header>

<main class="app">
  <!-- 左の列:「追加」だけ(このツールは階層を置かない。選ぶのはフィールド・タイムラインから) -->
  <aside class="layer-drawer" id="layerDrawer" aria-label="オブジェクト追加">
    <section class="box">
      <h2>追加</h2>
      <p class="sub">敵</p>
      <div class="add-list" id="enemyAdd" role="group" aria-label="敵を足す"></div>
      <p class="sub">ギミック</p>
      <div class="add-list" id="addList" role="group" aria-label="ギミックを足す"></div>
      <p class="sub">そのほか</p>
      <div class="add-list"><button type="button" class="btn btn--small" id="lineAdd">💬 セリフ</button></div>
    </section>
    <button type="button" class="layer-handle" id="layerHandle" aria-controls="layerDrawer" aria-expanded="false">☂ オブジェクト追加</button>
  </aside>

  <section class="stage">
    <!-- 元に戻す・やり直す(フィールドの枠の外の右上) -->
    <div class="undo-bar" role="group" aria-label="元に戻す">
      <button type="button" class="btn btn--small" id="undoBtn" title="元に戻す(Ctrl+Z)" disabled>↶</button>
      <button type="button" class="btn btn--small" id="redoBtn" title="やり直す(Ctrl+Y・Ctrl+Shift+Z)" disabled>↷</button>
    </div>
    <div class="board" id="board">
      <canvas id="canvas"></canvas>
      <div class="castbar" id="castbar" hidden><span id="castName"></span><i><b id="castFill"></b></i></div>
      <div class="talk" id="talk" hidden><b id="talkWho"></b><span id="talkText"></span></div>
    </div>
    <section class="box tl-box">
      <div class="tl-bar">
        <div class="player" role="group" aria-label="再生">
          <button type="button" class="btn btn--small" id="toStart" title="はじめに戻る">⏮&#xFE0E;</button>
          <button type="button" class="btn btn--small" id="back" title="5 秒戻る">⏪&#xFE0E;</button>
          <button type="button" class="btn btn--small btn--primary" id="play" title="再生">▶&#xFE0E;</button>
          <button type="button" class="btn btn--small" id="fwd" title="5 秒進む">⏩&#xFE0E;</button>
          <button type="button" class="btn btn--small" id="toEnd" title="最後にとぶ">⏭&#xFE0E;</button>
        </div>
        <!-- 長さの数字を押すと、その場で入力できる -->
        <span class="tl-clock"><output id="timeOut"></output> / <button type="button" class="dur-btn" id="durBtn" title="押すと長さ(秒)を変えられる"></button><input id="duration" type="number" min="10" max="900" step="1" aria-label="長さ(秒)" hidden> 秒</span>
        <span class="grow"></span>
        <div class="seg" id="speeds" role="group" aria-label="速さ"></div>
      </div>
      <!-- 上:ギミック・セリフ・敵 / 下:PT(MT〜D4)。時間・横スクロールは2つでそろえる -->
      <!-- 最小化ボタンはタイムラインの右上。たたむと、秒の目もりの行だけになる(左の欄に名前 data-name) -->
      <div class="tl-part open" id="tlPartA" data-name="ギミック">
        <button type="button" class="btn btn--small tl-fold" aria-expanded="true"></button>
        <div class="tl">
          <div class="tl-labels" id="tlLabelsA"></div>
          <div class="tl-scroll" id="tlScrollA"><div class="tl-inner" id="tlInnerA"></div></div>
        </div>
      </div>
      <div class="tl-part open" id="tlPartB" data-name="PT">
        <button type="button" class="btn btn--small tl-fold" aria-expanded="true"></button>
        <div class="tl">
          <div class="tl-labels" id="tlLabelsB"></div>
          <div class="tl-scroll" id="tlScrollB"><div class="tl-inner" id="tlInnerB"></div></div>
        </div>
      </div>
    </section>
  </section>

  <aside class="right-drawer" id="rightDrawer" aria-label="詳細">
  <div class="right-tabs" role="tablist" aria-label="詳細の切り替え"><button type="button" role="tab" data-tab="detail" style="--c:#dccbff">詳細</button><button type="button" role="tab" data-tab="field" style="--c:#bdeccd">フィールド</button></div>
  <div class="panel">
    <section class="box" data-panel="detail">
      <h2>詳細</h2>
      <div id="detail"></div>
    </section>

    <section class="box" data-panel="field">
      <h2>フィールド</h2>
      <p class="sub">形</p>
      <div class="seg" id="arenaShape"></div>
      <div class="row2" style="margin-top:10px">
        <label class="field"><span>大きさ(半径 m)</span><input id="arenaSize" type="number" min="5" max="60" step="1"></label>
      </div>
      <p class="sub">マーカー</p>
      <div class="seg">
        <button type="button" class="switch" id="marksToggle" aria-pressed="true">表示</button>
        <button type="button" class="btn btn--small" id="marksReset">元の場所に</button>
      </div>
      <div class="mark-map"><canvas id="markCanvas"></canvas></div>
      <div class="mark-grid" id="markInputs"></div>
      <div class="actions">
        <button type="button" class="btn btn--small btn--danger" id="clearAll">ぜんぶ消す</button>
      </div>
    </section>
  </div>
  <button type="button" class="right-handle" id="rightHandle" aria-controls="rightDrawer" aria-expanded="false">✿ 詳細</button>
  </aside>

  <!-- 配置プリセット:右はしの「✿ 詳細」の下のつまみから出る、別の引き出し(画面の幅にかかわらず引き出し) -->
  <aside class="preset-drawer" id="presetDrawer" aria-label="配置プリセット">
    <section class="box">
      <h2>配置プリセット</h2>
      <p class="sub">押すと、今の時間に 8 人の動きの点を置く</p>
      <ul class="key-list" id="presetList"></ul>
      <p class="sub">今の並びを足す</p>
      <div class="preset-add">
        <input type="text" id="presetName" maxlength="20" placeholder="名前" aria-label="プリセットの名前">
        <button type="button" class="btn btn--small btn--primary" id="presetAdd">足す</button>
      </div>
    </section>
    <button type="button" class="preset-handle" id="presetHandle" aria-controls="presetDrawer" aria-expanded="false" title="配置プリセットを出す">✿ 配置プリセット</button>
  </aside>
</main>

<script>
"use strict";
// 位置の単位は m(FF14 のヤルム)。フィールドの真ん中が (0, 0)、北(上)が -y。向きは北が 0°、時計回り
const KEY = "raidsim:v1";
const KB_TIME = 0.5; // ノックバックで飛ばされている時間(秒)
const FLASH = 0.8;   // 発動したあと、範囲や当たった人を光らせる時間(秒)
const TANK = "#4a7bd8", HEALER = "#3a9d5d", DPS = "#d4505e";
const ROLES = [
  { id: "MT", c: TANK }, { id: "ST", c: TANK }, { id: "H1", c: HEALER }, { id: "H2", c: HEALER },
  { id: "D1", c: DPS }, { id: "D2", c: DPS }, { id: "D3", c: DPS }, { id: "D4", c: DPS }
];
const ROLE_IDS = ROLES.map((r) => r.id);
const roleColor = (id) => ROLES.find((r) => r.id === id).c;
// 最初の立ち位置(動きの点が無いとき・最初の点より前)。レイド開始は全員が南で、北寄りのボスと向き合う
// 前の列(南へ 8m)= D2 MT ST D1、後ろの列(南へ 11m)= H2 D4 D3 H1(東西は担当の向きに合わせる)
const SPAWN = { MT: [-1.5, 8], ST: [1.5, 8], D1: [4.5, 8], D2: [-4.5, 8], H1: [4.5, 11], H2: [-4.5, 11], D3: [1.5, 11], D4: [-1.5, 11] };
// ボスの最初の場所と向き(北へ 3m・南向き)
const BOSS_SPAWN = { x: 0, y: -3, a: 180 };
// フィールドマーカー(a = 置く向き。A が北、1 が北東…)
const MARKS = [
  { id: "A", c: "#e5566b", a: 0 }, { id: "1", c: "#e5566b", a: 45, sq: true },
  { id: "B", c: "#e0a91c", a: 90 }, { id: "2", c: "#e0a91c", a: 135, sq: true },
  { id: "C", c: "#3d8fe0", a: 180 }, { id: "3", c: "#3d8fe0", a: 225, sq: true },
  { id: "D", c: "#9a6be0", a: 270 }, { id: "4", c: "#9a6be0", a: 315, sq: true }
];
// ギミックの種類。at = 出る場所(boss:ボス / point:地点 / players:メンバー)、aim = 対象のメンバーをねらえる
const KINDS = {
  circle: { name: "円範囲", icon: "⭕", at: ["boss", "point", "players"], nums: ["r"], def: { r: 8 } },
  donut: { name: "ドーナツ", icon: "🍩", at: ["boss", "point", "players"], nums: ["inner", "r"], def: { inner: 8, r: 30 } },
  line: { name: "直線", icon: "📏", at: ["boss", "point"], aim: true, angle: true, nums: ["w", "len"], def: {} },
  cone: { name: "扇範囲", icon: "🍕", at: ["boss", "point"], aim: true, angle: true, nums: ["r", "deg"], def: { r: 40 } },
  cross: { name: "十字", icon: "➕", at: ["boss", "point"], angle: true, nums: ["w", "len"], def: {} },
  tower: { name: "塔", icon: "🗼", at: ["point"], nums: ["r", "need"], def: { at: "point", r: 3, need: 1, cast: 6 } },
  stack: { name: "頭割り", icon: "🤝", at: ["players"], nums: ["r", "need"], def: { at: "players", roles: ["H1", "H2"], r: 6, need: 4 } },
  spread: { name: "散開", icon: "💥", at: ["players"], nums: ["r"], def: { at: "players", roles: ROLE_IDS, r: 5 } },
  knock: { name: "ノックバック", icon: "💨", at: ["boss", "point", "players"], nums: ["dist"], def: {} }
};
// 大きさの欄(メンバーから出るノックバックは、飛ばす範囲の半径も)
const numsOf = (m) => m.kind === "knock" && m.at === "players" ? ["r", "dist"] : KINDS[m.kind].nums;
// at が "boss" のギミックは、src の敵から出る(画面では「敵」)
const AT_NAMES = { boss: "敵", point: "地点", players: "メンバー" };
// 敵の種類(r = 大きさ m)
const ENEMY_TYPES = { boss: { name: "ボス", icon: "👑", c: "#6c5594", r: 2.2 }, add: { name: "雑魚", icon: "👾", c: "#b0607a", r: 1.3 } };
const DT = 0.1; // 敵の動きを調べる間かく(秒)
const NUMS = {
  r: ["半径", 0.5, 100], inner: ["内側の半径", 0, 100], w: ["幅", 0.5, 100], len: ["長さ", 0.5, 200],
  deg: ["角度(°)", 5, 360], need: ["人数", 1, 8], dist: ["距離(マイナスで引き寄せ)", -60, 60]
};
const SPEEDS = [0.5, 1, 2];
const round1 = (v) => Math.round(v * 10) / 10;
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const byT = (a, b) => a.t - b.t;

function defaultMarks(size) {
  const d = size * 0.7;
  return Object.fromEntries(MARKS.map((m) => {
    const a = m.a * Math.PI / 180;
    return [m.id, { x: round1(Math.sin(a) * d), y: round1(-Math.cos(a) * d) }];
  }));
}
function blank() {
  return {
    shape: "circle", size: 20, dur: 60, marksOn: true, marks: defaultMarks(20),
    players: Object.fromEntries(ROLE_IDS.map((id) => [id, []])), // 動きの点 { t, x, y }(t の順)
    enemies: [newEnemy(1, "boss", 0)],
    mechs: [], nextId: 2,
    presets: [], // 自分で作った配置プリセット { name, pos: { MT: [x, y], … } }
    lines: [] // セリフ { id, t, text, who(敵の id。null なら name), name, dur, auto(長さを文字の数から決める) }
  };
}
// 敵:x, y, a = 出てくる場所と向き。keys = 動きの点 { t, x, y, a }。aggro = ねらう人の切りかえ { t, role }(role が null なら動きの点で動く)
// img = アイコンの画像(縮めた data URL。null なら色の丸に名前)
function newEnemy(id, type, appear) {
  return {
    id, type, name: ENEMY_TYPES[type].name, appear, vanish: null, img: null,
    ...(type === "boss" ? BOSS_SPAWN : { x: 0, y: -10, a: 0 }), speed: 6, reach: 3, keys: [], aggro: []
  };
}

let doc = load();
let time = 0, playing = false, speed = 1, lastTs = 0;
let sel = null; // { type: "player" | "mech", id }
let cache = null; // 位置のずれ(ノックバック)・敵の動き。doc が変わったら消す
const getCache = () => cache || (cache = { pushes: null, tracks: null });

function load() {
  const base = blank();
  try {
    const s = JSON.parse(sessionStorage.getItem(KEY));
    if (s) {
      // 前の開始の形(ボスが中央で北向き)のまま動きの点が無いボスは、今の開始の形に直す
      (s.enemies || []).forEach((e) => {
        if (e.type === "boss" && !e.x && !e.y && !e.a && !(e.keys || []).length) Object.assign(e, BOSS_SPAWN);
      });
      return { ...base, ...s, players: { ...base.players, ...s.players } };
    }
  } catch {}
  return base;
}
function save() {
  clearTimeout(save.timer);
  save.timer = setTimeout(() => {
    try { sessionStorage.setItem(KEY, JSON.stringify(doc)); } catch {}
  }, 300);
}
// doc を変えたら呼ぶ(keepDetail:入力中の詳細の欄を作り直さない)
function changed(keepDetail = false) {
  cache = null;
  save();
  clearTimeout(hist.timer);
  hist.timer = setTimeout(remember, 400);
  if (!keepDetail) renderDetail();
  renderTimeline();
  draw();
  drawMarkMap();
  renderPresets();
}

// ---------- 元に戻す・やり直す ----------
// changed() のあと少し待って、doc の形(JSON)を覚える。ドラッグ1回・続けての入力が、ひとまとまりになる
// last = 今の形。undo / redo = 前・あとの形(UNDO_MAX 回まで。読み込み直すと消える)
const UNDO_MAX = 15;
const hist = { undo: [], redo: [], last: JSON.stringify(doc), timer: 0 };
function remember() {
  clearTimeout(hist.timer);
  const now = JSON.stringify(doc);
  if (now === hist.last) return;
  hist.undo.push(hist.last);
  if (hist.undo.length > UNDO_MAX) hist.undo.shift();
  hist.redo = [];
  hist.last = now;
  renderUndo();
}
// from から1つ取り出して doc にする(今の形は to へ)
function restore(from, to) {
  remember();
  if (!from.length) return;
  to.push(hist.last);
  hist.last = from.pop();
  doc = JSON.parse(hist.last);
  if (sel && !selExists()) sel = null;
  renderField();
  changed();
  setTime(Math.min(time, doc.dur));
  renderUndo();
}
const undo = () => restore(hist.undo, hist.redo);
const redo = () => restore(hist.redo, hist.undo);
function selExists() {
  if (sel.type === "mech") return !!mechById(sel.id);
  if (sel.type === "line") return !!lineById(sel.id);
  if (sel.type === "enemy") return !!enemyById(sel.id);
  return true;
}
function renderUndo() {
  $("undoBtn").disabled = !hist.undo.length;
  $("redoBtn").disabled = !hist.redo.length;
}
const mechById = (id) => doc.mechs.find((m) => m.id === id);

// ---------- 位置 ----------
// 動きの点をつないだ位置(ノックバック前)
function basePos(id, t) {
  const keys = doc.players[id];
  const s = SPAWN[id];
  if (!keys.length) return { x: s[0], y: s[1] };
  return along(keys[0].t > 0 ? [{ t: 0, x: s[0], y: s[1] }, ...keys] : keys, t);
}
// 点 { t, x, y } の列(t の順)を、まっすぐ歩いてつないだ位置
function along(list, t) {
  if (t <= list[0].t) return { x: list[0].x, y: list[0].y };
  for (let i = 1; i < list.length; i++) {
    const b = list[i];
    if (t <= b.t) {
      const a = list[i - 1];
      const k = (t - a.t) / (b.t - a.t || 1);
      return { x: a.x + (b.x - a.x) * k, y: a.y + (b.y - a.y) * k };
    }
  }
  const z = list[list.length - 1];
  return { x: z.x, y: z.y };
}
// ノックバックのずれ:飛ばされたあと、次の動きの点に向かって少しずつ戻る(次の点が無ければ、飛ばされた所にいる)
function pushAmount(pu, t) {
  if (t <= pu.t0) return 0;
  const g = Math.min(1, (t - pu.t0) / KB_TIME);
  const grow = 1 - (1 - g) ** 2;
  if (pu.end === Infinity) return grow;
  if (t >= pu.end) return 0;
  const fadeStart = Math.min(pu.t0 + KB_TIME, pu.end);
  return grow * (t <= fadeStart ? 1 : (pu.end - t) / (pu.end - fadeStart));
}
function posWith(id, t, pushes) {
  const b = basePos(id, t);
  let x = b.x, y = b.y;
  for (const pu of pushes) {
    const k = pushAmount(pu, t);
    x += pu.vx * k;
    y += pu.vy * k;
  }
  return { x, y };
}
// ---------- 敵の動き ----------
// DT 秒ごとの位置と向き { x, y, a } を前から順に作る。追いかけるときは、ねらう人に向かって速さ speed で歩き、reach まで近づく。
// 動きの点で動くときは、そうなった時の場所から次の点へ歩く(ワープしない)。向きは点の向きに、点の時間でぱっと変わる。
// ねらう人の位置はノックバックのずれも入れる。ずれは時間の順に決まるので、allPushes の中で、ノックバックの時間まで少しずつ進める
const aggroAt = (e, t) => {
  let role = null;
  for (const g of e.aggro) if (g.t <= t + 1e-6) role = g.role;
  return role;
};
function runTrack(tr, upto, all) {
  const e = tr.e;
  // upto より後は、まだ決まっていないノックバックがあるので作らない
  const last = Math.min(Math.floor(upto / DT + 1e-6), Math.ceil(doc.dur / DT));
  const end = e.vanish == null ? Infinity : e.vanish;
  const spawn = { x: e.x, y: e.y, a: e.a };
  for (let i = tr.s.length; i <= last; i++) {
    const t = i * DT;
    const prev = tr.s[i - 1] || spawn;
    let p;
    if (t < e.appear - 1e-6) p = spawn;
    else if (t > end + 1e-6) p = prev;
    else {
      const role = aggroAt(e, t);
      if (role) {
        tr.seg = null;
        const q = posWith(role, t, all[role]);
        const dx = q.x - prev.x, dy = q.y - prev.y, d = Math.hypot(dx, dy);
        const step = d > e.reach ? Math.min(e.speed * DT, d - e.reach) : 0;
        p = { x: prev.x + dx / (d || 1) * step, y: prev.y + dy / (d || 1) * step, a: d > 0.01 ? Math.atan2(dx, -dy) * 180 / Math.PI : prev.a };
      } else {
        if (!tr.seg) tr.seg = { t: Math.max(e.appear, t - DT), ...prev };
        const s = tr.seg;
        const keys = e.keys.filter((k) => k.t > s.t + 1e-6);
        const q = along([s, ...keys], t);
        const k = keys.filter((k) => k.t <= t + 1e-6).pop();
        p = { x: q.x, y: q.y, a: k ? k.a : s.a };
      }
    }
    tr.s.push(p);
  }
}
function trackPos(tr, t) {
  if (!tr || !tr.s.length) return { x: 0, y: 0, a: 0 };
  const f = clamp(t / DT, 0, tr.s.length - 1);
  const i0 = Math.floor(f), i1 = Math.min(i0 + 1, tr.s.length - 1), k = f - i0;
  const a = tr.s[i0], b = tr.s[i1];
  return { x: a.x + (b.x - a.x) * k, y: a.y + (b.y - a.y) * k, a: (k < 0.5 ? a : b).a };
}
const enemyById = (id) => doc.enemies.find((e) => e.id === id);
// ギミックを出す敵(消えていたら1体目。敵が1体もいなければ null)
const enemyOf = (m) => enemyById(m.src) || doc.enemies[0] || null;
function enemyPos(e, t) {
  if (!e) return { x: 0, y: 0, a: 0 };
  allPushes();
  return trackPos(cache.tracks.get(e.id), t);
}
const enemyShown = (e, t) => t >= e.appear - 1e-6 && (e.vanish == null || t <= e.vanish + 1e-6);

// メンバーごとのずれの一覧。メンバーから出るノックバックは、ほかの人の位置で決まるので、全員まとめて時間の順に調べる
function allPushes() {
  getCache();
  if (cache.pushes) return cache.pushes;
  const all = Object.fromEntries(ROLE_IDS.map((id) => [id, []]));
  const tracks = new Map(doc.enemies.map((e) => [e.id, { e, s: [], seg: null }]));
  const upto = (t) => tracks.forEach((tr) => runTrack(tr, t, all));
  for (const m of doc.mechs.filter((k) => k.kind === "knock").sort(byT)) {
    upto(m.t);
    const ps = Object.fromEntries(ROLE_IDS.map((id) => [id, posWith(id, m.t, all[id])]));
    const eo = enemyOf(m);
    const origins = m.at === "players" ? m.roles.map((id) => ({ ...ps[id], owner: id }))
      : [m.at === "boss" ? (eo ? trackPos(tracks.get(eo.id), m.t) : { x: 0, y: 0 }) : { x: m.x, y: m.y }];
    for (const id of ROLE_IDS) {
      let vx = 0, vy = 0, hit = false;
      // 中心の人は飛ばされない。2人以上から押されたら、押す力を足す
      for (const o of origins) {
        if (o.owner === id) continue;
        let dx = ps[id].x - o.x, dy = ps[id].y - o.y;
        const d = Math.hypot(dx, dy);
        if (m.at === "players" && d > m.r) continue;
        if (d < 0.01) { dx = 0; dy = -1; } else { dx /= d; dy /= d; }
        vx += dx * m.dist;
        vy += dy * m.dist;
        hit = true;
      }
      if (!hit) continue;
      const next = doc.players[id].find((k) => k.t > m.t + 1e-6);
      all[id].push({ t0: m.t, vx, vy, end: next ? next.t : Infinity });
    }
  }
  upto(doc.dur + DT);
  cache.pushes = all;
  cache.tracks = tracks;
  return all;
}
const pos = (id, t) => posWith(id, t, allPushes()[id]);

// 動きの点を置く(同じ時間の点があれば動かす)
function setKey(id, t, x, y) {
  const keys = doc.players[id];
  t = round1(clamp(t, 0, doc.dur));
  const k = keys.find((q) => Math.abs(q.t - t) < 0.05);
  if (k) { k.x = round1(x); k.y = round1(y); return k; }
  const nk = { t, x: round1(x), y: round1(y) };
  keys.push(nk);
  keys.sort(byT);
  return nk;
}

// ---------- 配置プリセット ----------
// pos() = { MT: [x, y], … }。散開の距離はフィールドの半径の 0.75 倍
const spread = () => doc.size * 0.75;
// 8 方向散開の向き(北が 0°、時計回り)
const DIR8 = { MT: 0, D1: 45, H1: 90, D3: 135, ST: 180, D4: 225, H2: 270, D2: 315 };
// 4 人の小さな四角(重ならないように少しずらす)
const SQ4 = [[-0.8, -0.8], [0.8, -0.8], [-0.8, 0.8], [0.8, 0.8]];
const PRESETS = [
  { name: "初めの並び", pos: () => SPAWN },
  {
    // ボスの南 5m(中央から南へ 2m)に、輪にしてずらして集まる
    name: "全員集合",
    pos: () => Object.fromEntries(ROLE_IDS.map((id, i) =>
      [id, [Math.sin(i * Math.PI / 4) * 0.8, 2 - Math.cos(i * Math.PI / 4) * 0.8]])),
  },
  {
    // MT・H1・D1・D3 が東、ST・H2・D2・D4 が西(散開の距離の半分)
    name: "ライトパーティ",
    pos: () => {
      const d = spread() / 2;
      const out = {};
      [["MT", "H1", "D1", "D3"], ["ST", "H2", "D2", "D4"]].forEach((g, side) =>
        g.forEach((id, i) => { out[id] = [(side ? -d : d) + SQ4[i][0], SQ4[i][1]]; }));
      return out;
    },
  },
  {
    name: "8 方向散開",
    pos: () => Object.fromEntries(ROLE_IDS.map((id) => {
      const a = DIR8[id] * Math.PI / 180;
      return [id, [Math.sin(a) * spread(), -Math.cos(a) * spread()]];
    })),
  },
];
function applyPreset(pos) {
  ROLE_IDS.forEach((id) => setKey(id, time, pos[id][0], pos[id][1]));
  changed();
}
function renderPresets() {
  const row = (attr, i, name, del) => `<li><button type="button" class="btn btn--small" ${attr}="${i}" title="${esc(name)}"><span>${esc(name)}</span></button>${del ? `<button type="button" class="btn btn--small" data-pdel="${i}" title="このプリセットを消す">✕</button>` : ""}</li>`;
  $("presetList").innerHTML = PRESETS.map((p, i) => row("data-preset", i, p.name, false)).join("") +
    doc.presets.map((p, i) => row("data-mypreset", i, p.name, true)).join("");
}
// 引き出しの出し入れ。狭い画面では「✿ 詳細」の引き出しと重なるので、片方を開いたらもう片方はしまう
function setPresetOpen(open) {
  $("presetDrawer").classList.toggle("open", open);
  $("presetHandle").setAttribute("aria-expanded", String(open));
  $("presetHandle").title = open ? "配置プリセットをしまう" : "配置プリセットを出す";
  if (open && $("rightDrawer").classList.contains("open")) $("rightHandle").click();
}
$("presetHandle").addEventListener("click", () => setPresetOpen(!$("presetDrawer").classList.contains("open")));
$("rightHandle").addEventListener("click", () => {
  if ($("rightDrawer").classList.contains("open")) setPresetOpen(false);
});
$("presetList").addEventListener("click", (e) => {
  const b = e.target.closest("button");
  if (!b) return;
  if (b.dataset.preset) applyPreset(PRESETS[Number(b.dataset.preset)].pos());
  else if (b.dataset.mypreset) applyPreset(doc.presets[Number(b.dataset.mypreset)].pos);
  else if (b.dataset.pdel) { doc.presets.splice(Number(b.dataset.pdel), 1); changed(); }
});
// 今の時間の 8 人の場所(ノックバックのあと)を、名前を付けて足す
$("presetAdd").addEventListener("click", () => {
  const name = $("presetName").value.trim() || `プリセット ${doc.presets.length + 1}`;
  const at = Object.fromEntries(ROLE_IDS.map((id) => { const p = pos(id, time); return [id, [round1(p.x), round1(p.y)]]; }));
  doc.presets.push({ name, pos: at });
  $("presetName").value = "";
  changed();
});

// ---------- ギミックの形と当たり ----------
// 範囲1つぶん { x, y, ang(ラジアン), owner(メンバー) } の一覧
function instances(m, t) {
  const a = (m.angle || 0) * Math.PI / 180;
  if (m.at === "players") return m.roles.map((id) => ({ ...pos(id, t), ang: a, owner: id }));
  // 敵から出るときは、敵の正面が 0°
  const o = m.at === "boss" ? enemyPos(enemyOf(m), t) : { x: m.x, y: m.y, a: 0 };
  if (KINDS[m.kind].aim && m.roles.length) {
    return m.roles.map((id) => {
      const p = pos(id, t);
      return { x: o.x, y: o.y, ang: Math.atan2(p.x - o.x, -(p.y - o.y)), owner: id };
    });
  }
  return [{ x: o.x, y: o.y, ang: a + (m.at === "boss" ? o.a * Math.PI / 180 : 0), owner: null }];
}
function inside(m, s, p) {
  const dx = p.x - s.x, dy = p.y - s.y;
  const f = dx * Math.sin(s.ang) - dy * Math.cos(s.ang); // 前
  const r = dx * Math.cos(s.ang) + dy * Math.sin(s.ang); // 右
  const d = Math.hypot(dx, dy);
  switch (m.kind) {
    case "donut": return d >= m.inner && d <= m.r;
    case "line": return f >= 0 && f <= m.len && Math.abs(r) <= m.w / 2;
    case "cone": return d <= m.r && Math.abs(Math.atan2(r, f)) <= m.deg * Math.PI / 360;
    case "cross": return (Math.abs(f) <= m.len && Math.abs(r) <= m.w / 2) || (Math.abs(r) <= m.len && Math.abs(f) <= m.w / 2);
    case "knock": return false;
    default: return d <= m.r;
  }
}

// ---------- ギミックを足す・消す ----------
function addMech(kind) {
  const k = KINDS[kind];
  const m = {
    id: doc.nextId++, kind, name: k.name, t: 0, cast: 4, at: "boss", x: 0, y: -8, angle: 0, roles: [],
    r: 8, inner: 8, w: 8, len: 40, deg: 90, need: 1, dist: 15, ...k.def
  };
  m.roles = [...m.roles];
  // 敵を選んでいたら、その敵から出す
  const se = sel && sel.type === "enemy" ? enemyById(sel.id) : null;
  m.src = (se || doc.enemies[0] || {}).id;
  m.t = round1(clamp(time + m.cast, 0, doc.dur));
  doc.mechs.push(m);
  sel = { type: "mech", id: m.id };
  changed();
}
function deleteMech(id) {
  doc.mechs = doc.mechs.filter((m) => m.id !== id);
  if (sel && sel.type === "mech" && sel.id === id) sel = null;
  changed();
}
// ---------- セリフ ----------
const lineById = (id) => doc.lines.find((l) => l.id === id);
// 話す人の名前(敵が消されていたら、書いた名前)
const lineWho = (l) => (l.who != null && enemyById(l.who) ? enemyById(l.who).name : l.name) || "";
// 文字の数から決める長さ(秒)
const autoDur = (text) => round1(clamp(2 + [...text].length * 0.15, 2, 10));
function addLine() {
  const se = sel && sel.type === "enemy" ? enemyById(sel.id) : doc.enemies[0];
  const text = "セリフ";
  const l = { id: doc.nextId++, t: round1(time), text, who: se ? se.id : null, name: "", dur: autoDur(text), auto: true };
  doc.lines.push(l);
  sel = { type: "line", id: l.id };
  changed();
}
function deleteLine(id) {
  doc.lines = doc.lines.filter((l) => l.id !== id);
  if (sel && sel.type === "line" && sel.id === id) sel = null;
  changed();
}

// 敵を足す(今の時間に出てきて、最後までいる)
function addEnemy(type) {
  const e = newEnemy(doc.nextId++, type, round1(time));
  const n = doc.enemies.filter((q) => q.type === type).length;
  if (n) e.name += n + 1;
  doc.enemies.push(e);
  sel = { type: "enemy", id: e.id };
  changed();
}
function deleteEnemy(id) {
  doc.enemies = doc.enemies.filter((e) => e.id !== id);
  if (sel && sel.type === "enemy" && sel.id === id) sel = null;
  changed();
}
// 敵の動きの点を置く。出てくる時間より前なら、出てくる場所を動かす
function setEnemyKey(e, t, x, y, a) {
  t = round1(clamp(t, 0, doc.dur));
  if (t <= e.appear + 0.05) { e.x = round1(x); e.y = round1(y); e.a = a; return; }
  const k = e.keys.find((q) => Math.abs(q.t - t) < 0.05);
  if (k) { k.x = round1(x); k.y = round1(y); k.a = a; return; }
  e.keys.push({ t, x: round1(x), y: round1(y), a });
  e.keys.sort(byT);
}
// ねらう人を、時間 t から role にする(null なら動きの点で動く)
function setAggro(e, t, role) {
  t = round1(clamp(t, e.appear, doc.dur));
  e.aggro = e.aggro.filter((g) => Math.abs(g.t - t) >= 0.05);
  e.aggro.push({ t, role });
  e.aggro.sort(byT);
}

// ---------- 再生 ----------
function setTime(t) {
  time = clamp(t, 0, doc.dur);
  $("timeOut").textContent = time.toFixed(1);
  $("durBtn").textContent = doc.dur.toFixed(1);
  moveHead();
  if (sel && sel.type === "player") markKeyRow();
  renderAggroNow();
  draw();
}
function play() {
  if (time >= doc.dur) setTime(0);
  playing = true;
  $("play").textContent = "⏸︎";
  $("play").title = "止める";
  lastTs = performance.now();
  requestAnimationFrame(tick);
}
function stop() {
  playing = false;
  $("play").textContent = "▶︎";
  $("play").title = "再生";
}
function tick(ts) {
  if (!playing) return;
  const dt = (ts - lastTs) / 1000;
  lastTs = ts;
  setTime(time + dt * speed);
  if (time >= doc.dur) stop();
  else requestAnimationFrame(tick);
}

// ---------- 動画で保存 ----------
// フィールドの絵に、詠唱のバーとセリフの帯(画面の上の見た目のまま)を描き足して、0 秒から最後まで ×1 で録る
const VIDEO_TYPES = ["video/mp4;codecs=avc1", "video/mp4", "video/webm;codecs=vp9", "video/webm"];
const VIDEO_FPS = 30;
let rec = null; // 録画中 { cancel }
// 文字を幅で折り返す(1文字ずつはかる)
function wrapText(g, text, w) {
  const out = [];
  for (const para of text.split("\n")) {
    let line = "";
    for (const ch of para) {
      if (line && g.measureText(line + ch).width > w) { out.push(line); line = ch; }
      else line += ch;
    }
    out.push(line);
  }
  return out;
}
// 画面の上の箱(el)を、board からの位置のまま描く。k = 画面の 1px は動画の何 px か
function drawOverlays(g, k) {
  const b = $("board").getBoundingClientRect();
  const rect = (el) => {
    const e = el.getBoundingClientRect();
    return { x: (e.left - b.left) * k, y: (e.top - b.top) * k, w: e.width * k, h: e.height * k };
  };
  const box = (el, r) => {
    const s = getComputedStyle(el);
    const p = rect(el);
    g.beginPath();
    g.roundRect(p.x, p.y, p.w, p.h, r * k);
    g.fillStyle = s.backgroundColor;
    g.fill();
    if (parseFloat(s.borderTopWidth)) {
      g.lineWidth = parseFloat(s.borderTopWidth) * k;
      g.strokeStyle = s.borderTopColor;
      g.stroke();
    }
  };
  const text = (el, align) => {
    const s = getComputedStyle(el);
    const p = rect(el);
    const size = parseFloat(s.fontSize) * k;
    const lh = (parseFloat(s.lineHeight) || parseFloat(s.fontSize) * 1.5) * k;
    g.font = `${s.fontWeight} ${size}px ${s.fontFamily}`;
    g.fillStyle = s.color;
    g.textAlign = align;
    g.textBaseline = "middle";
    wrapText(g, el.textContent, p.w).forEach((ln, i) =>
      g.fillText(ln, align === "center" ? p.x + p.w / 2 : p.x, p.y + lh * (i + 0.5)));
  };
  if (!$("castbar").hidden) {
    box($("castbar"), 10);
    text($("castName"), "center");
    box(document.querySelector("#castbar i"), 3);
    if ($("castFill").getBoundingClientRect().width) box($("castFill"), 3);
  }
  if (!$("talk").hidden) {
    box($("talk"), 12);
    text($("talkWho"), "left");
    text($("talkText"), "left");
  }
}
async function recordVideo() {
  const type = VIDEO_TYPES.find((t) => window.MediaRecorder && MediaRecorder.isTypeSupported(t));
  if (!type) { alert("このブラウザでは動画を作れません"); return; }
  stop();
  const keep = { sel, time };
  sel = null;
  renderDetail();
  renderTimeline();
  const k = canvas.width / canvas.getBoundingClientRect().width;
  const out = document.createElement("canvas");
  out.width = canvas.width & ~1; // MP4 は縦横が偶数
  out.height = canvas.height & ~1;
  const g = out.getContext("2d");
  const frame = (t) => {
    setTime(t);
    g.fillStyle = getComputedStyle($("board")).backgroundColor; // canvas のすき通った所
    g.fillRect(0, 0, out.width, out.height);
    g.drawImage(canvas, 0, 0);
    drawOverlays(g, k);
  };
  const recorder = new MediaRecorder(out.captureStream(VIDEO_FPS), { mimeType: type, videoBitsPerSecond: 6e6 });
  const chunks = [];
  recorder.addEventListener("dataavailable", (e) => { if (e.data.size) chunks.push(e.data); });
  const done = new Promise((r) => recorder.addEventListener("stop", r));
  // 録っている間は、ほかの操作を止める
  rec = { cancel: false };
  document.querySelector("main.app").style.pointerEvents = "none";
  const btn = $("videoBtn");
  btn.title = "押すと録画をやめる";
  frame(0);
  recorder.start();
  const t0 = performance.now();
  const step = (ts) => {
    if (rec.cancel) { recorder.stop(); return; }
    const t = Math.min((ts - t0) / 1000, doc.dur);
    frame(t);
    btn.textContent = `⏹ 録画中 ${Math.floor(t)} / ${doc.dur} 秒`;
    if (t >= doc.dur) setTimeout(() => recorder.stop(), 300); // 最後の絵を少し残す
    else requestAnimationFrame(step);
  };
  requestAnimationFrame(step);
  await done;
  const canceled = rec.cancel;
  rec = null;
  document.querySelector("main.app").style.pointerEvents = "";
  btn.textContent = "🎬 動画で保存";
  btn.title = "0 秒から最後までを ×1 で録って保存する";
  sel = keep.sel;
  renderDetail();
  renderTimeline();
  setTime(keep.time);
  if (canceled) return;
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob(chunks, { type: type.split(";")[0] }));
  a.download = `raid-sim.${type.startsWith("video/mp4") ? "mp4" : "webm"}`;
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}
$("videoBtn").addEventListener("click", () => {
  if (rec) rec.cancel = true;
  else recordVideo();
});

// ---------- フィールドを描く ----------
const canvas = $("canvas");
const ctx = canvas.getContext("2d");
let view = { cx: 0, cy: 0, sc: 1 }; // 画面の px = cx + m × sc

function resizeCanvas() {
  const r = canvas.getBoundingClientRect();
  const dpr = window.devicePixelRatio || 1;
  canvas.width = Math.max(1, Math.round(r.width * dpr));
  canvas.height = Math.max(1, Math.round(r.height * dpr));
  draw();
}
function toWorld(e) {
  const r = canvas.getBoundingClientRect();
  return { x: (e.clientX - r.left - view.cx) / view.sc, y: (e.clientY - r.top - view.cy) / view.sc };
}
// 形の道すじ(m 単位の座標で)
function shapePath(m, s) {
  ctx.beginPath();
  ctx.save();
  ctx.translate(s.x, s.y);
  ctx.rotate(s.ang);
  switch (m.kind) {
    case "donut":
      ctx.arc(0, 0, m.r, 0, Math.PI * 2);
      ctx.moveTo(m.inner, 0);
      ctx.arc(0, 0, m.inner, 0, Math.PI * 2, true);
      break;
    case "line": ctx.rect(-m.w / 2, -m.len, m.w, m.len); break;
    case "cone": {
      const h = m.deg * Math.PI / 360;
      ctx.moveTo(0, 0);
      ctx.arc(0, 0, m.r, -Math.PI / 2 - h, -Math.PI / 2 + h);
      ctx.closePath();
      break;
    }
    case "cross":
      ctx.rect(-m.w / 2, -m.len, m.w, m.len * 2);
      ctx.rect(-m.len, -m.w / 2, m.len * 2, m.w);
      break;
    default: ctx.arc(0, 0, m.r, 0, Math.PI * 2);
  }
  ctx.restore();
}
const COLORS = { stack: [255, 196, 60], spread: [170, 110, 230], tower: [80, 150, 230], knock: [110, 110, 210] };
const rgba = (c, a) => `rgba(${c[0]},${c[1]},${c[2]},${a})`;
function drawArrows(s, dist, a, px) {
  ctx.strokeStyle = rgba(COLORS.knock, a);
  ctx.lineWidth = 3 * px;
  const len = clamp(Math.abs(dist), 2, 8) * Math.sign(dist || 1);
  for (let i = 0; i < 8; i++) {
    const g = i * Math.PI / 4;
    const ux = Math.sin(g), uy = -Math.cos(g);
    const r0 = 3, r1 = 3 + Math.abs(len);
    const [from, to] = dist >= 0 ? [r0, r1] : [r1, r0];
    const tx = s.x + ux * to, ty = s.y + uy * to;
    ctx.beginPath();
    ctx.moveTo(s.x + ux * from, s.y + uy * from);
    ctx.lineTo(tx, ty);
    ctx.moveTo(tx - (ux * 1.2 - uy * 0.8) * Math.sign(to - from), ty - (uy * 1.2 + ux * 0.8) * Math.sign(to - from));
    ctx.lineTo(tx, ty);
    ctx.lineTo(tx - (ux * 1.2 + uy * 0.8) * Math.sign(to - from), ty - (uy * 1.2 - ux * 0.8) * Math.sign(to - from));
    ctx.stroke();
  }
}
// ギミック1つを描く(phase:"cast" 詠唱中 / "flash" 発動 / "ghost" 選んでいるだけ)
function drawMech(m, phase, k, px) {
  const ins = instances(m, Math.min(time, m.t));
  const c = COLORS[m.kind] || [255, 128, 40];
  ins.forEach((s) => {
    if (m.kind === "knock") {
      const a = phase === "flash" ? 1 - k : phase === "ghost" ? 0.5 : 0.35 + 0.4 * k;
      if (phase === "ghost") ctx.setLineDash([4 * px, 4 * px]);
      // メンバーから出るときは、飛ばす範囲の円も描く
      if (m.at === "players") {
        ctx.beginPath();
        ctx.arc(s.x, s.y, m.r, 0, Math.PI * 2);
        ctx.strokeStyle = rgba(COLORS.knock, a * 0.7);
        ctx.lineWidth = 2 * px;
        ctx.stroke();
      }
      drawArrows(s, m.dist, a, px);
      ctx.setLineDash([]);
      return;
    }
    shapePath(m, s);
    if (phase === "ghost") {
      ctx.setLineDash([5 * px, 4 * px]);
      ctx.strokeStyle = rgba(c, 0.8);
      ctx.lineWidth = 2 * px;
      ctx.stroke();
      ctx.setLineDash([]);
    } else {
      ctx.fillStyle = rgba(c, phase === "flash" ? 0.55 * (1 - k) : 0.16 + 0.16 * k);
      ctx.fill("evenodd");
      ctx.strokeStyle = rgba(c, phase === "flash" ? 1 - k : 0.9);
      ctx.lineWidth = 2 * px;
      ctx.stroke();
    }
    // 塔の人数
    if (m.kind === "tower" || m.kind === "stack") {
      const n = ROLE_IDS.filter((id) => inside(m, s, pos(id, Math.min(time, m.t)))).length;
      ctx.fillStyle = rgba(c, 1);
      ctx.font = `700 ${13 * px}px sans-serif`;
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.fillText(`${n}/${m.need}`, s.x, s.y + (m.kind === "stack" ? m.r + 8 * px : 0));
    }
  });
}
function drawMark(g, mk, p, px) {
  const r = 1.4;
  g.fillStyle = mk.c + "33";
  g.strokeStyle = mk.c;
  g.lineWidth = 2.5 * px;
  g.beginPath();
  if (mk.sq) g.rect(p.x - r, p.y - r, r * 2, r * 2);
  else g.arc(p.x, p.y, r, 0, Math.PI * 2);
  g.fill();
  g.stroke();
  g.fillStyle = mk.c;
  g.font = `700 ${Math.min(13 * px, r * 1.3)}px sans-serif`; // 小さいプレビューでは、印からはみ出さない大きさに
  g.textAlign = "center";
  g.textBaseline = "middle";
  g.fillText(mk.id, p.x, p.y);
}
// 背景・床・方眼(5m ごと)を描いて、m の座標にする。返すのは { cx, cy, sc }(画面の px = cx + m × sc)
function drawArena(cv, g) {
  const W = cv.width, H = cv.height;
  const dpr = window.devicePixelRatio || 1;
  const R = doc.size;
  const v = { cx: W / dpr / 2, cy: H / dpr / 2, sc: Math.min(W, H) / dpr / 2 / (R * 1.12) };
  const px = 1 / v.sc;
  g.setTransform(1, 0, 0, 1, 0, 0);
  g.fillStyle = "#ebe3f7";
  g.fillRect(0, 0, W, H);
  g.setTransform(dpr * v.sc, 0, 0, dpr * v.sc, dpr * v.cx, dpr * v.cy);
  g.beginPath();
  if (doc.shape === "circle") g.arc(0, 0, R, 0, Math.PI * 2);
  else g.rect(-R, -R, R * 2, R * 2);
  g.fillStyle = "#fbf9ff";
  g.fill();
  g.save();
  g.clip();
  g.strokeStyle = "#ece4f8";
  g.lineWidth = px;
  g.beginPath();
  for (let t = -Math.floor(R / 5) * 5; t <= R; t += 5) {
    g.moveTo(t, -R); g.lineTo(t, R);
    g.moveTo(-R, t); g.lineTo(R, t);
  }
  g.stroke();
  g.restore();
  g.beginPath();
  if (doc.shape === "circle") g.arc(0, 0, R, 0, Math.PI * 2);
  else g.rect(-R, -R, R * 2, R * 2);
  g.strokeStyle = "#8a72b0";
  g.lineWidth = 3 * px;
  g.stroke();
  return v;
}
// 敵1体(p = { x, y, a }。三角が正面)
function drawEnemy(g, e, p, px, on) {
  const ty = ENEMY_TYPES[e.type];
  const r = ty.r;
  g.save();
  g.translate(p.x, p.y);
  g.rotate(p.a * Math.PI / 180);
  g.beginPath();
  g.arc(0, 0, r, 0, Math.PI * 2);
  g.fillStyle = ty.c;
  g.fill();
  if (on) {
    g.strokeStyle = "#9a6be0";
    g.lineWidth = 3 * px;
    g.beginPath();
    g.arc(0, 0, r + 3 * px, 0, Math.PI * 2);
    g.stroke();
  }
  g.beginPath();
  g.moveTo(0, -r * 1.55); g.lineTo(-r * 0.45, -r * 1.05); g.lineTo(r * 0.45, -r * 1.05); g.closePath();
  g.fillStyle = ty.c;
  g.fill();
  g.restore();
  // 画像があれば丸く切り抜いて、名前の代わりに出す(画像は向きで回さない)
  const im = e.img && enemyImage(e.img);
  if (im) {
    g.save();
    g.beginPath();
    g.arc(p.x, p.y, r - 1.5 * px, 0, Math.PI * 2);
    g.clip();
    g.drawImage(im, p.x - r, p.y - r, r * 2, r * 2);
    g.restore();
    return;
  }
  g.fillStyle = "#fff";
  g.font = `700 ${Math.min(12 * px, r * 0.7)}px sans-serif`;
  g.textAlign = "center";
  g.textBaseline = "middle";
  g.fillText(e.name.slice(0, 3), p.x, p.y);
}
// 敵の画像:data URL ごとに読みこんでおく。読めたら描き直す
const enemyImages = new Map();
function enemyImage(src) {
  let im = enemyImages.get(src);
  if (!im) {
    im = new Image();
    im.addEventListener("load", () => { draw(); drawMarkMap(); });
    im.src = src;
    enemyImages.set(src, im);
  }
  return im.complete && im.naturalWidth ? im : null;
}
// 選んだ画像を、まん中の正方形で切り取って ICON_PX に縮める
const ICON_PX = 128;
function shrinkImage(file) {
  return new Promise((resolve, reject) => {
    const url = URL.createObjectURL(file);
    const im = new Image();
    im.addEventListener("load", () => {
      const s = Math.min(im.naturalWidth, im.naturalHeight);
      const cv = document.createElement("canvas");
      cv.width = cv.height = ICON_PX;
      cv.getContext("2d").drawImage(im, (im.naturalWidth - s) / 2, (im.naturalHeight - s) / 2, s, s, 0, 0, ICON_PX, ICON_PX);
      URL.revokeObjectURL(url);
      resolve(cv.toDataURL("image/webp", 0.85));
    });
    im.addEventListener("error", () => { URL.revokeObjectURL(url); reject(); });
    im.src = url;
  });
}
function draw() {
  view = drawArena(canvas, ctx);
  const px = 1 / view.sc; // 画面の 1px は何 m か
  if (doc.marksOn) MARKS.forEach((mk) => drawMark(ctx, mk, doc.marks[mk.id], px));

  // ギミック:詠唱中 → 発動(光る)。選んでいて見えていないものは点線
  let casting = null;
  for (const m of [...doc.mechs].sort(byT)) {
    const start = m.t - m.cast;
    if (time >= start && time < m.t) {
      drawMech(m, "cast", m.cast ? (time - start) / m.cast : 1, px);
      if (!casting || start > casting.t - casting.cast) casting = m;
    } else if (time >= m.t && time < m.t + FLASH) {
      drawMech(m, "flash", (time - m.t) / FLASH, px);
    } else if (sel && sel.type === "mech" && sel.id === m.id) {
      drawMech(m, "ghost", 0, px);
    }
  }
  const cb = $("castbar");
  cb.hidden = !casting;
  if (casting) {
    $("castName").textContent = casting.name || KINDS[casting.kind].name;
    $("castFill").style.width = `${casting.cast ? (time - casting.t + casting.cast) / casting.cast * 100 : 100}%`;
  }
  // セリフ(重なったら、あとから出たもの)
  const talk = doc.lines.filter((l) => time >= l.t && time < l.t + l.dur).sort(byT).pop();
  $("talk").hidden = !talk;
  if (talk) {
    $("talkWho").textContent = lineWho(talk);
    $("talkText").textContent = talk.text;
  }

  // 地点のギミックを選んでいるときは、つまむ所
  const sm = sel && sel.type === "mech" ? mechById(sel.id) : null;
  if (sm && sm.at === "point") {
    ctx.beginPath();
    ctx.arc(sm.x, sm.y, 6 * px, 0, Math.PI * 2);
    ctx.fillStyle = "#fff";
    ctx.fill();
    ctx.strokeStyle = "#9a6be0";
    ctx.lineWidth = 2.5 * px;
    ctx.stroke();
  }

  // 敵(出ている間だけ)
  for (const e of doc.enemies) {
    if (enemyShown(e, time)) drawEnemy(ctx, e, enemyPos(e, time), px, sel && sel.type === "enemy" && sel.id === e.id);
  }

  // 選んでいるメンバーの道すじ
  if (sel && sel.type === "player") {
    const keys = doc.players[sel.id];
    const c = roleColor(sel.id);
    if (keys.length) {
      ctx.setLineDash([4 * px, 4 * px]);
      ctx.strokeStyle = c;
      ctx.lineWidth = 2 * px;
      ctx.beginPath();
      const s0 = basePos(sel.id, 0);
      ctx.moveTo(s0.x, s0.y);
      keys.forEach((k) => ctx.lineTo(k.x, k.y));
      ctx.stroke();
      ctx.setLineDash([]);
      keys.forEach((k) => {
        ctx.beginPath();
        ctx.arc(k.x, k.y, 3.5 * px, 0, Math.PI * 2);
        ctx.fillStyle = Math.abs(k.t - time) < 0.05 ? c : "#fff";
        ctx.fill();
        ctx.strokeStyle = c;
        ctx.stroke();
      });
    }
  }

  // メンバー
  const pr = Math.max(1, 11 * px);
  for (const ro of ROLES) {
    const p = pos(ro.id, time);
    ctx.beginPath();
    ctx.arc(p.x, p.y, pr, 0, Math.PI * 2);
    ctx.fillStyle = ro.c;
    ctx.fill();
    ctx.lineWidth = 2 * px;
    ctx.strokeStyle = "#fff";
    ctx.stroke();
    if (sel && sel.type === "player" && sel.id === ro.id) {
      ctx.beginPath();
      ctx.arc(p.x, p.y, pr + 3 * px, 0, Math.PI * 2);
      ctx.strokeStyle = "#9a6be0";
      ctx.lineWidth = 3 * px;
      ctx.stroke();
    }
    ctx.fillStyle = "#fff";
    ctx.font = `700 ${pr * 0.85}px sans-serif`;
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.fillText(ro.id, p.x, p.y + 0.5 * px);
  }
}

// フィールドの操作:メンバーをドラッグ → 今の時間に動きの点 / 地点のギミックを動かす(マーカーは右のプレビューで動かす)
let drag = null;
canvas.addEventListener("pointerdown", (e) => {
  const w = toWorld(e);
  const near = (p, rpx) => Math.hypot(p.x - w.x, p.y - w.y) <= rpx / view.sc;
  stop();
  const pl = [...ROLES].reverse().find((ro) => near(pos(ro.id, time), 14));
  const en = [...doc.enemies].reverse().find((q) => enemyShown(q, time) && near(enemyPos(q, time), ENEMY_TYPES[q.type].r * view.sc + 4));
  if (pl) {
    sel = { type: "player", id: pl.id };
    drag = { type: "player", id: pl.id, moved: false };
  } else if (en) {
    // 追いかけている間は、選ぶだけ(動かせない)
    sel = { type: "enemy", id: en.id };
    if (!aggroAt(en, time) || time <= en.appear + 0.05) drag = { type: "enemy", e: en };
  } else {
    const shown = doc.mechs.filter((m) => m.at === "point" &&
      ((sel && sel.type === "mech" && sel.id === m.id) || (time >= m.t - m.cast && time < m.t + FLASH)));
    const mm = shown.reverse().find((m) => near(m, 14));
    if (mm) {
      sel = { type: "mech", id: mm.id };
      drag = { type: "mech", m: mm };
    } else {
      sel = null;
    }
  }
  if (drag) canvas.setPointerCapture(e.pointerId);
  renderDetail();
  renderTimeline();
  draw();
});
canvas.addEventListener("pointermove", (e) => {
  if (!drag) return;
  const w = toWorld(e);
  if (drag.type === "player") {
    // ノックバックでずれている分を引いて、見た目の位置がつまんだ所になるように
    const p = pos(drag.id, time), b = basePos(drag.id, time);
    setKey(drag.id, time, w.x - (p.x - b.x), w.y - (p.y - b.y));
    drag.moved = true;
  } else if (drag.type === "enemy") {

// ---------- タイムライン ----------
const TL = { ruler: 20, lane: 22, row: 16, pad: 10 };
let tlScale = 10; // 1秒の px
const tx = (t) => TL.pad + t * tlScale;
// 帯(start 〜 end 秒)が重ならないように段に分ける
function laneOf(items, start, end) {
  const lanes = [];
  const out = new Map();
  for (const m of [...items].sort((a, b) => start(a) - start(b))) {
    const l0 = tx(start(m)), l1 = Math.max(tx(end(m)), l0 + 70);
    let i = lanes.findIndex((e) => e <= l0);
    if (i < 0) { i = lanes.length; lanes.push(0); }
    lanes[i] = l1 + 2;
    out.set(m.id, i);
  }
  return { lanes: Math.max(1, lanes.length), out };
}
// 帯の両はし(つかむと長さが変わる)。細い帯では小さくして、真ん中をつかめるように残す
const edges = (w) => {
  const s = `width:${Math.min(7, Math.max(2, w / 4))}px`;
  return `<span class="tl-edge" data-edge="l" style="${s}"></span><span class="tl-edge" data-edge="r" style="${s}"></span>`;
};
// 上(ギミック・セリフ・敵)と下(PT)の2つを描く。どちらも秒の目もりと今の時間の線を持つ
function renderTimeline() {
  tlScale = Math.max(8, ($("tlScrollA").clientWidth - TL.pad * 2) / doc.dur);
  const { lanes, out } = laneOf(doc.mechs, (m) => m.t - m.cast, (m) => m.t);
  const lineLanes = laneOf(doc.lines, (l) => l.t, (l) => l.t + l.dur);
  const mechH = lanes * TL.lane + 4;
  const lineH = lineLanes.lanes * TL.lane + 4;
  const top = { mech: TL.ruler, lines: TL.ruler + mechH, enemies: TL.ruler + mechH + lineH, players: TL.ruler };
  const W = tx(doc.dur) + TL.pad;
  const step = tlScale >= 20 ? 5 : tlScale >= 9 ? 10 : 30;
  let ruler = "";
  for (let t = 0; t <= doc.dur; t += step) ruler += `<div class="tl-tick" style="left:${tx(t)}px">${t}</div>`;
  ruler += `<div class="tl-row" style="top:${TL.ruler - 1}px;height:1px"></div>`;
  let h = ruler;
  for (const m of doc.mechs) {
    const on = sel && sel.type === "mech" && sel.id === m.id;
    const l = tx(Math.max(0, m.t - m.cast));
    const w = Math.max(8, tx(m.t) - l);
    h += `<div class="tl-mech${on ? " on" : ""}" data-mech="${m.id}" style="left:${l}px;width:${w}px;top:${top.mech + 2 + out.get(m.id) * TL.lane}px" title="${esc(m.name)}">${esc(m.name)}${edges(w)}</div>`;
  }
  for (const ln of doc.lines) {
    const on = sel && sel.type === "line" && sel.id === ln.id;
    const label = `${lineWho(ln)}「${ln.text}」`;
    const w = Math.max(8, tx(ln.t + ln.dur) - tx(ln.t));
    h += `<div class="tl-mech tl-line${on ? " on" : ""}" data-line="${ln.id}" style="left:${tx(ln.t)}px;width:${w}px;top:${top.lines + 2 + lineLanes.out.get(ln.id) * TL.lane}px" title="${esc(label)}">${esc(label)}${edges(w)}</div>`;
  }
  // 敵:出ている間の帯・動きの点・ねらう人の切りかえ(◆)
  doc.enemies.forEach((en, i) => {
    const y = top.enemies + i * TL.row;
    const on = sel && sel.type === "enemy" && sel.id === en.id;
    const c = ENEMY_TYPES[en.type].c;
    const l = tx(en.appear);
    h += `<div class="tl-row${on ? " on" : ""}" data-erow="${en.id}" style="top:${y}px;height:${TL.row}px"></div>`;
    const w = tx(en.vanish == null ? doc.dur : en.vanish) - l;
    h += `<div class="tl-span${on ? " on" : ""}" data-espan="${en.id}" style="left:${l}px;width:${w}px;top:${y + 1}px;--c:${c}">${edges(w)}</div>`;
    en.keys.forEach((k, j) => {
      h += `<div class="tl-key" data-ekey="${en.id}:${j}" style="left:${tx(k.t)}px;top:${y}px;--c:${c}"></div>`;
    });
    en.aggro.forEach((g, j) => {
      h += `<div class="tl-aggro" data-eaggro="${en.id}:${j}" style="left:${tx(g.t)}px;top:${y}px;--c:${g.role ? roleColor(g.role) : "#9a8fb0"}" title="${g.t.toFixed(1)} 秒から ${g.role || "動きの点"}"></div>`;
    });
  });
  h += `<div class="tl-head"></div>`;
  let hp = ruler;
  ROLES.forEach((ro, i) => {
    const y = top.players + i * TL.row;
    const on = sel && sel.type === "player" && sel.id === ro.id;
    hp += `<div class="tl-row${on ? " on" : ""}" data-row="${ro.id}" style="top:${y}px;height:${TL.row}px"></div>`;
    doc.players[ro.id].forEach((k, j) => {
      hp += `<div class="tl-key" data-key="${ro.id}:${j}" style="left:${tx(k.t)}px;top:${y}px;--c:${ro.c}"></div>`;
    });
  });
  hp += `<div class="tl-head"></div>`;
  const put = (id, html, height) => {
    const inner = $(id);
    inner.style.width = `${W}px`;
    inner.style.height = `${height}px`;
    inner.innerHTML = html;
  };
  // 左の名前
  let lb = `<div style="height:${TL.ruler}px">秒</div><div style="height:${mechH}px">ギミック</div><div style="height:${lineH}px">セリフ</div>`;
  doc.enemies.forEach((en) => {
    const on = sel && sel.type === "enemy" && sel.id === en.id;
    lb += `<div class="${on ? "on" : ""}" style="height:${TL.row}px" title="${esc(en.name)}">${esc(en.name)}</div>`;
  });
  let lp = `<div style="height:${TL.ruler}px">秒</div>`;
  ROLES.forEach((ro) => {
    const on = sel && sel.type === "player" && sel.id === ro.id;
    lp += `<div class="${on ? "on" : ""}" style="height:${TL.row}px">${ro.id}</div>`;
  });
  // たたんでいるほうは、秒の目もりの行だけ(左の欄は名前)
  const fill = (k, html, height, labels) => {
    const part = $(`tlPart${k}`);
    const open = part.classList.contains("open");
    put(`tlInner${k}`, open ? html : ruler + `<div class="tl-head"></div>`, open ? height : TL.ruler);
    $(`tlLabels${k}`).innerHTML = open ? labels : `<div style="height:${TL.ruler}px">${part.dataset.name}</div>`;
  };
  fill("A", h, top.enemies + doc.enemies.length * TL.row, lb);
  fill("B", hp, top.players + ROLES.length * TL.row, lp);
  moveHead();
}
function moveHead() {
  document.querySelectorAll(".tl-head").forEach((head) => { head.style.left = `${tx(time)}px`; });
}
let tlDrag = null;
const tlTime = (e) => {
  const r = e.currentTarget.getBoundingClientRect();
  return clamp((e.clientX - r.left - TL.pad) / tlScale, 0, doc.dur);
};
// 横スクロールを2つでそろえる
["A", "B"].forEach((k, i, all) => {
  $(`tlScroll${k}`).addEventListener("scroll", (e) => {
    const other = $(`tlScroll${all[1 - i]}`);
    if (other.scrollLeft !== e.currentTarget.scrollLeft) other.scrollLeft = e.currentTarget.scrollLeft;
  });
});
// 最小化ボタン(開いているかは覚えない)
function renderFold(part) {

document.querySelectorAll(".tl-part").forEach((part) => {

const tlInners = [$("tlInnerA"), $("tlInnerB")];
const LINE_MIN = 0.5;
const edgeOf = (e) => e.target.closest("[data-edge]")?.dataset.edge || null;
tlInners.forEach((el) => el.addEventListener("pointerdown", (e) => {
  stop();

  if (lEl) {

  } else if (ekEl) {

    const en = enemyById(id);

      type: "espan", e: en, edge: edgeOf(e), x0: e.clientX, moved: false,

tlInners.forEach((el) => el.addEventListener("pointermove", (e) => {
  if (!tlDrag) return;
  if (tlDrag.type === "scrub") { setTime(tlTime(e)); return; }
  const dt = (e.clientX - tlDrag.x0) / tlScale;
  const t = round1(tlDrag.t0 + dt);
  if (tlDrag.type === "mech") {
    // 左はし:詠唱の始まり(発動はそのまま) / 右はし:発動(始まりはそのまま) / 真ん中:全体
    const m = tlDrag.m;
    if (tlDrag.edge === "l") {
      const start = clamp(round1(tlDrag.start0 + dt), 0, m.t);
      m.cast = round1(m.t - start);
      setTime(start);
    } else if (tlDrag.edge === "r") {
      const start = Math.max(0, tlDrag.start0);
      m.t = clamp(t, start, doc.dur);
      m.cast = round1(m.t - tlDrag.start0);
      setTime(m.t);
    } else {
      m.t = clamp(t, 0, doc.dur);
      setTime(m.t);
    }
  } else if (tlDrag.type === "line") {
    // セリフ:はしを動かしたら、長さは文字の数から決めない
    const ln = tlDrag.k;
    if (tlDrag.edge === "l") {
      ln.t = clamp(t, 0, round1(tlDrag.end0 - LINE_MIN));
      ln.dur = round1(tlDrag.end0 - ln.t);
      ln.auto = false;
    } else if (tlDrag.edge === "r") {
      ln.dur = round1(clamp(tlDrag.end0 + dt, ln.t + LINE_MIN, doc.dur) - ln.t);
      ln.auto = false;
    } else {
      ln.t = clamp(t, 0, doc.dur);
    }
    setTime(tlDrag.edge === "r" ? ln.t + ln.dur : ln.t);
  } else if (tlDrag.type === "espan") {
    // 敵:左はし = 出てくる / 右はし = 消える(最後まで引くと「消えない」) / 真ん中 = 点・◆ごとずらす
    const en = tlDrag.e;
    const d = tlDrag;
    if (d.edge === "l") {
      en.appear = clamp(round1(d.appear0 + dt), 0, round1((d.vanish0 == null ? doc.dur : d.vanish0) - LINE_MIN));

    <div class="actions">
      <button type="button" class="btn btn--small btn--primary" id="ekeyHere">今の場所に点を打つ</button>
      <button type="button" class="btn btn--small btn--danger" id="enemyDelete">この敵を消す</button>
    </div>`;
  renderAggroNow();
}
function renderLineDetail(box, l) {
  const free = l.who == null || !enemyById(l.who);
  box.innerHTML = `<label class="field"><span>セリフ</span><textarea data-text="text" rows="3">${esc(l.text)}</textarea></label>
    <p class="sub">話す人</p><div class="seg">${doc.enemies.map((en) =>
      `<button type="button" class="btn btn--small" data-who="${en.id}" aria-pressed="${l.who === en.id}">${esc(en.name)}</button>`).join("")}<button type="button" class="btn btn--small" data-who="" aria-pressed="${free}">名前を書く</button></div>
    ${free ? `<label class="field" style="margin-top:10px"><span>名前</span><input type="text" data-text="name" value="${esc(l.name)}"></label>` : ""}
    <div class="row2" style="margin-top:10px">${num("t", "出る(秒)", l.t, 0, doc.dur)}${num("dur", "長さ(秒)", l.dur, 0.5, 60, 0.5)}</div>
    <div class="actions">
      <button type="button" class="switch" id="lineAuto" aria-pressed="${l.auto}">長さを文字の数から決める</button>
      <button type="button" class="btn btn--small btn--danger" id="lineDelete">このセリフを消す</button>
    </div>`;
}
// 今の時間の「ねらう人」(時間を動かすたびに描き直す)
function renderAggroNow() {
  const el = $("aggroNow");
  if (!el || !sel || sel.type !== "enemy") return;
  const cur = aggroAt(enemyById(sel.id), time);
  $("aggroNowLabel").textContent = `${time.toFixed(1)} 秒から ねらう人`;
  el.innerHTML = `<button type="button" data-aggro="" style="--c:#9a8fb0" aria-pressed="${!cur}">動きの点</button>` + ROLES.map((ro) =>
    `<button type="button" data-aggro="${ro.id}" style="--c:${ro.c}" aria-pressed="${cur === ro.id}">${ro.id}</button>`).join("");
}
function markKeyRow() {
  document.querySelectorAll("#keyList li").forEach((li) => {
    const k = doc.players[sel.id][Number(li.dataset.i)];
    li.classList.toggle("on", !!k && Math.abs(k.t - time) < 0.05);
  });
}
$("detail").addEventListener("input", (e) => {
  if (!sel || sel.type === "player") return;
  const m = sel.type === "enemy" ? enemyById(sel.id) : sel.type === "line" ? lineById(sel.id) : mechById(sel.id);
  const el = e.target;
  if (el.dataset.text) m[el.dataset.text] = el.value;
  else if (el.dataset.kangle) {
    const v = parseFloat(el.value);
    if (!Number.isFinite(v)) return;
    m.keys[Number(el.dataset.kangle)].a = clamp(v, -360, 360);
  } else if (el.dataset.num === "vanish" && el.value.trim() === "") m.vanish = null;
  else if (el.dataset.num) {
    const v = parseFloat(el.value);
    if (!Number.isFinite(v)) return;
    m[el.dataset.num] = Number(el.min) <= v && v <= Number(el.max) ? v : clamp(v, Number(el.min), Number(el.max));
  } else return;
  // セリフ:文字を変えたら長さも決め直す。長さを書いたら、自動はやめる
  if (sel.type === "line") {
    if (el.dataset.text === "text" && m.auto) {
      m.dur = autoDur(m.text);
      $("detail").querySelector('[data-num="dur"]').value = m.dur;
    }
    if (el.dataset.num === "dur") {
      m.auto = false;
      $("lineAuto").setAttribute("aria-pressed", "false");
    }
  }
  changed(true);
});
// 敵の画像を選んだら、縮めてから入れる
$("detail").addEventListener("change", async (e) => {
  if (e.target.id !== "enemyImgFile" || !sel || sel.type !== "enemy") return;
  const file = e.target.files[0];
  if (!file) return;
  const en = enemyById(sel.id);
  try { en.img = await shrinkImage(file); } catch { return; }
  changed();
});
$("detail").addEventListener("click", (e) => {
  const b = e.target.closest("button");
  if (!b || !sel) return;
  if (sel.type === "player") {
    const keys = doc.players[sel.id];
    if (b.dataset.go) setTime(keys[Number(b.dataset.go)].t);
    else if (b.dataset.del) { keys.splice(Number(b.dataset.del), 1); changed(); }
    else if (b.id === "keyHere") { const p = basePos(sel.id, time); setKey(sel.id, time, p.x, p.y); changed(); }
    else if (b.id === "keyClear") { doc.players[sel.id] = []; changed(); }
    return;
  }
  if (sel.type === "line") {
    const l = lineById(sel.id);
    if (b.dataset.who !== undefined) l.who = b.dataset.who ? Number(b.dataset.who) : null;
    else if (b.id === "lineAuto") { l.auto = !l.auto; if (l.auto) l.dur = autoDur(l.text); }
    else if (b.id === "lineDelete") { deleteLine(l.id); return; }
    else return;
    changed();
    return;
  }
  if (sel.type === "enemy") {
    const en = enemyById(sel.id);
    if (b.dataset.etype) en.type = b.dataset.etype;
    else if (b.dataset.aggro !== undefined) setAggro(en, time, b.dataset.aggro || null);
    else if (b.dataset.ago) { setTime(en.aggro[Number(b.dataset.ago)].t); return; }
    else if (b.dataset.adel) en.aggro.splice(Number(b.dataset.adel), 1);
    else if (b.dataset.ego) { setTime(en.keys[Number(b.dataset.ego)].t); return; }
    else if (b.dataset.edel) en.keys.splice(Number(b.dataset.edel), 1);
    else if (b.id === "ekeyHere") { const p = enemyPos(en, time); setEnemyKey(en, time, p.x, p.y, Math.round(p.a)); }
    else if (b.id === "enemyDelete") { deleteEnemy(en.id); return; }
    else if (b.id === "enemyImgPick") { $("enemyImgFile").click(); return; }
    else if (b.id === "enemyImgClear") en.img = null;
    else return;
    changed();
    return;
  }
  const m = mechById(sel.id);
  if (b.dataset.at) m.at = b.dataset.at;
  else if (b.dataset.src) m.src = Number(b.dataset.src);
  else if (b.dataset.role) {
    const id = b.dataset.role;
    m.roles = m.roles.includes(id) ? m.roles.filter((r) => r !== id) : ROLE_IDS.filter((r) => r === id || m.roles.includes(r));
  } else if (b.id === "mechDelete") { deleteMech(m.id); return; }
  else return;
  changed();
});

// ---------- 右:フィールド ----------
function renderField() {
  $("arenaShape").innerHTML = [["circle", "⚪ 丸"], ["square", "⬜ 四角"]].map(([v, l]) =>
    `<button type="button" class="btn btn--small" data-shape="${v}" aria-pressed="${doc.shape === v}">${l}</button>`).join("");
  $("arenaSize").value = doc.size;
  $("marksToggle").setAttribute("aria-pressed", String(doc.marksOn));
  renderMarkInputs();
}
$("arenaShape").addEventListener("click", (e) => {
  const b = e.target.closest("[data-shape]");
  if (!b) return;
  doc.shape = b.dataset.shape;
  renderField();
  changed();
});
$("arenaSize").addEventListener("change", (e) => {
  const v = parseFloat(e.target.value);
  if (Number.isFinite(v)) doc.size = clamp(v, 5, 60);
  renderField();
  changed();
});
// 長さ(秒):タイムラインの上の数字を押すと入力欄に変わる。Enter・外を押す で決める、Esc でやめる
const durEdit = (on) => {
  $("durBtn").hidden = on;
  $("duration").hidden = !on;
  if (on) { $("duration").value = doc.dur; $("duration").focus(); $("duration").select(); }
};
$("durBtn").addEventListener("click", () => durEdit(true));
$("duration").addEventListener("change", (e) => {
  const v = parseFloat(e.target.value);
  if (Number.isFinite(v)) doc.dur = clamp(Math.round(v), 10, 900);
  changed();
  setTime(Math.min(time, doc.dur));
});
$("duration").addEventListener("blur", () => durEdit(false));
$("duration").addEventListener("keydown", (e) => {
  if (e.key === "Enter") $("duration").blur();
  else if (e.key === "Escape") { $("duration").value = doc.dur; $("duration").blur(); }
});
$("marksToggle").addEventListener("click", () => {
  doc.marksOn = !doc.marksOn;
  renderField();
  changed();
});
$("marksReset").addEventListener("click", () => {
  doc.marks = defaultMarks(doc.size);
  renderField();
  changed();
});

// マーカーの小さいプレビュー(ドラッグで動かす)と数字の欄。戦闘中は動かないので、真ん中のフィールドでは動かさない
const markCanvas = $("markCanvas");
const markCtx = markCanvas.getContext("2d");
let markView = { cx: 0, cy: 0, sc: 1 };
let markDrag = null;
function drawMarkMap() {
  const r = markCanvas.getBoundingClientRect();
  if (!r.width) return; // 狭い画面で、ほかのタブを開いているとき
  const dpr = window.devicePixelRatio || 1;
  const w = Math.round(r.width * dpr), h = Math.round(r.height * dpr);
  if (markCanvas.width !== w || markCanvas.height !== h) { markCanvas.width = w; markCanvas.height = h; }
  markView = drawArena(markCanvas, markCtx);
  const px = 1 / markView.sc;
  doc.enemies.filter((e) => enemyShown(e, 0)).forEach((e) => drawEnemy(markCtx, e, { x: e.x, y: e.y, a: e.a }, px, false));
  MARKS.forEach((mk) => drawMark(markCtx, mk, doc.marks[mk.id], px));
}
function renderMarkInputs() {
  const input = (mk, axis, name) => `<input type="number" data-mark="${mk.id}" data-axis="${axis}" min="-60" max="60" step="0.5" value="${doc.marks[mk.id][axis]}" aria-label="${mk.id} の${name}">`;
  $("markInputs").innerHTML = "<span></span><span>東西(m)</span><span>南北(m)</span>" + MARKS.map((mk) =>
    `<span class="role" style="--c:${mk.c}">${mk.id}</span>${input(mk, "x", "東西")}${input(mk, "y", "南北")}`).join("");
}
$("markInputs").addEventListener("input", (e) => {
  const el = e.target.closest("[data-mark]");
  if (!el) return;
  const v = parseFloat(el.value);
  if (!Number.isFinite(v)) return;
  doc.marks[el.dataset.mark][el.dataset.axis] = round1(clamp(v, -60, 60));
  changed(true);
});
function markAt(e) {
  const r = markCanvas.getBoundingClientRect();
  return { x: (e.clientX - r.left - markView.cx) / markView.sc, y: (e.clientY - r.top - markView.cy) / markView.sc };
}
markCanvas.addEventListener("pointerdown", (e) => {
  const w = markAt(e);
  const mk = [...MARKS].reverse().find((k) => Math.hypot(doc.marks[k.id].x - w.x, doc.marks[k.id].y - w.y) <= 16 / markView.sc);
  if (!mk) return;
  markDrag = mk.id;
  markCanvas.setPointerCapture(e.pointerId);
});
markCanvas.addEventListener("pointermove", (e) => {
  if (!markDrag) return;
  const w = markAt(e);
  const p = { x: round1(clamp(w.x, -60, 60)), y: round1(clamp(w.y, -60, 60)) };
  doc.marks[markDrag] = p;
  document.querySelectorAll(`#markInputs [data-mark="${markDrag}"]`).forEach((el) => { el.value = p[el.dataset.axis]; });
  draw();
  drawMarkMap();
});
const endMarkDrag = () => {
  if (!markDrag) return;
  markDrag = null;
  changed(true);
};
markCanvas.addEventListener("pointerup", endMarkDrag);
markCanvas.addEventListener("pointercancel", endMarkDrag);
$("clearAll").addEventListener("click", () => {
  if (!confirm("ギミックと動きを、ぜんぶ消しますか?")) return;
  doc = blank();
  sel = null;
  renderField();
  changed();
  setTime(0);
});

// ---------- 再生のボタン・キー ----------
$("play").addEventListener("click", () => (playing ? stop() : play()));
$("toStart").addEventListener("click", () => { stop(); setTime(0); });
$("undoBtn").addEventListener("click", undo);
$("redoBtn").addEventListener("click", redo);
$("toEnd").addEventListener("click", () => { stop(); setTime(doc.dur); });
// 5 秒戻る・進む(再生中はそのまま再生を続ける)
const SKIP = 5;
$("back").addEventListener("click", () => setTime(clamp(round1(time - SKIP), 0, doc.dur)));
$("fwd").addEventListener("click", () => setTime(clamp(round1(time + SKIP), 0, doc.dur)));
function renderSpeeds() {
  $("speeds").innerHTML = SPEEDS.map((s) =>
    `<button type="button" class="btn btn--small" data-speed="${s}" aria-pressed="${s === speed}">×${s}</button>`).join("");
}
$("speeds").addEventListener("click", (e) => {
  const b = e.target.closest("[data-speed]");
  if (!b) return;
  speed = Number(b.dataset.speed);
  renderSpeeds();
});
document.addEventListener("keydown", (e) => {
  if (rec || e.target.closest("input, textarea, select")) return;
  const k = e.key.toLowerCase();
  if ((e.ctrlKey || e.metaKey) && (k === "z" || k === "y")) {
    e.preventDefault();
    if (k === "y" || e.shiftKey) redo(); else undo();
    return;
  }
  if (e.key === " ") {
    e.preventDefault();
    if (playing) stop(); else play();
  } else if (e.key === "ArrowLeft" || e.key === "ArrowRight") {
    e.preventDefault();
    stop();
    setTime(round1(time + (e.key === "ArrowLeft" ? -1 : 1) * (e.shiftKey ? 1 : 0.1)));
  } else if (e.key === "Delete" || e.key === "Backspace") {
    if (!sel) return;
    if (sel.type === "mech") deleteMech(sel.id);
    else if (sel.type === "line") deleteLine(sel.id);
    else if (sel.type === "enemy") {
      // 敵は、今の時間の動きの点を消す(敵ごと消すのは詳細のボタン)
      const en = enemyById(sel.id);
      const i = en.keys.findIndex((k) => Math.abs(k.t - time) < 0.05);
      if (i >= 0) { en.keys.splice(i, 1); changed(); }
    } else {
      const keys = doc.players[sel.id];
      const i = keys.findIndex((k) => Math.abs(k.t - time) < 0.05);
      if (i >= 0) { keys.splice(i, 1); changed(); }
    }
  }
});

new ResizeObserver(() => { resizeCanvas(); renderTimeline(); }).observe($("board"));
new ResizeObserver(() => renderTimeline()).observe($("tlScrollA"));
new ResizeObserver(() => drawMarkMap()).observe(markCanvas);
renderSpeeds();
renderField();
changed();
setTime(0);
</script>
</body>
</html>
